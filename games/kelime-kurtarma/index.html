<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/kelime-kurtarma/">
<title>Kelime Kurtarma — Balonları Koru, Kelimeyi Bul!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 4 / 4.12
     (Adam Asmaca — TEMA YUMUŞATILDI: asılan adam YOK; balon demetli karakter,
     balonlar biterse PARAŞÜTLE süzülür). Tasarım: EGITSEL-OYUN-PLANI §4.12 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --sky1:#ffe3ec; --sky2:#c9e6ff; --panel:#ffffff; --ink:#3a2a4a; --ink-dim:#8a7a9a;
  --hot:#ff5e9a; --ok:#5fae6e; --gold:#f4a93c; --bad:#d6536a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(26px,7vw,44px);text-shadow:0 2px 0 rgba(255,255,255,.7)}
#screen-menu .sub{opacity:.85;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:470px}
.tierGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,94vw);margin-bottom:12px}
.tierBtn{background:#fff;color:var(--ink);padding:12px 8px;font-size:15px;font-weight:700;border:3px solid #f0d9e6;display:flex;flex-direction:column;gap:3px}
.tierBtn small{font-weight:400;font-size:11.5px;color:var(--ink-dim)}
.tierBtn.on{border-color:var(--hot);transform:scale(1.03)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #b23064}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b23064}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:8px;min-height:17px}

#screen-game{padding:0;justify-content:flex-start}
#topBar{width:100%;background:rgba(255,255,255,.85);padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.chip{background:#fff;border-radius:9px;padding:4px 10px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#stage{flex:1;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;overflow:hidden}
#balloonGuy{position:relative;height:188px;display:flex;flex-direction:column;align-items:center;transition:transform 1.6s ease-in}
#balloons{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:200px;min-height:70px}
.bal{font-size:34px;line-height:1;transition:transform .3s, opacity .3s}
.bal.pop{transform:scale(2);opacity:0}
#hero{font-size:54px;line-height:1;margin-top:-6px}
#hintBox{background:#fff;border-radius:14px;padding:9px 16px;font-size:clamp(13px,3.7vw,16px);font-weight:700;max-width:92vw;box-shadow:0 3px 10px rgba(0,0,0,.1)}
#wordRow{display:flex;gap:6px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap;max-width:96vw}
.slot{width:clamp(26px,7.4vw,38px);height:clamp(34px,9vw,46px);border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,5.4vw,26px)}
.slot.sp{border:none;width:14px}
#kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 8px 14px;max-width:560px;margin:0 auto}
.key{width:clamp(30px,8.4vw,44px);height:clamp(38px,10vw,48px);background:#fff;color:var(--ink);font-weight:900;font-size:clamp(14px,4vw,18px);border:2px solid #e0d0ea;border-radius:10px}
.key:disabled{opacity:.35}
.key.hit{background:#d8f3e0;border-color:var(--ok)}
.key.missK{background:#f8d7dc;border-color:var(--bad)}
#jokerBtn{background:var(--gold);color:#4a3000;font-weight:900;padding:0 14px;border-radius:10px;font-size:13px}

#screen-result #resEmoji{font-size:52px}
#resScore{font-size:clamp(30px,8.6vw,46px);font-weight:900;color:var(--hot)}
#resStats{background:#fff;border-radius:14px;padding:14px 20px;font-size:15px;line-height:1.7;margin:10px 0;max-width:420px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
#eduLine{font-weight:800}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🎈 KELİME KURTARMA 🔤</h1>
  <p class="sub">Karakterimiz balonlarla havada! Her yanlış harf bir balon patlatır. Balonlar biterse korkma — paraşütüyle yumuşacık iner. Kelimeyi bul, onu uçur!</p>
  <div class="tierGrid">
    <button class="tierBtn on" data-t="1">🏕️ Etek<small>3-4 harf · resimli · 8 balon</small></button>
    <button class="tierBtn" data-t="2">⛰️ Yamaç<small>5-6 harf · 6 balon</small></button>
    <button class="tierBtn" data-t="3">🧗 Tırmanış<small>EN kelime · tanımlı · 5 balon</small></button>
    <button class="tierBtn" data-t="4">🏔️ Zirve<small>Deyim tamamlama · 4 balon</small></button>
  </div>
  <button class="bigBtn" id="bPlay">🎈 BAŞLA</button>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="topBar">
    <span class="chip" id="scoreChip">⭐ 0</span>
    <span class="chip" id="balChip">🎈 8</span>
    <span class="chip" id="wordChip">📚 0</span>
    <button class="chip" id="bQuitTop">🏠</button>
  </div>
  <div id="stage">
    <div id="balloonGuy">
      <div id="balloons"></div>
      <div id="hero">🐻</div>
    </div>
    <div id="hintBox">💡 İpucu</div>
    <div id="wordRow"></div>
  </div>
  <div id="kb"></div>
</div>

<div class="screen" id="screen-result">
  <div id="resEmoji">🎉</div>
  <h1 style="font-size:25px" id="resTitle">Kurtarıldı!</h1>
  <div id="resScore">0</div>
  <div id="resStats"></div>
  <div id="eduLine"></div>
  <button class="bigBtn" id="bAgain" style="margin-top:12px">▶️ Sıradaki Kelime</button>
  <button class="ghost" id="bMenu">🏠 Menü</button>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
