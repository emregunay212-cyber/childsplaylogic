     (Mafia Wars görev döngüsü — SOSYAL KISIM TAMAMEN ÇIKARILDI; takım üyeleri
     gerçek kişi değil, kazanılan KARAKTERLERDİR). Tasarım: EGITSEL-OYUN-PLANI §4.6 -->
<style>
:root{
  --bg1:#1f2a44; --bg2:#141c30; --panel:#2a3a5e; --panel2:#35496f; --line:#46598a;
  --ink:#f3f7ff; --ink-dim:#aebbd8; --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b; --xp:#8a7bff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}

/* ===== ÜST BAR ===== */
#top{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
#hudRow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;font-weight:800}
.chip{background:var(--panel);border-radius:10px;padding:5px 11px;white-space:nowrap}
#energyChip.low{color:#ffb3a0}
#xpBarWrap{height:8px;background:var(--panel);border-radius:6px;overflow:hidden}
#xpBar{height:100%;width:0%;background:linear-gradient(90deg,var(--xp),#b3a8ff);transition:width .4s}
#tabs{display:flex;gap:6px}
.tab{flex:1;background:var(--panel);color:var(--ink-dim);padding:9px 4px;font-size:13.5px;font-weight:800;border-radius:12px 12px 0 0}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}

/* ===== İÇERİK ===== */
#content{flex:1;overflow-y:auto;background:var(--panel2);border-radius:0 0 14px 14px;padding:12px;-webkit-overflow-scrolling:touch}
.qCard{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;border:2px solid transparent}
.qCard.done{opacity:.55;border-color:var(--ok)}
.qIc{font-size:30px;width:44px;text-align:center}
.qBody{flex:1;min-width:0}
.qTitle{font-weight:800;font-size:15px}
.qSub{font-size:12px;color:var(--ink-dim);margin-top:2px}
.qBtn{background:var(--gold);color:#3c2a0e;font-weight:900;padding:9px 13px;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 #b8901c}
.qBtn:disabled{background:var(--line);color:var(--ink-dim);box-shadow:none}
.qBtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b8901c}
.secHead{font-size:13px;font-weight:800;color:var(--ink-dim);margin:6px 2px 8px;display:flex;justify-content:space-between}

/* takım kartları */
#teamGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.charCard{background:var(--panel);border-radius:14px;padding:12px 8px;text-align:center;border:2px solid var(--line)}
.charCard.locked{opacity:.45;filter:grayscale(.8)}
.charCard.leg{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.25)}
.charEmoji{font-size:38px}
.charName{font-weight:800;font-size:13.5px;margin-top:4px}
.charBonus{font-size:11.5px;color:var(--gold);font-weight:700;margin-top:2px}
.charDers{font-size:11px;color:var(--ink-dim)}

/* ===== QUIZ OVERLAY ===== */
.veil{position:fixed;inset:0;background:rgba(10,16,32,.9);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel2);border-radius:18px;padding:18px;width:min(460px,96vw);max-height:92vh;overflow:auto;text-align:center}
#qzFuseWrap{height:7px;background:var(--panel);border-radius:5px;overflow:hidden;margin:10px 0}
#qzFuse{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
#qzText{font-size:clamp(17px,4.8vw,22px);font-weight:800;min-height:54px;display:flex;align-items:center;justify-content:center}
#qzOpts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.opt{background:var(--panel);color:var(--ink);padding:13px 8px;font-size:15px;font-weight:700;border:2px solid var(--line)}
.opt.right{background:#1d5c38;border-color:var(--ok)}
.opt.wrong{background:#5c1d28;border-color:#d6536a}
.opt:disabled{cursor:default}
#qzInfo{font-size:12.5px;color:var(--ink-dim);margin-top:8px}
.bigBtn{background:var(--hot);color:#fff;font-size:17px;font-weight:800;padding:13px 28px;box-shadow:0 4px 0 #c2503a;margin-top:12px}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#rwChar{font-size:64px;animation:bounceIn .6s}
@keyframes bounceIn{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e1830;color:#fff;
  padding:10px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>

  <div id="content"></div>
</div>

<div class="veil" id="quizVeil">
  <div class="card">

    <div id="qzText"></div>
    <div id="qzOpts"></div>
  </div>
</div>

<!-- GÖREV SONU -->
<div class="veil" id="resultVeil">

</div>

<!-- YENİ KARAKTER -->
<div class="veil" id="charVeil">

    <div id="rwName" style="font-weight:900;font-size:20px"></div>
    <div id="rwBonus" style="color:var(--gold);font-weight:800;margin-top:4px"></div>
    <p style="font-size:12.5px;color:var(--ink-dim);margin-top:8px">Takım üyeleri sana asla cevap vermez — sadece puanını artırır!</p>
    <button class="bigBtn" id="charOk">Harika!</button>
  </div>
</div>

<div id="toast"></div>

<!-- window.storage köprüsü (hub gameSaves senkronu) -->
<script>
(function () {
  if (window.storage && window.storage.get && window.storage.set) return;
  window.storage = {
    get: function (key) {
      try { var v = localStorage.getItem(key); return Promise.resolve(v != null ? { value: v } : null); }
      catch (e) { return Promise.resolve(null); }
    },
    set: function (key, value) {
      try { localStorage.setItem(key, value); return Promise.resolve(); }
      catch (e) { return Promise.resolve(); }
    },
    remove: function (key) {
      try { localStorage.removeItem(key); return Promise.resolve(); }
      catch (e) { return Promise.resolve(); }
    }
  };
})();
</script>

const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function enQuestion(){
  const [en, tr] = pick(EN_WORDS);
  const toEn = Math.random() < 0.5;
  const correct = toEn ? en : tr;
  const set = new Set([correct]);
  while (set.size < 4){ const w = pick(EN_WORDS); set.add(toEn ? w[0] : w[1]); }
  const o = shuffle([...set]);
  return { d: 'en', q: toEn ? `'${tr}' İngilizcede nedir?` : `'${en}' Türkçede nedir?`, o, a: o.indexOf(correct) };
}
const asked = new Set();
/* Prosedürel EN üretici tekrar-önleme: son ~10 EN sorusunu hatırla, sınırlı denemeyle yenisini üret */
const askedEn = [];
const EN_RECENT_MAX = 10;        // hafızada tutulacak son EN soru sayısı
const EN_RETRY = 12;             // benzersiz soru için maksimum yeniden üretme denemesi
function uniqueEnQuestion(){
  let q = enQuestion();
  for (let n = 0; n < EN_RETRY && askedEn.includes(q.q); n++) q = enQuestion();
  askedEn.push(q.q);
  while (askedEn.length > EN_RECENT_MAX) askedEn.shift();
  return q;
}
function nextQuestion(ders){
  const d = ders === 'mix' ? pick(['mat', 'tr', 'fen', 'en']) : ders;
  if (d === 'en') return uniqueEnQuestion();
  let pool = BANK.filter(x => x.d === d && !asked.has(x.q));
  if (!pool.length){ BANK.forEach(x => { if (x.d === d) asked.delete(x.q); }); pool = BANK.filter(x => x.d === d); }
  const q = pick(pool);
  asked.add(q.q);
  return { ...q, o: q.o.slice() };
}

/* ================= Audio ================= */
const Audio2 = (() => {
  let ctx = null;
  function init(){ if (!ctx){ try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function tone(f, dur, type, vol, when){
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(vol || 0.06, ctx.currentTime + (when || 0));
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (when || 0) + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + (when || 0)); o.stop(ctx.currentTime + (when || 0) + dur + 0.02);
  }
  return {
    init,
    ok:   () => { tone(660, 0.1, 'triangle', 0.07); tone(880, 0.14, 'triangle', 0.07, 0.1); },
    bad:  () => tone(160, 0.28, 'sawtooth', 0.05),
    done: () => [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.07, i * 0.11)),
    char: () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.16, 'triangle', 0.08, i * 0.12)),
  };
})();

/* ================= Bridge (§6.1 stub) ================= */
const BilnetBridge = {
  QUEUE_KEY: 'bilnet_score_queue',
  async submitScore(payload){
    const rec = { ...payload, ts: Date.now() };
    try {
      const r = await window.storage.get(this.QUEUE_KEY);
      const q = r && r.value ? JSON.parse(r.value) : [];
      q.push(rec);
      while (q.length > 50) q.shift();
      await window.storage.set(this.QUEUE_KEY, JSON.stringify(q));
    } catch (e) {}
  },
};

/* ================= KALICI DURUM ================= */
const SAVE_KEY = 'bilgitakimi_save';
const STATS_KEY = 'bilgitakimi_stats';
let S = {
  energy: CONFIG.DAILY_ENERGY, energyDay: '',
  xp: 0, score: 0,
  chars: ['asli'],                  // başlangıç üyesi
  questsDone: 0,
  daily: [], dailyDay: '',
  seasonKey: '', seasonDone: [],
};
let STATS = { quests: 0, correct: 0, wrong: 0, seasonsCompleted: 0 };
const dayKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const monthKey = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1); };
function persist(){ try { window.storage.set(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function saveStats(){ try { window.storage.set(STATS_KEY, JSON.stringify(STATS)); } catch (e) {} }
function level(){ return 1 + Math.floor(S.xp / CONFIG.XP_PER_LEVEL); }

/* ================= GÖREV ÜRETİMİ ================= */
function genDaily(){
  const tipler = ['fast', 'fast', 'normal', 'normal', 'normal', 'epic'];
  const dersler = shuffle(['mat', 'tr', 'fen', 'en', 'mix', pick(['mat', 'tr', 'fen', 'en'])]);
  S.daily = tipler.map((t, i) => ({
    tip: t, ders: dersler[i],
    ad: pick(QUEST_NAMES[dersler[i]]),
    done: false,
  }));
  S.dailyDay = dayKey();
}
function seasonQuest(i){
  const tip = i % 10 === 9 ? 'epic' : (i % 3 === 2 ? 'normal' : 'fast');
  const ders = ['mat', 'tr', 'fen', 'en', 'mix'][i % 5];
  return { tip, ders, ad: `${i + 1}. ${pick(QUEST_NAMES[ders])}` };
}
function rollDays(){
  const t = dayKey();
  if (S.energyDay !== t){ S.energyDay = t; S.energy = CONFIG.DAILY_ENERGY; }
  if (S.dailyDay !== t) genDaily();
  const m = monthKey();
  if (S.seasonKey !== m){ S.seasonKey = m; S.seasonDone = []; }
}

/* ================= KARAKTER BONUSU (max +%25, sadece çarpan) ================= */
function bonusFor(ders){
  let best = 0;
  for (const id of S.chars){
    const c = CHARS.find(x => x.id === id);
    if (!c) continue;
    if (c.ders === ders || c.ders === 'mix' || ders === 'mix') best = Math.max(best, c.b);
  }
  return Math.min(25, best);
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
let toastT = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
function refreshHUD(){
  $('energyChip').textContent = `⚡ ${S.energy}/${CONFIG.DAILY_ENERGY}`;
  $('energyChip').classList.toggle('low', S.energy <= 3);
  $('lvlChip').textContent = `🎖️ Sv ${level()}`;
  $('scoreChip').textContent = `⭐ ${S.score}`;
  $('teamChip').textContent = `👥 ${S.chars.length}/${CHARS.length}`;
  $('xpBar').style.width = (S.xp % CONFIG.XP_PER_LEVEL) + '%';
}
let activeTab = 'daily';
function questCard(q, idx, season){
  const T = CONFIG.QUEST_TYPES[q.tip];
  const [dIc, dAd] = DERS[q.ders];
  const bonus = bonusFor(q.ders);
  const done = season ? S.seasonDone.includes(idx) : q.done;
  const noEnergy = S.energy < T.enerji;
  return `<div class="qCard${done ? ' done' : ''}">
    <div class="qIc">${T.ic}</div>
    <div class="qBody">
      <div class="qTitle">${q.ad}</div>
      <div class="qSub">${dIc} ${dAd} · ${T.soru} soru · ⚡${T.enerji}${bonus ? ` · 👥 +%${bonus} puan` : ''}</div>
    </div>
    <button class="qBtn" data-idx="${idx}" data-season="${season ? 1 : 0}" ${done || noEnergy ? 'disabled' : ''}>
      ${done ? '✓ Bitti' : noEnergy ? '⚡ Yetersiz' : 'BAŞLA'}
    </button>
  </div>`;
}
function render(){
  rollDays(); refreshHUD();
  const c = $('content');
  if (activeTab === 'daily'){
    const kalan = S.daily.filter(q => !q.done).length;
    c.innerHTML = `<div class="secHead"><span>📋 Bugünün Görevleri</span><span>${6 - kalan}/6</span></div>` +
      S.daily.map((q, i) => questCard(q, i, false)).join('') +
      `<div class="qSub" style="text-align:center;margin-top:8px">Enerji her gün ${CONFIG.DAILY_ENERGY}'ye yenilenir · Her ${CONFIG.CHAR_EVERY} görevde yeni takım üyesi! 🎁</div>`;
  } else if (activeTab === 'season'){
    c.innerHTML = `<div class="secHead"><span>📖 ${new Date().toLocaleDateString('tr-TR', { month: 'long' })} Görev Kitabı</span><span>${S.seasonDone.length}/${CONFIG.SEASON_QUESTS}</span></div>` +
      Array.from({ length: CONFIG.SEASON_QUESTS }, (_, i) => questCard(seasonQuest(i), i, true)).join('') +
      `<div class="qSub" style="text-align:center;margin-top:8px">Kitabı bitirene "Sezon Kahramanı" rozeti! 🏅</div>`;
  } else {
    c.innerHTML = `<div class="secHead"><span>👥 Takımım</span><span>${S.chars.length}/${CHARS.length}</span></div><div id="teamGrid">` +
      CHARS.map(ch => {
        const owned = S.chars.includes(ch.id);
        return `<div class="charCard${owned ? '' : ' locked'}${ch.b >= 25 ? ' leg' : ''}">
          <div class="charEmoji">${owned ? ch.e : '❓'}</div>
          <div class="charName">${owned ? ch.ad : '???'}</div>
          <div class="charBonus">+%${ch.b} puan</div>
          <div class="charDers">${DERS[ch.ders][0]} ${DERS[ch.ders][1]}</div>
        </div>`;
      }).join('') + '</div>' +
      `<div class="qSub" style="text-align:center;margin-top:10px">Üyeler pasif bonus verir — asla cevabı söylemez! Görev yaptıkça yenileri katılır.</div>`;
  }
  c.querySelectorAll('.qBtn').forEach(b => b.addEventListener('click', () => {
    startQuest(parseInt(b.dataset.idx, 10), b.dataset.season === '1');
  }));
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  activeTab = t.dataset.tab;
  render();
}));

/* ================= GÖREV AKIŞI ================= */
let Q = null, fuseT = null;
function startQuest(idx, season){
  Audio2.init();
  const meta = season ? seasonQuest(idx) : S.daily[idx];
  const T = CONFIG.QUEST_TYPES[meta.tip];
  if (S.energy < T.enerji) return;
  S.energy -= T.enerji;
  Q = { idx, season, meta, T, i: 0, correct: 0 };
  persist(); refreshHUD();
  $('qzTitle').textContent = `${T.ic} ${meta.ad}`;
  $('quizVeil').classList.add('show');
  showQuestion();
}
function showQuestion(){
  const q = nextQuestion(Q.meta.ders);
  Q.cur = q;
  $('qzInfo').textContent = `Soru ${Q.i + 1}/${Q.T.soru} · Doğru: ${Q.correct}`;
  $('qzText').textContent = q.q;
  const box = $('qzOpts'); box.innerHTML = '';
  q.o.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  startFuse();
}
function startFuse(){
  clearInterval(fuseT);
  const t0 = Date.now();
  $('qzFuse').style.width = '100%';
  fuseT = setInterval(() => {
    if (document.hidden) return;   // sekme gizliyken süre akmaz (teneffüs güvencesi)
    const left = 1 - (Date.now() - t0) / (CONFIG.Q_TIME * 1000);
    $('qzFuse').style.width = Math.max(0, left * 100) + '%';
    if (left <= 0) answer(-1);
  }, 100);
}
function answer(i){
  clearInterval(fuseT);
  const q = Q.cur;
  const right = i === q.a;
  if (right){ Q.correct++; Audio2.ok(); } else Audio2.bad();
  const btns = $('qzOpts').children;
  [...btns].forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add('right');
    else if (j === i) b.classList.add('wrong');
  });
  Q.i++;
  setTimeout(() => { Q.i >= Q.T.soru ? finishQuest() : showQuestion(); }, 850);
}
function finishQuest(){
  $('quizVeil').classList.remove('show');
  const bonus = bonusFor(Q.meta.ders);
  const raw = Q.correct * CONFIG.POINT_PER_CORRECT + (Q.correct === Q.T.soru ? Q.T.bonus : Math.round(Q.T.bonus * Q.correct / Q.T.soru));
  const pts = Math.round(raw * (1 + bonus / 100));
  S.score += pts; S.xp += Q.T.xp;
  S.questsDone++;
  STATS.quests++; STATS.correct += Q.correct; STATS.wrong += (Q.T.soru - Q.correct);
  if (Q.season){ if (!S.seasonDone.includes(Q.idx)) S.seasonDone.push(Q.idx); }
  else S.daily[Q.idx].done = true;
  let seasonMsg = '';
  if (Q.season && S.seasonDone.length === CONFIG.SEASON_QUESTS){
    STATS.seasonsCompleted++;
    seasonMsg = '<br>🏅 <b>SEZON KİTABI TAMAMLANDI!</b>';
    Audio2.char();
  }
  persist(); saveStats();
  BilnetBridge.submitScore({
    gameId: 'bilgi-takimi', score: pts, tier: Q.tip === 'epic' ? 3 : Q.tip === 'normal' ? 2 : 1,
    stats: { correct: Q.correct, wrong: Q.T.soru - Q.correct, quest: Q.meta.ad },
  });
  $('resEmoji').textContent = Q.correct === Q.T.soru ? '🌟' : Q.correct > 0 ? '🎉' : '💪';
  $('resTitle').textContent = Q.correct === Q.T.soru ? 'Mükemmel Görev!' : 'Görev Tamam!';
  $('resDetail').innerHTML =
    `✅ ${Q.correct}/${Q.T.soru} doğru &nbsp;·&nbsp; ⭐ +${pts} puan${bonus ? ` <small>(takım +%${bonus})</small>` : ''} &nbsp;·&nbsp; 💜 +${Q.T.xp} XP` +
    seasonMsg +
    `<br><small>Bugün ${Q.correct} yeni şey öğrendin! 🎓</small>`;
  $('resultVeil').classList.add('show');
  Audio2.done();
}
$('resOk').addEventListener('click', () => {
  $('resultVeil').classList.remove('show');
  // her 5 görevde yeni karakter (§4.6)
  if (S.questsDone > 0 && S.questsDone % CONFIG.CHAR_EVERY === 0){
    const locked = CHARS.filter(c => !S.chars.includes(c.id));
    if (locked.length){
      const c = pick(locked);
      S.chars.push(c.id);
      persist();
      $('rwChar').textContent = c.e;
      $('rwName').textContent = c.ad;
      $('rwBonus').textContent = `${DERS[c.ders][0]} ${DERS[c.ders][1]} görevlerinde +%${c.b} puan`;
      $('charVeil').classList.add('show');
      Audio2.char();
      return;
    }
  }
  render();
});
$('charOk').addEventListener('click', () => { $('charVeil').classList.remove('show'); render(); });

/* ================= BAŞLAT ================= */
window.storage.get(SAVE_KEY).then(r => {
  if (r && r.value){ try { S = Object.assign(S, JSON.parse(r.value)); } catch (e) {} }
  return window.storage.get(STATS_KEY);
}).then(r => {
  if (r && r.value){ try { STATS = Object.assign(STATS, JSON.parse(r.value)); } catch (e) {} }
  rollDays(); persist(); render();
});
document.addEventListener('visibilitychange', () => { if (document.hidden){ persist(); saveStats(); } });
