<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/bilgi-takimi/">
<title>Bilgi Takımı — Görevleri Bitir, Takımını Büyüt!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 2 / 4.6
     (Mafia Wars görev döngüsü — SOSYAL KISIM TAMAMEN ÇIKARILDI; takım üyeleri
     gerçek kişi değil, kazanılan KARAKTERLERDİR). Tasarım: EGITSEL-OYUN-PLANI §4.6 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#1f2a44; --bg2:#141c30; --panel:#2a3a5e; --panel2:#35496f; --line:#46598a;
  --ink:#f3f7ff; --ink-dim:#aebbd8; --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b; --xp:#8a7bff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}

/* ===== ÜST BAR ===== */
#top{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
#hudRow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;font-weight:800}
.chip{background:var(--panel);border-radius:10px;padding:5px 11px;white-space:nowrap}
#energyChip.low{color:#ffb3a0}
#xpBarWrap{height:8px;background:var(--panel);border-radius:6px;overflow:hidden}
#xpBar{height:100%;width:0%;background:linear-gradient(90deg,var(--xp),#b3a8ff);transition:width .4s}
#tabs{display:flex;gap:6px}
.tab{flex:1;background:var(--panel);color:var(--ink-dim);padding:9px 4px;font-size:13.5px;font-weight:800;border-radius:12px 12px 0 0}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}

/* ===== İÇERİK ===== */
#content{flex:1;overflow-y:auto;background:var(--panel2);border-radius:0 0 14px 14px;padding:12px;-webkit-overflow-scrolling:touch}
.qCard{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;border:2px solid transparent}
.qCard.done{opacity:.55;border-color:var(--ok)}
.qIc{font-size:30px;width:44px;text-align:center}
.qBody{flex:1;min-width:0}
.qTitle{font-weight:800;font-size:15px}
.qSub{font-size:12px;color:var(--ink-dim);margin-top:2px}
.qBtn{background:var(--gold);color:#3c2a0e;font-weight:900;padding:9px 13px;font-size:13px;white-space:nowrap;box-shadow:0 3px 0 #b8901c}
.qBtn:disabled{background:var(--line);color:var(--ink-dim);box-shadow:none}
.qBtn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #b8901c}
.secHead{font-size:13px;font-weight:800;color:var(--ink-dim);margin:6px 2px 8px;display:flex;justify-content:space-between}

/* takım kartları */
#teamGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.charCard{background:var(--panel);border-radius:14px;padding:12px 8px;text-align:center;border:2px solid var(--line)}
.charCard.locked{opacity:.45;filter:grayscale(.8)}
.charCard.leg{border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.25)}
.charEmoji{font-size:38px}
.charName{font-weight:800;font-size:13.5px;margin-top:4px}
.charBonus{font-size:11.5px;color:var(--gold);font-weight:700;margin-top:2px}
.charDers{font-size:11px;color:var(--ink-dim)}

/* ===== QUIZ OVERLAY ===== */
.veil{position:fixed;inset:0;background:rgba(10,16,32,.9);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel2);border-radius:18px;padding:18px;width:min(460px,96vw);max-height:92vh;overflow:auto;text-align:center}
#qzFuseWrap{height:7px;background:var(--panel);border-radius:5px;overflow:hidden;margin:10px 0}
#qzFuse{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
#qzText{font-size:clamp(17px,4.8vw,22px);font-weight:800;min-height:54px;display:flex;align-items:center;justify-content:center}
#qzOpts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.opt{background:var(--panel);color:var(--ink);padding:13px 8px;font-size:15px;font-weight:700;border:2px solid var(--line)}
.opt.right{background:#1d5c38;border-color:var(--ok)}
.opt.wrong{background:#5c1d28;border-color:#d6536a}
.opt:disabled{cursor:default}
#qzInfo{font-size:12.5px;color:var(--ink-dim);margin-top:8px}
.bigBtn{background:var(--hot);color:#fff;font-size:17px;font-weight:800;padding:13px 28px;box-shadow:0 4px 0 #c2503a;margin-top:12px}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#rwChar{font-size:64px;animation:bounceIn .6s}
@keyframes bounceIn{0%{transform:scale(.2)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0e1830;color:#fff;
  padding:10px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="hudRow">
      <span class="chip" id="energyChip">⚡ 20/20</span>
      <span class="chip" id="lvlChip">🎖️ Sv 1</span>
      <span class="chip" id="scoreChip">⭐ 0</span>
      <span class="chip" id="teamChip">👥 1</span>
    </div>
    <div id="xpBarWrap"><div id="xpBar"></div></div>
    <div id="tabs">
      <button class="tab on" data-tab="daily">📋 Görevler</button>
      <button class="tab" data-tab="season">📖 Sezon Kitabı</button>
      <button class="tab" data-tab="team">👥 Takımım</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- QUIZ -->
<div class="veil" id="quizVeil">
  <div class="card">
    <div style="font-weight:900" id="qzTitle">📚 Görev</div>
    <div id="qzInfo">Soru 1/5 · Doğru: 0</div>
    <div id="qzFuseWrap"><div id="qzFuse"></div></div>
    <div id="qzText"></div>
    <div id="qzOpts"></div>
  </div>
</div>

<!-- GÖREV SONU -->
<div class="veil" id="resultVeil">
  <div class="card">
    <div style="font-size:48px" id="resEmoji">🎉</div>
    <h2 id="resTitle">Görev Tamam!</h2>
    <p id="resDetail" style="margin-top:8px;line-height:1.6;color:var(--ink-dim)"></p>
    <button class="bigBtn" id="resOk">Devam</button>
  </div>
</div>

<!-- YENİ KARAKTER -->
<div class="veil" id="charVeil">
  <div class="card">
    <h2>🎊 TAKIMINA YENİ ÜYE!</h2>
    <div id="rwChar">👧</div>
    <div id="rwName" style="font-weight:900;font-size:20px"></div>
    <div id="rwBonus" style="color:var(--gold);font-weight:800;margin-top:4px"></div>
    <p style="font-size:12.5px;color:var(--ink-dim);margin-top:8px">Takım üyeleri sana asla cevap vermez — sadece puanını artırır!</p>
    <button class="bigBtn" id="charOk">Harika!</button>
  </div>
</div>

<div id="toast"></div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
