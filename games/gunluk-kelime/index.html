<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/gunluk-kelime/">
<title>Günlük Kelime — Bugünün Kelimesini Çöz!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 5 / 4.15
     (Wordle esinli — TÜM OKUL aynı kelimeyi çözer: tarih bazlı seed, sunucu yok).
     Tasarım: EGITSEL-OYUN-PLANI §4.15 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#1d2a3a; --bg2:#121b27; --panel:#2a3c52; --ink:#f2f8ff; --ink-dim:#a8bdd2;
  --gold:#ffd23f; --hot:#ff7a59; --green:#4f9e5f; --yellow:#c2a23a; --gray:#4a5664;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;max-width:520px;margin:0 auto;padding:8px}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 2px}
#top h1{font-size:clamp(17px,4.8vw,22px)}
.chip{background:var(--panel);border-radius:9px;padding:5px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
#modeRow{display:flex;gap:8px;margin:6px 0}
.modeBtn{background:var(--panel);color:var(--ink-dim);padding:8px 18px;font-weight:800;font-size:14px;border:2px solid transparent}
.modeBtn.on{color:var(--ink);border-color:var(--gold)}
#gridWrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0}
#grid{display:grid;gap:6px}
.cell{width:var(--cs);height:var(--cs);border:2.5px solid var(--gray);border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:calc(var(--cs)*0.5);text-transform:uppercase;transition:transform .12s}
.cell.fill{border-color:#7a8a9a;animation:cellPop .12s}
@keyframes cellPop{50%{transform:scale(1.1)}}
.cell.g{background:var(--green);border-color:var(--green)}
.cell.y{background:var(--yellow);border-color:var(--yellow)}
.cell.x{background:var(--gray);border-color:var(--gray)}
#msg{min-height:22px;font-weight:800;font-size:14px;color:var(--gold)}
#kb{width:100%;display:flex;flex-direction:column;gap:5px;padding-bottom:8px}
.kbRow{display:flex;gap:4px;justify-content:center}
.key{flex:1;max-width:38px;height:46px;background:#5b6c80;color:#fff;font-weight:900;font-size:13px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.key.wide{max-width:58px;font-size:11.5px}
.key.g{background:var(--green)} .key.y{background:var(--yellow)} .key.x{background:#2e3742}
.veil{position:fixed;inset:0;background:rgba(8,14,22,.9);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,95vw);text-align:center;max-height:90vh;overflow:auto}
.bigBtn{background:var(--hot);color:#fff;font-size:16px;font-weight:800;padding:12px 26px;box-shadow:0 4px 0 #c2503a;margin-top:12px}
#meaningBox{background:rgba(0,0,0,.25);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.6;text-align:left}
#meaningBox b{color:var(--gold)}
#distRow{display:flex;flex-direction:column;gap:4px;margin-top:10px;text-align:left;font-size:12px}
.dBar{background:var(--green);border-radius:4px;padding:2px 6px;color:#fff;font-weight:800;min-width:20px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>📅 GÜNLÜK KELİME</h1>
    <span class="chip" id="streakChip">🔥 0</span>
  </div>
  <div id="modeRow">
    <button class="modeBtn on" data-m="tr">🇹🇷 Türkçe (5 harf)</button>
    <button class="modeBtn" data-m="en">🇬🇧 English (4 harf)</button>
  </div>
  <div id="msg">Bugünün kelimesini 6 denemede bul!</div>
  <div id="gridWrap"><div id="grid"></div></div>
  <div id="kb"></div>
</div>

<div class="veil" id="endVeil">
  <div class="card">
    <div style="font-size:46px" id="endEmoji">🎉</div>
    <h2 id="endTitle">Bravo!</h2>
    <p id="endSub" style="color:var(--ink-dim);font-size:13.5px;margin-top:4px"></p>
    <div id="meaningBox"></div>
    <div id="distRow"></div>
    <p style="font-size:12px;color:var(--ink-dim);margin-top:10px">Yarın yeni kelime seni bekliyor — tüm okul aynı kelimeyi çözüyor! 🏫</p>
    <button class="bigBtn" id="endOk">Tamam</button>
  </div>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
