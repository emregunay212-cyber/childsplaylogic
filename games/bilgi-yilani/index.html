<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/bilgi-yilani/">
<title>Bilgi Yılanı — Doğru Yemi Ye, Uza!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 4 / 4.13
     (Nokia Snake klasiği + soru yemleri). Tasarım: EGITSEL-OYUN-PLANI §4.13 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#173a2a; --bg2:#0c2418; --panel:#1f5038; --ink:#eafff2; --ink-dim:#a3d4b8;
  --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b; --snake:#6ee7a0; --snake2:#3fae6e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(27px,7.2vw,46px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#screen-menu .sub{opacity:.9;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:470px;color:var(--ink-dim)}
.tierGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,94vw);margin-bottom:12px}
.tierBtn{background:var(--panel);color:var(--ink);padding:12px 8px;font-size:15px;font-weight:700;border:3px solid transparent;display:flex;flex-direction:column;gap:3px}
.tierBtn small{font-weight:400;font-size:11.5px;color:var(--ink-dim)}
.tierBtn.on{border-color:var(--gold);transform:scale(1.03)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #c2503a}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:8px;min-height:17px}

#screen-game{padding:0;justify-content:flex-start}
#topBar{width:100%;background:var(--panel);padding:7px 10px;display:flex;flex-direction:column;gap:4px;z-index:5}
#hudRow{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}
.chip{background:rgba(0,0,0,.25);border-radius:9px;padding:4px 10px;white-space:nowrap}
#qLine{font-size:clamp(15px,4.4vw,19px);font-weight:900;color:var(--gold);text-align:center}
#cvWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:6px}
#cv{border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.4);touch-action:none}

#screen-result #resEmoji{font-size:52px}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
#resStats{background:var(--panel);border-radius:14px;padding:14px 20px;font-size:15px;line-height:1.7;margin:10px 0;max-width:420px}
#eduLine{font-weight:800}
#pauseVeil{position:fixed;inset:0;background:rgba(5,18,10,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20;padding:20px;text-align:center}
#pauseVeil.show{display:flex}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🐍 BİLGİ YILANI 🍎</h1>
  <p class="sub">Klasik yılan ama yemler CEVAP! Üstteki sorunun doğru cevabını taşıyan yemi ye → uza ve puan kazan. Yanlış yem 2 boğum kısaltır. Kaydır ya da ok tuşlarıyla yönlendir!</p>
  <div class="tierGrid">
    <button class="tierBtn on" data-t="1">🏕️ Etek<small>2 yem · duvarlar geçirgen</small></button>
    <button class="tierBtn" data-t="2">⛰️ Yamaç<small>3 yem · geçirgen duvar</small></button>
    <button class="tierBtn" data-t="3">🧗 Tırmanış<small>4 yem · ÖLÜMCÜL duvar</small></button>
    <button class="tierBtn" data-t="4">🏔️ Zirve<small>4 yem · ölümcül + hızlı</small></button>
  </div>
  <button class="bigBtn" id="bPlay">🐍 BAŞLA</button>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="topBar">
    <div id="hudRow">
      <span class="chip" id="scoreChip">⭐ 0</span>
      <span class="chip" id="lenChip">🐍 3</span>
      <span class="chip" id="okChip">✅ 0</span>
      <button class="chip" id="bPause">⏸️</button>
    </div>
    <div id="qLine">3 + 4 = ?</div>
  </div>
  <div id="cvWrap"><canvas id="cv"></canvas></div>
</div>

<div id="pauseVeil">
  <h2 style="font-size:26px">⏸️ Mola!</h2>
  <p style="color:var(--ink-dim)">Yılan kıvrılıp bekliyor.</p>
  <button class="bigBtn" id="bResume">▶️ Devam Et</button>
  <button class="ghost" id="bQuit">🏠 Menü</button>
</div>

<div class="screen" id="screen-result">
  <div id="resEmoji">🐍</div>
  <h1 style="font-size:25px" id="resTitle">Tur Bitti!</h1>
  <div id="resScore">0</div>
  <div id="resStats"></div>
  <div id="eduLine"></div>
  <button class="bigBtn" id="bAgain" style="margin-top:12px">🔄 Tekrar Oyna</button>
  <button class="ghost" id="bMenu">🏠 Menü</button>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
