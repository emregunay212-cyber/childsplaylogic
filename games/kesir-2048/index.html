<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/kesir-2048/">
<title>Kesir 2048 — Kaydır, Birleştir, TAM Yap!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 4 / 4.10
     (2048 esinli — kesir KAVRAMI pasta modeliyle görselleşir). Tasarım: EGITSEL-OYUN-PLANI §4.10 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#3b3a52; --bg2:#26253a; --board:#4a4866; --cell:#5b5878;
  --ink:#fdf8ff; --ink-dim:#c3bedd; --gold:#ffd23f; --hot:#ff7a59; --ok:#6ee7a0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(26px,7vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#screen-menu .sub{opacity:.9;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:480px;color:var(--ink-dim)}
.tierGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,94vw);margin-bottom:12px}
.tierBtn{background:var(--board);color:var(--ink);padding:12px 8px;font-size:15px;font-weight:700;border:3px solid transparent;display:flex;flex-direction:column;gap:3px}
.tierBtn small{font-weight:400;font-size:11.5px;color:var(--ink-dim)}
.tierBtn.on{border-color:var(--hot);transform:scale(1.03)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #c2503a}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:8px;min-height:17px}

#screen-game{padding:0;justify-content:flex-start}
#topBar{width:100%;background:var(--board);padding:8px 10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;z-index:5}
.chip{background:rgba(0,0,0,.25);border-radius:9px;padding:4px 10px;white-space:nowrap}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:10px}
#board{position:relative;background:var(--board);border-radius:16px;padding:8px;touch-action:none;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.bgCell{position:absolute;background:rgba(0,0,0,.18);border-radius:10px}
.tile2{position:absolute;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;transition:transform .15s ease-out;will-change:transform;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile2 .pie{border-radius:50%;border:2.5px solid rgba(255,255,255,.85);margin-bottom:2px}
.tile2.merged{animation:mergePop .22s}
@keyframes mergePop{0%{transform:scale(1) translate(var(--tx),var(--ty))}50%{transform:scale(1.18) translate(var(--tx),var(--ty))}100%{transform:scale(1) translate(var(--tx),var(--ty))}}
#ctlRow{display:flex;gap:8px;padding:0 12px 14px;width:min(440px,96vw);margin:0 auto}
.cBtn{flex:1;background:var(--board);color:var(--ink);font-weight:800;font-size:14px;padding:11px}
.cBtn:disabled{opacity:.4}

#screen-result #resEmoji{font-size:52px}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
#resStats{background:var(--board);border-radius:14px;padding:14px 20px;font-size:15px;line-height:1.7;margin:10px 0;max-width:420px}
#eduLine{font-weight:800}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🔢 KESİR 2048 🧩</h1>
  <p class="sub">Kaydır, aynıları birleştir! Tırmanış'ta kesirler birleşir: 1/8 + 1/8 = 1/4 → ... → 1 TAM! Her taşın pastası kesri GÖSTERİR — kesir kavramı gözünün önünde büyür. 🥧</p>
  <div class="tierGrid">
    <button class="tierBtn on" data-t="1">🏕️ Etek<small>Klasik 2-4-8…</small></button>
    <button class="tierBtn" data-t="2">⛰️ Yamaç<small>5-10-20-40 (farklı taban)</small></button>
    <button class="tierBtn" data-t="3">🧗 Tırmanış<small>1/8 → 1 TAM kesir zinciri</small></button>
    <button class="tierBtn" data-t="4">🏔️ Zirve<small>Denk kesirler karışır (2/8 = 1/4!)</small></button>
  </div>
  <button class="bigBtn" id="bPlay">🧩 BAŞLA</button>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="topBar">
    <span class="chip" id="scoreChip">⭐ 0</span>
    <span class="chip" id="tamChip">🥧 0 TAM</span>
    <button class="chip" id="bUndo">↩️ 3</button>
    <button class="chip" id="bQuitTop">🏠</button>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="ctlRow">
    <button class="cBtn" id="bRestart">🔄 Yeni Oyun</button>
  </div>
</div>

<div class="screen" id="screen-result">
  <div id="resEmoji">🧩</div>
  <h1 style="font-size:25px" id="resTitle">Hamle Kalmadı!</h1>
  <div id="resScore">0</div>
  <div id="resStats"></div>
  <div id="eduLine"></div>
  <button class="bigBtn" id="bAgain" style="margin-top:12px">🔄 Tekrar Oyna</button>
  <button class="ghost" id="bMenu">🏠 Menü</button>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
