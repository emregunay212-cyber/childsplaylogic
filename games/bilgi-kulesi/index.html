<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/bilgi-kulesi/">
<title>Bilgi Kulesi — 12 Katı Tırman!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 5 / 4.18
     (Kim Milyoner Olmak İster esinli — para yerine KULE). Tasarım: §4.18 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#101c33; --bg2:#080f1f; --panel:#1c2f52; --panel2:#27406e; --ink:#f0f5ff; --ink-dim:#a4b8d8;
  --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b; --safe:#4aa8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 75%);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(26px,7vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.5)}
#screen-menu .sub{opacity:.9;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:480px;color:var(--ink-dim)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #c2503a}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.bigBtn:disabled{opacity:.45;box-shadow:none}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#dailyLine{font-size:13.5px;font-weight:800;color:var(--gold);margin-top:10px}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:4px;min-height:17px}

#screen-game{padding:0;flex-direction:row;justify-content:center;gap:8px;align-items:stretch}
#towerCol{width:96px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px;padding:10px 4px;overflow:hidden}
.floor{height:26px;border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;color:var(--ink-dim);border:1.5px solid transparent}
.floor.safe{border-color:var(--safe);color:var(--safe)}
.floor.done{background:var(--gold);color:#3c2a0e}
.floor.cur{border-color:var(--hot);color:var(--ink);animation:curPulse 1s infinite alternate}
@keyframes curPulse{from{box-shadow:0 0 2px rgba(255,122,89,.4)}to{box-shadow:0 0 12px rgba(255,122,89,.8)}}
#qCol{flex:1;max-width:520px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px 10px 14px}
#hudRow{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:800}
.chip{background:var(--panel);border-radius:9px;padding:4px 9px;white-space:nowrap}
#fuseWrap{height:7px;background:var(--panel);border-radius:5px;overflow:hidden}
#fuse{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
#qText{background:var(--panel);border-radius:14px;padding:14px;font-size:clamp(15px,4.3vw,19px);font-weight:800;min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center}
#opts{display:grid;gap:8px}
.opt{background:var(--panel2);color:var(--ink);padding:13px 12px;font-size:15px;font-weight:700;border:2px solid #38588f;text-align:left;border-radius:12px}
.opt.right{background:#1d5c38;border-color:var(--ok)}
.opt.wrong{background:#5c1d28;border-color:#d6536a}
.opt.dim{opacity:.3;pointer-events:none}
#jokerRow{display:flex;gap:8px}
.joker{flex:1;background:var(--panel);color:var(--ink);font-weight:800;font-size:12.5px;padding:10px 4px;border:2px solid var(--panel2)}
.joker:disabled{opacity:.35}
#bWalk{background:#3a5078}

.veil{position:fixed;inset:0;background:rgba(4,9,18,.92);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,95vw);text-align:center;max-height:90vh;overflow:auto}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🏰 BİLGİ KULESİ 💡</h1>
  <p class="sub">12 soruluk merdiven: Etek sorularıyla başlar, Zirve'de biter! Her doğru cevap kuleye bir kat ekler. 4. ve 8. katlar GÜVENLİ — yanlışta oraya düşersin. 3 joker, günde 3 deneme!</p>
  <button class="bigBtn" id="bPlay">🏰 KULEYE TIRMAN</button>
  <div id="dailyLine">🎫 Bugünkü hak: 3/3</div>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="towerCol"></div>
  <div id="qCol">
    <div id="hudRow">
      <span class="chip" id="floorChip">🏰 Kat 1/12</span>
      <span class="chip" id="ptChip">⭐ 50</span>
      <button class="chip" id="bQuitTop">🏠</button>
    </div>
    <div id="fuseWrap"><div id="fuse"></div></div>
    <div id="qText"></div>
    <div id="opts"></div>
    <div id="jokerRow">
      <button class="joker" id="jHalf">➗ Yarı Yarıya</button>
      <button class="joker" id="jOwl">🦉 Bilge Baykuş</button>
      <button class="joker" id="jSecond">🛡️ Çift Hak</button>
      <button class="joker" id="bWalk">🚪 Çekil</button>
    </div>
  </div>
</div>

<div class="veil" id="endVeil">
  <div class="card">
    <div style="font-size:48px" id="endEmoji">🏰</div>
    <h2 id="endTitle">Kule Tamam!</h2>
    <div id="resScore">0</div>
    <p id="endDetail" style="color:var(--ink-dim);font-size:14px;line-height:1.6;margin-top:6px"></p>
    <button class="bigBtn" id="endOk" style="margin-top:12px">Tamam</button>
  </div>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
