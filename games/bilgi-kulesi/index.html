<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bilgi Kulesi — 12 Katı Tırman!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 5 / 4.18
     (Kim Milyoner Olmak İster esinli — para yerine KULE). Tasarım: §4.18 -->
<style>
:root{
  --bg1:#101c33; --bg2:#080f1f; --panel:#1c2f52; --panel2:#27406e; --ink:#f0f5ff; --ink-dim:#a4b8d8;
  --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b; --safe:#4aa8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2) 75%);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(26px,7vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.5)}
#screen-menu .sub{opacity:.9;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:480px;color:var(--ink-dim)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #c2503a}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.bigBtn:disabled{opacity:.45;box-shadow:none}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#dailyLine{font-size:13.5px;font-weight:800;color:var(--gold);margin-top:10px}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:4px;min-height:17px}

#screen-game{padding:0;flex-direction:row;justify-content:center;gap:8px;align-items:stretch}
#towerCol{width:96px;display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px;padding:10px 4px;overflow:hidden}
.floor{height:26px;border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:800;color:var(--ink-dim);border:1.5px solid transparent}
.floor.safe{border-color:var(--safe);color:var(--safe)}
.floor.done{background:var(--gold);color:#3c2a0e}
.floor.cur{border-color:var(--hot);color:var(--ink);animation:curPulse 1s infinite alternate}
@keyframes curPulse{from{box-shadow:0 0 2px rgba(255,122,89,.4)}to{box-shadow:0 0 12px rgba(255,122,89,.8)}}
#qCol{flex:1;max-width:520px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:10px 10px 14px}
#hudRow{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:800}
.chip{background:var(--panel);border-radius:9px;padding:4px 9px;white-space:nowrap}
#fuseWrap{height:7px;background:var(--panel);border-radius:5px;overflow:hidden}
#fuse{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
#qText{background:var(--panel);border-radius:14px;padding:14px;font-size:clamp(15px,4.3vw,19px);font-weight:800;min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center}
#opts{display:grid;gap:8px}
.opt{background:var(--panel2);color:var(--ink);padding:13px 12px;font-size:15px;font-weight:700;border:2px solid #38588f;text-align:left;border-radius:12px}
.opt.right{background:#1d5c38;border-color:var(--ok)}
.opt.wrong{background:#5c1d28;border-color:#d6536a}
.opt.dim{opacity:.3;pointer-events:none}
#jokerRow{display:flex;gap:8px}
.joker{flex:1;background:var(--panel);color:var(--ink);font-weight:800;font-size:12.5px;padding:10px 4px;border:2px solid var(--panel2)}
.joker:disabled{opacity:.35}
#bWalk{background:#3a5078}

.veil{position:fixed;inset:0;background:rgba(4,9,18,.92);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel);border-radius:18px;padding:20px;width:min(440px,95vw);text-align:center;max-height:90vh;overflow:auto}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🏰 BİLGİ KULESİ 💡</h1>
  <p class="sub">12 soruluk merdiven: Etek sorularıyla başlar, Zirve'de biter! Her doğru cevap kuleye bir kat ekler. 4. ve 8. katlar GÜVENLİ — yanlışta oraya düşersin. 3 joker, günde 3 deneme!</p>
  <button class="bigBtn" id="bPlay">🏰 KULEYE TIRMAN</button>
  <div id="dailyLine">🎫 Bugünkü hak: 3/3</div>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="towerCol"></div>
  <div id="qCol">
    <div id="hudRow">
      <span class="chip" id="floorChip">🏰 Kat 1/12</span>
      <span class="chip" id="ptChip">⭐ 50</span>
      <button class="chip" id="bQuitTop">🏠</button>
    </div>
    <div id="fuseWrap"><div id="fuse"></div></div>
    <div id="qText"></div>
    <div id="opts"></div>
    <div id="jokerRow">
      <button class="joker" id="jHalf">➗ Yarı Yarıya</button>
      <button class="joker" id="jOwl">🦉 Bilge Baykuş</button>
      <button class="joker" id="jSecond">🛡️ Çift Hak</button>
      <button class="joker" id="bWalk">🚪 Çekil</button>
    </div>
  </div>
</div>

<div class="veil" id="endVeil">
  <div class="card">
    <div style="font-size:48px" id="endEmoji">🏰</div>
    <h2 id="endTitle">Kule Tamam!</h2>
    <div id="resScore">0</div>
    <p id="endDetail" style="color:var(--ink-dim);font-size:14px;line-height:1.6;margin-top:6px"></p>
    <button class="bigBtn" id="endOk" style="margin-top:12px">Tamam</button>
  </div>
</div>

<script>
(function () {
  if (window.storage && window.storage.get && window.storage.set) return;
  window.storage = {
    get: function (key) { try { var v = localStorage.getItem(key); return Promise.resolve(v != null ? { value: v } : null); } catch (e) { return Promise.resolve(null); } },
    set: function (key, value) { try { localStorage.setItem(key, value); return Promise.resolve(); } catch (e) { return Promise.resolve(); } },
    remove: function (key) { try { localStorage.removeItem(key); return Promise.resolve(); } catch (e) { return Promise.resolve(); } }
  };
})();
</script>
<script>
"use strict";
/* ================= CONFIG (EGITSEL-OYUN-PLANI §4.18 — aynen) ================= */
const CONFIG = {
  FLOORS: 12,                              // 3 Etek + 3 Yamaç + 3 Tırmanış + 3 Zirve
  POINTS: [50,100,200,400,800,1600,3200,6400,12800,25600,51200,102400].slice(0,12).map((v,i)=>[50,100,200,400,800,1600,3200,6400,12800,25600,51200,102400][i]),
  SAFE: [4, 8],                            // güvenli katlar (Milyoner barajı)
  Q_TIME: 30,                              // soru başına 30 sn
  DAILY_TRIES: 3,                          // günlük 3 kule denemesi
  OWL_ACCURACY: 0.7,                       // Bilge Baykuş %70 isabetli tahmin verir
};
/* kat → zorluk: 1-3 Etek(z1) · 4-6 Yamaç(z2) · 7-9 Tırmanış(z3) · 10-12 Zirve(z3+EN/karışık) */
const BANK = [
  {z:1,q:"4 × 5 = ?",o:["10","15","20","25"],a:2},
  {z:1,q:"Hangisi canlıdır?",o:["Taş","Çiçek","Su","Bulut"],a:1},
  {z:1,q:"'okul' kelimesinin eş anlamlısı?",o:["deniz","bahçe","mektep","kalem"],a:2},
  {z:1,q:"Bir haftada kaç gün vardır?",o:["5","6","7","8"],a:2},
  {z:1,q:"9 × 6 = ?",o:["45","54","56","63"],a:1},
  {z:1,q:"Hangisi meyvedir?",o:["Havuç","Elma","Patates","Soğan"],a:1},
  {z:1,q:"'büyük' kelimesinin zıt anlamlısı?",o:["dev","iri","küçük","geniş"],a:2},
  {z:1,q:"77 − 55 = ?",o:["12","22","23","32"],a:1},
  {z:2,q:"Dünya'nın uydusu hangisidir?",o:["Mars","Güneş","Ay","Venüs"],a:2},
  {z:2,q:"43 + 26 − 23 = ?",o:["41","56","46","44"],a:2},
  {z:2,q:"'cömert' kelimesinin zıt anlamlısı?",o:["cimri","zengin","iyi","nazik"],a:0},
  {z:2,q:"Suyun donma sıcaklığı kaçtır?",o:["10°C","0°C","-10°C","100°C"],a:1},
  {z:2,q:"11 × 11 = ?",o:["111","121","122","131"],a:1},
  {z:2,q:"Sıvıdan gaza geçişin adı nedir?",o:["Erime","Donma","Buharlaşma","Yoğuşma"],a:2},
  {z:2,q:"Hangisi gezegen DEĞİLDİR?",o:["Mars","Jüpiter","Ay","Venüs"],a:2},
  {z:2,q:"İstiklal Marşı'nın yazarı kimdir?",o:["Atatürk","Mehmet Akif Ersoy","Yunus Emre","Nazım Hikmet"],a:1},
  {z:3,q:"9 × 8 + 17 = ?",o:["84","89","88","90"],a:1},
  {z:3,q:"Fotosentez bitkinin neresinde olur?",o:["Kök","Tohum","Kloroplast","Mitokondri"],a:2},
  {z:3,q:"Hangisi doğru yazılmıştır?",o:["yanliş","yannış","yalnış","yanlış"],a:3},
  {z:3,q:"10/12 kesrinin en sade hali?",o:["5/6","2/3","10/11","6/7"],a:0},
  {z:3,q:"Güneş'e en yakın gezegen?",o:["Venüs","Mars","Merkür","Dünya"],a:2},
  {z:3,q:"Ses hangi ortamda YAYILMAZ?",o:["Su","Hava","Demir","Boşluk"],a:3},
  {z:3,q:"16 × 5 = ?",o:["70","75","80","85"],a:2},
  {z:3,q:"Mevsimlerin oluşma nedeni?",o:["Güneşe uzaklık","Eksen eğikliği","Ay'ın dönüşü","Rüzgarlar"],a:1},
  {z:4,q:"'water' kelimesinin Türkçesi?",o:["ateş","su","hava","toprak"],a:1},
  {z:4,q:"Hücrenin enerji santrali hangisidir?",o:["Çekirdek","Ribozom","Mitokondri","Zar"],a:2},
  {z:4,q:"200 sayısının %25'i kaçtır?",o:["25","40","50","75"],a:2},
  {z:4,q:"'teacher' ne demektir?",o:["öğrenci","öğretmen","okul","ders"],a:1},
  {z:4,q:"Hangisi SAF maddedir?",o:["Hava","Tuzlu su","Altın","Limonata"],a:2},
  {z:4,q:"3² + 4² = ?",o:["25","24","49","12"],a:0},
  {z:4,q:"Türkiye'nin başkenti hangisidir?",o:["İstanbul","İzmir","Ankara","Bursa"],a:2},
  {z:4,q:"'library' ne demektir?",o:["kitap","kütüphane","laboratuvar","sınıf"],a:1},
];
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ================= Audio ================= */
const Audio2 = (() => {
  let ctx = null;
  function init(){ if (!ctx){ try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(f,d,t,v,w){ if(!ctx)return; const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=t||'triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(v||0.06, ctx.currentTime+(w||0));
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+(w||0)+d);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+(w||0)); o.stop(ctx.currentTime+(w||0)+d+0.02); }
  return { init,
    tension: () => tone(220, 0.5, 'sine', 0.03),          // soru gelirken gerilim tınısı (§4.18)
    ok: () => { tone(660,0.12,'triangle',0.08); tone(880,0.16,'triangle',0.08,0.1); },
    bad: () => { tone(220,0.3,'sawtooth',0.06); tone(160,0.4,'sawtooth',0.06,0.2); },
    floor: () => tone(520,0.1,'triangle',0.06),
    win: () => [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.18,'triangle',0.08,i*0.13)) };
})();
const BilnetBridge = {
  QUEUE_KEY: 'bilnet_score_queue',
  async submitScore(p){ const rec={...p,ts:Date.now()};
    try{ const r=await window.storage.get(this.QUEUE_KEY); const q=r&&r.value?JSON.parse(r.value):[];
      q.push(rec); while(q.length>50)q.shift(); await window.storage.set(this.QUEUE_KEY,JSON.stringify(q)); }catch(e){} },
};
const STATS_KEY = 'bilgikulesi_stats';
let STATS = { plays:0, best:0, peaks:0, day:'', triesToday:0 };
const dayKey = () => { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function loadStats(cb){ try{ window.storage.get(STATS_KEY).then(r=>{ if(r&&r.value){ try{ STATS=Object.assign(STATS,JSON.parse(r.value)); }catch(e){} } rollDay(); refreshMenu(); if(cb)cb(); }); }catch(e){ if(cb)cb(); } }
function saveStats(){ try{ window.storage.set(STATS_KEY,JSON.stringify(STATS)); }catch(e){} }
function rollDay(){ const t=dayKey(); if (STATS.day!==t){ STATS.day=t; STATS.triesToday=0; saveStats(); } }

/* ====== Kalıcı soru-tekrar önleme (oturumlar arası) ======
   "Hiçbir oyunda aynı soru öğrencinin karşısına tekrar gelmesin."
   Oturum-içi engel zaten G.used ile var; bu katman daha önce ÇIKMIŞ
   soruları tüm oyunlar boyunca hafızada tutar. Bir zorluk havuzu
   tamamen tükenince SADECE o zorluğun kaydını sıfırlayıp döngüyü
   nazikçe yeniden başlatır (oyun asla sorusuz kalmaz). */
const SEEN_KEY = 'bilgikulesi_seen';
let SEEN = new Set();
function loadSeen(){ try{ window.storage.get(SEEN_KEY).then(r=>{ if(r&&r.value){ try{ const a=JSON.parse(r.value); if(Array.isArray(a)) SEEN=new Set(a); }catch(e){} } }); }catch(e){} }
function saveSeen(){ try{ window.storage.set(SEEN_KEY, JSON.stringify([...SEEN])); }catch(e){} }
function markSeen(sig){ SEEN.add(sig); saveSeen(); }
/* belirli bir zorluk için tüm soruları görülmüş kabul ediliyorsa o zorluğu sıfırla */
function recycleSeenForTier(z){
  let changed=false;
  for (const item of BANK){ if (item.z===z && SEEN.has(item.q)){ SEEN.delete(item.q); changed=true; } }
  if (changed) saveSeen();
}

/* ================= Game ================= */
const $ = id => document.getElementById(id);
const G = { state:'menu', floor:0, jokers:{half:1,owl:1,second:1}, secondActive:false,
  cur:null, used:new Set(), fuseT:null, locked:false };
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); $(id).classList.add('show'); }
function refreshMenu(){
  $('dailyLine').textContent = `🎫 Bugünkü hak: ${Math.max(0, CONFIG.DAILY_TRIES - STATS.triesToday)}/${CONFIG.DAILY_TRIES}`;
  $('bestLine').textContent = STATS.best > 0 ? `🏅 Rekorun: ${STATS.best} puan · 👑 Zirve: ${STATS.peaks} kez` : '';
  $('bPlay').disabled = STATS.triesToday >= CONFIG.DAILY_TRIES;
  if ($('bPlay').disabled) $('bPlay').textContent = '🌙 Yarın yine gel!';
  else $('bPlay').textContent = '🏰 KULEYE TIRMAN';
}
function buildTower(){
  const t = $('towerCol');
  t.innerHTML = '';
  for (let i=1;i<=CONFIG.FLOORS;i++){
    const f = document.createElement('div');
    f.className = 'floor' + (CONFIG.SAFE.includes(i) ? ' safe' : '');
    f.id = 'f'+i;
    f.textContent = `${i} · ${CONFIG.POINTS[i-1]}`;
    t.appendChild(f);
  }
}
function paintTower(){
  for (let i=1;i<=CONFIG.FLOORS;i++){
    const f = $('f'+i);
    f.classList.toggle('done', i <= G.floor);
    f.classList.toggle('cur', i === G.floor+1);
  }
}
function tierOfFloor(fl){ return fl<=3 ? 1 : fl<=6 ? 2 : fl<=9 ? 3 : 4; }
/* Soru seçimi: önce oturum-içi (G.used) VE kalıcı (SEEN) dışındakiler;
   sınırlı denemeyle uygun aday bulunur. Havuz tükenirse kademeli geri çekilme:
   (1) bu zorlukta hiç görülmemiş + bu oyunda kullanılmamış,
   (2) zorluk tüm oyunlarda tükenmişse o zorluğu geri dönüştür,
   (3) en kötü ihtimalde bu oyunda kullanılmamış,
   (4) yine de boşsa zorluktan herhangi biri. Oyun asla sorusuz kalmaz. */
function pickQuestion(z){
  const tierAll = BANK.filter(q => q.z===z);
  let fresh = tierAll.filter(q => !G.used.has(q.q) && !SEEN.has(q.q));
  // tüm zorluk tüm oyunlarda görülmüşse: o zorluğu sıfırla, oturum-içi kullanılmamışlardan seç
  if (!fresh.length){
    recycleSeenForTier(z);
    fresh = tierAll.filter(q => !G.used.has(q.q) && !SEEN.has(q.q));
  }
  let pool = fresh.length ? fresh : tierAll.filter(q => !G.used.has(q.q));
  if (!pool.length) pool = tierAll;
  // sınırlı denemeli yeniden seçim: SEEN/used dışı bir aday yakalamaya çalış
  let q = pick(pool);
  for (let tries=0; tries<12 && (G.used.has(q.q) || SEEN.has(q.q)) && fresh.length; tries++){
    q = pick(fresh);
  }
  return q;
}
function nextQuestion(){
  const z = tierOfFloor(G.floor+1);
  const q = pickQuestion(z);
  G.used.add(q.q);
  markSeen(q.q);
  // şıkları karıştır
  const order = shuffle([0,1,2,3]);
  G.cur = { q:q.q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a) };
  G.locked = false;
  $('floorChip').textContent = `🏰 Kat ${G.floor+1}/12 · ${['','🏕️','⛰️','🧗','🏔️'][z]}`;
  $('ptChip').textContent = '⭐ ' + CONFIG.POINTS[G.floor];
  $('qText').textContent = G.cur.q;
  const box = $('opts');
  box.innerHTML = '';
  G.cur.o.forEach((o,i) => {
    const b = document.createElement('button');
    b.className='opt'; b.textContent = String.fromCharCode(65+i)+') '+o;
    b.addEventListener('click', () => answer(i, b));
    box.appendChild(b);
  });
  Audio2.tension();
  startFuse();
  paintTower();
  refreshJokers();
}
function startFuse(){
  clearInterval(G.fuseT);
  const t0 = Date.now();
  $('fuse').style.width='100%';
  G.fuseT = setInterval(()=>{
    if (document.hidden) return;
    const left = 1 - (Date.now()-t0)/(CONFIG.Q_TIME*1000);
    $('fuse').style.width = Math.max(0,left*100)+'%';
    if (left<=0) answer(-1, null);
  },100);
}
function refreshJokers(){
  $('jHalf').disabled = !G.jokers.half || G.locked;
  $('jOwl').disabled = !G.jokers.owl || G.locked;
  $('jSecond').disabled = !G.jokers.second || G.secondActive || G.locked;
  $('jSecond').textContent = G.secondActive ? '🛡️ AKTİF' : '🛡️ Çift Hak';
}
function answer(i, btn){
  if (G.locked) return;
  clearInterval(G.fuseT);
  const right = i === G.cur.a;
  const btns = [...$('opts').children];
  if (right){
    G.locked = true;
    btns.forEach((b,j)=>{ b.disabled=true; if(j===G.cur.a) b.classList.add('right'); });
    Audio2.ok(); Audio2.floor();
    G.floor++;
    G.secondActive = false;
    paintTower();
    if (G.floor >= CONFIG.FLOORS) return setTimeout(()=>endRun('peak'), 900);
    setTimeout(nextQuestion, 1000);
  } else {
    // Çift Hak aktifse: bir yanlış affedilir (§4.18)
    if (G.secondActive && i >= 0){
      G.secondActive = false;
      if (btn){ btn.classList.add('wrong'); btn.classList.add('dim'); btn.disabled = true; }
      refreshJokers();
      startFuse();
      return;
    }
    G.locked = true;
    btns.forEach((b,j)=>{ b.disabled=true; if(j===G.cur.a) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); });
    Audio2.bad();
    setTimeout(()=>endRun('fall'), 1200);
  }
}
/* jokerler */
$('jHalf').addEventListener('click', ()=>{
  if (!G.jokers.half || G.locked) return;
  G.jokers.half = 0;
  const wrongs = [0,1,2,3].filter(i=>i!==G.cur.a);
  shuffle(wrongs).slice(0,2).forEach(i => $('opts').children[i].classList.add('dim'));
  refreshJokers();
});
$('jOwl').addEventListener('click', ()=>{
  if (!G.jokers.owl || G.locked) return;
  G.jokers.owl = 0;
  // Bilge Baykuş: %70 doğru tahmin (sınıf istatistiği backend'i lig altyapısıyla gelecek — şimdilik bilge dost!)
  const guess = Math.random() < CONFIG.OWL_ACCURACY ? G.cur.a : pick([0,1,2,3].filter(i=>i!==G.cur.a));
  const b = $('opts').children[guess];
  b.textContent = '🦉 ' + b.textContent;
  refreshJokers();
});
$('bWalk').addEventListener('click', ()=>{
  if (G.state!=='playing' || G.locked) return;
  endRun('walk');
});
function startRun(){
  rollDay();
  if (STATS.triesToday >= CONFIG.DAILY_TRIES) return;
  STATS.triesToday++; STATS.plays++;
  saveStats();
  G.state='playing'; G.floor=0;
  G.jokers={half:1,owl:1,second:1}; G.secondActive=false;
  G.used.clear();
  show('screen-game');
  buildTower();
  nextQuestion();
}
$('jSecond').addEventListener('click', ()=>{
  if (!G.jokers.second || G.secondActive || G.locked) return;
  G.jokers.second = 0;
  G.secondActive = true;
  refreshJokers();
});
function earned(reason){
  if (reason==='peak') return CONFIG.POINTS[CONFIG.FLOORS-1];
  if (reason==='walk') return G.floor>0 ? CONFIG.POINTS[G.floor-1] : 0;
  // düşüş: son güvenli kata (4 veya 8) iner — §4.18 baraj sistemi
  const safe = CONFIG.SAFE.filter(s => s <= G.floor).pop() || 0;
  return safe>0 ? CONFIG.POINTS[safe-1] : 0;
}
function endRun(reason){
  if (G.state!=='playing') return;
  G.state='result';
  clearInterval(G.fuseT);
  const pts = earned(reason);
  if (pts > STATS.best) STATS.best = pts;
  if (reason==='peak') STATS.peaks++;
  saveStats();
  BilnetBridge.submitScore({ gameId:'bilgi-kulesi', score:pts, tier:tierOfFloor(Math.max(1,G.floor)),
    stats:{ floor:G.floor, reason } });
  $('endEmoji').textContent = reason==='peak' ? '👑' : reason==='walk' ? '🚪' : '🛡️';
  $('endTitle').textContent = reason==='peak' ? 'ZİRVEYE ÇIKTIN!' : reason==='walk' ? 'Akıllıca Çekildin!' : 'Güvenli Kata İndin!';
  $('resScore').textContent = pts;
  $('endDetail').innerHTML = reason==='peak'
    ? `12 katın TAMAMINI tırmandın — kule senin! 🏰`
    : reason==='walk'
      ? `${G.floor}. kattan puanını alıp çekildin. Bazen durmak da kazanmaktır!`
      : `Yanlış cevap kuleyi yıkmadı — ${CONFIG.SAFE.filter(s=>s<=G.floor).pop()||0}. güvenli katta durdun.` +
        `<br><small>Doğrusu işaretlendi; bir dahaki tırmanışta görüşürüz! 💪</small>`;
  if (reason==='peak') Audio2.win();
  $('endVeil').classList.add('show');
}
$('endOk').addEventListener('click', ()=>{
  $('endVeil').classList.remove('show');
  G.state='menu'; refreshMenu(); show('screen-menu');
});
$('bQuitTop').addEventListener('click', ()=>{
  clearInterval(G.fuseT);
  G.state='menu'; refreshMenu(); show('screen-menu');
});
$('bPlay').addEventListener('click', ()=>{ Audio2.init(); startRun(); });
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) saveStats(); });
loadStats();
loadSeen();
</script>
