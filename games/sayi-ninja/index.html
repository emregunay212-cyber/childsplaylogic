<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/sayi-ninja/">
<title>Sayı Ninja — Kurala Uyanı Kes!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 5 / 4.14
     (Fruit Ninja esinli — kural motoru: üretici+doğrulayıcı çifti). Tasarım: §4.14 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#2a1a3a; --bg2:#160d22; --panel:#3d2a55; --ink:#fbf4ff; --ink-dim:#cdb8e0;
  --gold:#ffd23f; --hot:#ff5e9a; --ok:#6ee7a0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(27px,7.2vw,46px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#screen-menu .sub{opacity:.9;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:470px;color:var(--ink-dim)}
.tierGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,94vw);margin-bottom:12px}
.tierBtn{background:var(--panel);color:var(--ink);padding:12px 8px;font-size:15px;font-weight:700;border:3px solid transparent;display:flex;flex-direction:column;gap:3px}
.tierBtn small{font-weight:400;font-size:11.5px;color:var(--ink-dim)}
.tierBtn.on{border-color:var(--hot);transform:scale(1.03)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #b23064}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b23064}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:8px;min-height:17px}
#screen-game{padding:0;justify-content:flex-start}
#topBar{width:100%;background:var(--panel);padding:7px 10px;display:flex;flex-direction:column;gap:4px;z-index:5}
#hudRow{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800}
.chip{background:rgba(0,0,0,.25);border-radius:9px;padding:4px 10px;white-space:nowrap}
#ruleLine{font-size:clamp(15px,4.5vw,20px);font-weight:900;color:var(--gold);text-align:center}
#ruleLine.fresh{animation:rulePop .7s ease-out}
@keyframes rulePop{
  0%{transform:scale(1);color:var(--gold);text-shadow:none}
  25%{transform:scale(1.28);color:#fff;text-shadow:0 0 12px var(--hot),0 0 22px var(--gold)}
  50%{transform:scale(1.12);color:var(--gold);text-shadow:0 0 16px var(--gold)}
  75%{transform:scale(1.18);color:#fff;text-shadow:0 0 14px var(--hot),0 0 20px var(--gold)}
  100%{transform:scale(1);color:var(--gold);text-shadow:none}
}
/* Yeni görev banner overlay — ekran ortasında kısa süreli, yüksek z-index */
#ruleBanner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;z-index:60;pointer-events:none;text-align:center;padding:20px}
#ruleBanner.show{display:flex;animation:bannerIn .8s ease-out forwards}
#ruleBanner .bnTitle{font-size:clamp(30px,9vw,56px);font-weight:900;color:var(--hot);
  text-shadow:0 0 18px rgba(255,94,154,.7),0 4px 0 rgba(0,0,0,.45);letter-spacing:1px}
#ruleBanner .bnRule{font-size:clamp(18px,5.5vw,28px);font-weight:900;color:var(--gold);
  background:rgba(22,13,34,.78);border:3px solid var(--gold);border-radius:16px;
  padding:10px 20px;box-shadow:0 0 24px rgba(255,210,63,.45);max-width:92vw}
@keyframes bannerIn{
  0%{opacity:0;transform:scale(.4)}
  18%{opacity:1;transform:scale(1.18)}
  32%{transform:scale(.95)}
  44%{transform:scale(1.05)}
  56%{transform:scale(1)}
  82%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.12)}
}
#cv{flex:1;width:100%;display:block;touch-action:none}
#screen-game.shake{animation:scrShake .4s}
@keyframes scrShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,4px)}50%{transform:translate(8px,-4px)}75%{transform:translate(-5px,-3px)}}
#screen-result #resEmoji{font-size:52px}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
#resStats{background:var(--panel);border-radius:14px;padding:14px 20px;font-size:15px;line-height:1.7;margin:10px 0;max-width:420px}
#eduLine{font-weight:800}
#pauseVeil{position:fixed;inset:0;background:rgba(12,6,22,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20;padding:20px;text-align:center}
#pauseVeil.show{display:flex}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🥷 SAYI NİNJA 🔢</h1>
  <p class="sub">Sayılar havaya fırlıyor — kurala UYANLARI parmağınla kes! Kural her 15 saniyede değişir. Kurala uymayanı kesersen combo sıfırlanır. Çeldirici buluta dikkat! 🌫️</p>
  <div class="tierGrid">
    <button class="tierBtn on" data-t="1">🏕️ Etek<small>Çift/tek sayılar</small></button>
    <button class="tierBtn" data-t="2">⛰️ Yamaç<small>Katlar + büyük/küçük</small></button>
    <button class="tierBtn" data-t="3">🧗 Tırmanış<small>Asal + kare sayılar</small></button>
    <button class="tierBtn" data-t="4">🏔️ Zirve<small>Kesir karşılaştırma</small></button>
  </div>
  <button class="bigBtn" id="bPlay">🥷 BAŞLA</button>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="topBar">
    <div id="hudRow">
      <span class="chip" id="scoreChip">⭐ 0</span>
      <span class="chip" id="comboChip">🔥 ×1</span>
      <span class="chip" id="timeChip">⏱️ 75</span>
      <button class="chip" id="bPause">⏸️</button>
    </div>
    <div id="ruleLine">Çift sayıları kes!</div>
  </div>
  <canvas id="cv"></canvas>
</div>

<div id="ruleBanner">
  <div class="bnTitle">⚔️ YENİ GÖREV! ⚔️</div>
  <div class="bnRule" id="bnRuleText"></div>
</div>

<div id="pauseVeil">
  <h2 style="font-size:26px">⏸️ Mola!</h2>
  <p style="color:var(--ink-dim)">Ninja nefes alıyor.</p>
  <button class="bigBtn" id="bResume">▶️ Devam Et</button>
  <button class="ghost" id="bQuit">🏠 Menü</button>
</div>

<div class="screen" id="screen-result">
  <div id="resEmoji">🥷</div>
  <h1 style="font-size:25px">Antrenman Bitti!</h1>
  <div id="resScore">0</div>
  <div id="resStats"></div>
  <div id="eduLine"></div>
  <button class="bigBtn" id="bAgain" style="margin-top:12px">🔄 Tekrar Oyna</button>
  <button class="ghost" id="bMenu">🏠 Menü</button>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
