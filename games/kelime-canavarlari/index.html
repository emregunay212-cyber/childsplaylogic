<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/kelime-canavarlari/">
<title>Kelime Canavarları — Besle, Evrimleştir, Birleştir!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 3 / 4.8
     (Dragon City esinli; Zindan Okçusu fusion/nadirlik DNA'sı — savaş katmanı YOK).
     Tasarım: EGITSEL-OYUN-PLANI §4.8 -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
:root{
  --bg1:#1d3a2f; --bg2:#102219; --panel:#26513f; --panel2:#347054; --line:#478a69;
  --ink:#f0fff7; --ink-dim:#a9d8c0; --gold:#ffd23f; --hot:#ff7a59; --ok:#5fd68b;
  --common:#9fb6c4; --rare:#4aa8ff; --epic:#d36bff; --leg:#ffd23f;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none}
body{overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
#app{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
#top{padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px}
#hudRow{display:flex;gap:8px;justify-content:space-between;font-size:13px;font-weight:800}
.chip{background:var(--panel);border-radius:10px;padding:5px 11px;white-space:nowrap}
#tabs{display:flex;gap:6px}
.tab{flex:1;background:var(--panel);color:var(--ink-dim);padding:9px 4px;font-size:13.5px;font-weight:800;border-radius:12px 12px 0 0}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold)}
#content{flex:1;overflow-y:auto;background:var(--panel2);border-radius:0 0 14px 14px;padding:12px;-webkit-overflow-scrolling:touch}

/* canavar kartları */
#monGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.monCard{background:var(--panel);border-radius:16px;padding:12px 8px;text-align:center;border:3px solid var(--line);position:relative}
.monCard.r-rare{border-color:var(--rare)}
.monCard.r-epic{border-color:var(--epic);box-shadow:0 0 12px rgba(211,107,255,.25)}
.monCard.r-leg{border-color:var(--leg);box-shadow:0 0 14px rgba(255,210,63,.3)}
.monCard.eggCard{opacity:.85}
.monEmoji{font-size:44px;line-height:1.2}
.monName{font-weight:800;font-size:13.5px;margin-top:4px}
.monKat{font-size:11px;color:var(--ink-dim)}
.monBar{height:7px;background:rgba(0,0,0,.3);border-radius:5px;overflow:hidden;margin:6px 8px 0}
.monBar i{display:block;height:100%;background:var(--ok)}
.monBtn{background:var(--gold);color:#3c2a0e;font-weight:900;font-size:12.5px;padding:8px 10px;margin-top:8px;box-shadow:0 3px 0 #b8901c}
.monBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8901c}
.monBtn.fusion{background:var(--epic);color:#fff;box-shadow:0 3px 0 #8a3aad}
.evoTag{position:absolute;top:6px;right:8px;font-size:11px;font-weight:900;color:var(--gold)}
.secHead{font-size:13px;font-weight:800;color:var(--ink-dim);margin:6px 2px 8px;display:flex;justify-content:space-between}

/* quiz */
.veil{position:fixed;inset:0;background:rgba(5,18,12,.92);display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
.veil.show{display:flex}
.card{background:var(--panel2);border-radius:18px;padding:18px;width:min(460px,96vw);max-height:92vh;overflow:auto;text-align:center}
#qzFuseWrap{height:7px;background:var(--panel);border-radius:5px;overflow:hidden;margin:10px 0}
#qzFuse{height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
#qzText{font-size:clamp(17px,4.8vw,22px);font-weight:800;min-height:54px;display:flex;align-items:center;justify-content:center}
#qzOpts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.opt{background:var(--panel);color:var(--ink);padding:13px 8px;font-size:15px;font-weight:700;border:2px solid var(--line)}
.opt.right{background:#1d5c38;border-color:var(--ok)}
.opt.wrong{background:#5c1d28;border-color:#d6536a}
.bigBtn{background:var(--hot);color:#fff;font-size:17px;font-weight:800;padding:13px 28px;box-shadow:0 4px 0 #c2503a;margin-top:12px}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #c2503a}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#evoChar{font-size:70px;animation:evoPop .7s}
@keyframes evoPop{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0a1f14;color:#fff;
  padding:10px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:opacity .3s;z-index:40;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="hudRow">
      <span class="chip" id="colChip">📖 0/24</span>
      <span class="chip" id="solvedChip">✅ 0 doğru</span>
      <span class="chip" id="fusionChip">🧬 0 melez</span>
    </div>
    <div id="tabs">
      <button class="tab on" data-tab="mons">🐉 Canavarlarım</button>
      <button class="tab" data-tab="book">📖 Koleksiyon</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- QUIZ -->
<div class="veil" id="quizVeil">
  <div class="card">
    <div style="font-weight:900" id="qzTitle">🍖 Besleme Quizi</div>
    <div id="qzInfo" style="font-size:12.5px;color:var(--ink-dim);margin-top:3px">Soru 1/5</div>
    <div id="qzFuseWrap"><div id="qzFuse"></div></div>
    <div id="qzText"></div>
    <div id="qzOpts"></div>
  </div>
</div>

<!-- EVRİM / YENİ CANAVAR -->
<div class="veil" id="evoVeil">
  <div class="card">
    <h2 id="evoTitle">🎊 EVRİM!</h2>
    <div id="evoChar">🦎</div>
    <div id="evoName" style="font-weight:900;font-size:19px"></div>
    <p id="evoDetail" style="font-size:13px;color:var(--ink-dim);margin-top:6px"></p>
    <button class="bigBtn" id="evoOk">Müthiş!</button>
  </div>
</div>

<!-- QUIZ SONU -->
<div class="veil" id="resultVeil">
  <div class="card">
    <div style="font-size:46px" id="resEmoji">🍖</div>
    <h2 id="resTitle">Beslendi!</h2>
    <p id="resDetail" style="margin-top:8px;line-height:1.6;color:var(--ink-dim)"></p>
    <button class="bigBtn" id="resOk">Devam</button>
  </div>
</div>

<div id="toast"></div>

<!-- Eğitsel kit (B5): tek AudioContext, pick/shuffle, window.storage köprüsü (localStorage, Promise API;
     Google girişli kullanıcıda hub bu anahtarları users/{uid}/gameSaves ile senkronlar), gizlenince duraklatma.
     Satır içi script yok (CSP). Oyun kodu: game.js -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
