<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eşleştirme Ustası — İlişkili Çiftleri Bul!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK. Eğitsel seri Faz 4 / 4.11
     (Memory/Pexeso — çiftler ÖZDEŞ DEĞİL, İLİŞKİLİ). Tasarım: EGITSEL-OYUN-PLANI §4.11 -->
<style>
:root{
  --bg1:#3a2a63; --bg2:#241a44; --panel:#4d3a80; --ink:#fdf6ff; --ink-dim:#c9b8e8;
  --gold:#ffd23f; --hot:#ff5e9a; --ok:#6ee7a0;
  --c1:#37c8ab; --c2:#4aa8ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}
.screen.show{display:flex}
#screen-menu h1{font-size:clamp(27px,7.2vw,46px);text-shadow:0 3px 0 rgba(0,0,0,.4)}
#screen-menu .sub{opacity:.92;margin:6px 0 14px;font-size:clamp(13px,3.5vw,16px);max-width:470px;color:var(--ink-dim)}
.tierGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(440px,94vw);margin-bottom:10px}
.tierBtn{background:var(--panel);color:var(--ink);padding:12px 8px;font-size:15px;font-weight:700;
  border:3px solid transparent;display:flex;flex-direction:column;gap:3px}
.tierBtn small{font-weight:400;font-size:11.5px;color:var(--ink-dim)}
.tierBtn.on{border-color:var(--hot);transform:scale(1.03)}
.dersRow{display:flex;gap:8px;margin-bottom:12px}
.dersBtn{background:var(--panel);color:var(--ink);padding:9px 14px;font-weight:800;font-size:14px;border:3px solid transparent}
.dersBtn.on{border-color:var(--gold)}
.bigBtn{background:var(--hot);color:#fff;font-size:18px;font-weight:800;padding:14px 32px;box-shadow:0 4px 0 #b23064}
.bigBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b23064}
.ghost{background:transparent;color:var(--ink-dim);font-size:13px;padding:8px;text-decoration:underline}
#ustaRow{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--ink-dim)}
#ustaRow input{transform:scale(1.3);margin-right:6px}
#bestLine{font-size:13px;color:var(--ink-dim);margin-top:8px;min-height:17px}

#screen-game{padding:0;justify-content:flex-start}
#topBar{width:100%;background:var(--panel);padding:8px 10px;display:flex;justify-content:space-between;gap:8px;
  font-size:13px;font-weight:800;z-index:5}
.chip{background:var(--bg1);border-radius:9px;padding:4px 10px;white-space:nowrap}
#boardWrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:8px}
#board{display:grid;gap:8px}
.cardC{perspective:600px;cursor:pointer}
.cardI{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .4s}
.cardC.open .cardI{transform:rotateY(180deg)}
.cardC.matched .cardI{transform:rotateY(180deg)}
.cardC.matched{animation:matchPulse .5s}
@keyframes matchPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-weight:900;padding:4px;text-align:center;line-height:1.15}
.back{background:linear-gradient(135deg,var(--panel),#5d4a96);border:3px solid #6b58a8;font-size:26px}
.front{background:#fff;color:#2a1f4a;transform:rotateY(180deg);border:3px solid var(--c2)}
.cardC.matched .front{border-color:var(--ok);background:#e9fbef}
.cardC.t2 .front{border-color:var(--c1)}

#screen-result{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#resStars{font-size:46px;letter-spacing:6px}
#resScore{font-size:clamp(32px,9vw,48px);font-weight:900;color:var(--gold)}
#resStats{background:var(--panel);border-radius:14px;padding:14px 20px;font-size:15px;line-height:1.7;margin:10px 0;max-width:420px}
#eduLine{font-weight:800}
</style>
</head>
<body>

<div class="screen show" id="screen-menu">
  <h1>🃏 EŞLEŞTİRME USTASI 🧠</h1>
  <p class="sub">Kartlar özdeş değil, İLİŞKİLİ: "7×8" kartının eşi "56", "cat" kartının eşi 🐱! Az hamlede bitir, 3 yıldızı kap.</p>
  <div class="dersRow">
    <button class="dersBtn on" data-d="en">🇬🇧 İngilizce</button>
    <button class="dersBtn" data-d="mat">🧮 Matematik</button>
    <button class="dersBtn" data-d="fen">🔬 Fen</button>
  </div>
  <div class="tierGrid">
    <button class="tierBtn on" data-t="1">🏕️ Etek<small>4×3 · 6 çift</small></button>
    <button class="tierBtn" data-t="2">⛰️ Yamaç<small>4×4 · 8 çift</small></button>
    <button class="tierBtn" data-t="3">🧗 Tırmanış<small>5×4 · 10 çift + hamle sınırı</small></button>
    <button class="tierBtn" data-t="4">🏔️ Zirve<small>6×5 · 15 çift + 120 sn</small></button>
  </div>
  <div id="ustaRow"><label><input type="checkbox" id="ustaChk">🧠 Usta Modu: kartlar 3 sn açık gösterilir, sonra ezbere!</label></div>
  <button class="bigBtn" id="bPlay">🃏 BAŞLA</button>
  <div id="bestLine"></div>
</div>

<div class="screen" id="screen-game">
  <div id="topBar">
    <span class="chip" id="moveChip">👆 0</span>
    <span class="chip" id="pairChip">✅ 0/6</span>
    <span class="chip" id="limitChip" style="display:none">⏱️</span>
    <button class="chip" id="bQuitTop">🏠</button>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
</div>

<div class="screen" id="screen-result">
  <div style="font-size:48px" id="resEmoji">🏆</div>
  <h1 style="font-size:25px" id="resTitle">Tamamlandı!</h1>
  <div id="resStars">⭐⭐⭐</div>
  <div id="resScore">0</div>
  <div id="resStats"></div>
  <div id="eduLine"></div>
  <button class="bigBtn" id="bAgain" style="margin-top:12px">🔄 Tekrar Oyna</button>
  <button class="ghost" id="bMenu">🏠 Menü</button>
</div>

<script>
(function () {
  if (window.storage && window.storage.get && window.storage.set) return;
  window.storage = {
    get: function (key) { try { var v = localStorage.getItem(key); return Promise.resolve(v != null ? { value: v } : null); } catch (e) { return Promise.resolve(null); } },
    set: function (key, value) { try { localStorage.setItem(key, value); return Promise.resolve(); } catch (e) { return Promise.resolve(); } },
    remove: function (key) { try { localStorage.removeItem(key); return Promise.resolve(); } catch (e) { return Promise.resolve(); } }
  };
})();
</script>
<script>
"use strict";
/* ================= CONFIG (EGITSEL-OYUN-PLANI §4.11 — aynen) ================= */
const CONFIG = {
  TIERS: {
    1: { cols: 3, rows: 4, pairs: 6 },
    2: { cols: 4, rows: 4, pairs: 8 },
    3: { cols: 4, rows: 5, pairs: 10, moveLimit: true },   // hamle sınırı
    4: { cols: 5, rows: 6, pairs: 15, timeLimit: 120 },     // süre sınırı 120 sn
  },
  STAR3_FACTOR: 1.5,            // 3⭐ = çift sayısı × 1.5 hamleden az
  PAIR_POINT: 50,               // 50/çift
  MOVE_BONUS: 8,                // kalan hamle bonusu (sınırlı modlarda)
  USTA_PREVIEW_MS: 3000,        // usta modu: 3 sn açık gösterim
  MOVE_LIMIT_FACTOR: 2.4,       // hamle sınırı = çift × 2.4
};
/* İLİŞKİLİ çift havuzları (özdeş değil!) */
const POOLS = {
  en: [ ['cat','🐱'],['dog','🐶'],['sun','☀️'],['fish','🐟'],['bird','🐦'],['apple','🍎'],['book','📖'],
        ['star','⭐'],['tree','🌳'],['car','🚗'],['house','🏠'],['moon','🌙'],['bee','🐝'],['key','🔑'],
        ['milk','🥛'],['rain','🌧️'],['shoe','👟'],['ball','⚽'],['cake','🎂'],['ship','🚢'] ],
  mat: [ ['7×8','56'],['6×6','36'],['9×4','36✱'],['12+19','31'],['45−18','27'],['8×9','72'],['54÷6','9'],
         ['5×7','35'],['13+28','41'],['72÷8','9✱'],['11×3','33'],['90−47','43'],['6×9','54'],['64÷8','8'],
         ['25+36','61'],['100−55','45'],['7×7','49'],['81÷9','9✦'],['4×12','48'],['15+47','62'] ],
  fen: [ ['Buharlaşma','💧→☁️'],['Donma','💧→🧊'],['Erime','🧊→💧'],['Yağmur','☁️→💧'],['Fotosentez','🌿+☀️'],
         ['Mıknatıs','🧲'],['Yerçekimi','🍎⬇️'],['Güneş','☀️'],['Ay','🌙'],['Kalp','🫀'],['Akciğer','🫁'],
         ['Omurgalı','🐟'],['Omurgasız','🐛'],['Işık','💡'],['Ses','🔔'],['Geri dönüşüm','♻️'],
         ['Gezegen','🪐'],['Tohum','🌱'],['Enerji','⚡'],['Bulut','☁️'] ],
};
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ================= Audio ================= */
const Audio2 = (() => {
  let ctx = null;
  function init(){ if (!ctx){ try { ctx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (ctx && ctx.state==='suspended') ctx.resume(); }
  function tone(f,d,t,v,w){ if(!ctx)return; const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=t||'triangle'; o.frequency.value=f;
    g.gain.setValueAtTime(v||0.06, ctx.currentTime+(w||0));
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+(w||0)+d);
    o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+(w||0)); o.stop(ctx.currentTime+(w||0)+d+0.02); }
  return { init,
    flip: () => tone(420,0.07,'square',0.04),
    match: () => { tone(660,0.1,'triangle',0.07); tone(880,0.13,'triangle',0.07,0.09); },
    miss: () => tone(200,0.18,'sawtooth',0.04),
    fanfare: () => [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.07,i*0.12)) };
})();

/* ================= Bridge + İstatistik ================= */
const BilnetBridge = {
  QUEUE_KEY: 'bilnet_score_queue',
  async submitScore(p){ const rec={...p,ts:Date.now()};
    try{ const r=await window.storage.get(this.QUEUE_KEY); const q=r&&r.value?JSON.parse(r.value):[];
      q.push(rec); while(q.length>50)q.shift(); await window.storage.set(this.QUEUE_KEY,JSON.stringify(q)); }catch(e){} },
};
const STATS_KEY = 'eslestirme_stats';
let STATS = { plays:0, pairs:0, best:{1:0,2:0,3:0,4:0} };
function loadStats(){ try{ window.storage.get(STATS_KEY).then(r=>{ if(r&&r.value){ try{ STATS=Object.assign(STATS,JSON.parse(r.value)); }catch(e){} } refreshBest(); }); }catch(e){} }
function saveStats(){ try{ window.storage.set(STATS_KEY,JSON.stringify(STATS)); }catch(e){} }

/* ================= Game ================= */
const $ = id => document.getElementById(id);
const G = { state:'menu', tier:1, ders:'en', usta:false,
  moves:0, found:0, pairs:6, open:[], lock:false,
  moveLimit:0, timeLeft:0, secT:null, score:0 };

function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show')); $(id).classList.add('show'); }
function refreshHUD(){
  $('moveChip').textContent = '👆 ' + G.moves + (G.moveLimit ? '/'+G.moveLimit : '');
  $('pairChip').textContent = `✅ ${G.found}/${G.pairs}`;
  const lc = $('limitChip');
  if (G.timeLeft > 0){ lc.style.display=''; lc.textContent = '⏱️ ' + G.timeLeft; } else lc.style.display='none';
}
function startRound(){
  const T = CONFIG.TIERS[G.tier];
  G.state='playing'; G.moves=0; G.found=0; G.pairs=T.pairs; G.open=[]; G.lock=false; G.score=0;
  G.moveLimit = T.moveLimit ? Math.round(T.pairs * CONFIG.MOVE_LIMIT_FACTOR) : 0;
  G.timeLeft = T.timeLimit || 0;
  show('screen-game');
  // kartları kur
  const pool = shuffle(POOLS[G.ders].slice()).slice(0, T.pairs);
  const cards = shuffle(pool.flatMap((p,i) => [
    { pid:i, side:0, text:p[0] }, { pid:i, side:1, text:p[1] } ]));
  const wrap = $('boardWrap').getBoundingClientRect();
  const cw = Math.min(Math.floor((wrap.width-16-(T.cols-1)*8)/T.cols), 110);
  const ch = Math.min(Math.floor((wrap.height-16-(T.rows-1)*8)/T.rows), 110);
  const board = $('board');
  board.style.gridTemplateColumns = `repeat(${T.cols}, ${cw}px)`;
  board.innerHTML = '';
  cards.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cardC' + (c.side ? ' t2' : '');
    el.style.width = cw+'px'; el.style.height = ch+'px';
    const isEmoji = /\p{Extended_Pictographic}/u.test(c.text);
    el.innerHTML = `<div class="cardI">
      <div class="face back">❔</div>
      <div class="face front" style="font-size:${isEmoji ? Math.round(ch*0.5) : Math.max(13, Math.min(20, Math.round(cw*1.5/Math.max(3,c.text.length))))}px">${c.text}</div>
    </div>`;
    el.addEventListener('click', () => flip(el, c));
    board.appendChild(el);
  });
  refreshHUD();
  clearInterval(G.secT);
  if (G.timeLeft > 0){
    G.secT = setInterval(() => {
      if (G.state!=='playing' || document.hidden) return;
      G.timeLeft--; refreshHUD();
      if (G.timeLeft<=0) endRound(false);
    }, 1000);
  }
  // usta modu: 3 sn ön gösterim
  if (G.usta){
    G.lock = true;
    [...board.children].forEach(el => el.classList.add('open'));
    setTimeout(() => { [...board.children].forEach(el => el.classList.remove('open')); G.lock=false; }, CONFIG.USTA_PREVIEW_MS);
  }
}
function flip(el, c){
  if (G.state!=='playing' || G.lock || el.classList.contains('open') || el.classList.contains('matched')) return;
  Audio2.init(); Audio2.flip();
  el.classList.add('open');
  G.open.push({ el, c });
  if (G.open.length === 2){
    G.moves++;
    const [a,b] = G.open;
    if (a.c.pid === b.c.pid){
      a.el.classList.add('matched'); b.el.classList.add('matched');
      a.el.classList.remove('open'); b.el.classList.remove('open');
      G.found++;
      Audio2.match();
      G.open = [];
      refreshHUD();
      if (G.found >= G.pairs) endRound(true);
      else if (G.moveLimit && G.moves >= G.moveLimit) endRound(false);
    } else {
      G.lock = true;
      Audio2.miss();
      setTimeout(() => {
        a.el.classList.remove('open'); b.el.classList.remove('open');
        G.open = []; G.lock = false;
        refreshHUD();
        if (G.moveLimit && G.moves >= G.moveLimit) endRound(false);
      }, 750);
    }
    refreshHUD();
  }
}
function endRound(win){
  if (G.state!=='playing') return;
  G.state='result';
  clearInterval(G.secT);
  // yıldız: 3⭐ = çift×1.5 hamleden az (§4.11)
  const th3 = Math.ceil(G.pairs * CONFIG.STAR3_FACTOR);
  const stars = !win ? (G.found >= G.pairs*0.6 ? 1 : 0)
    : G.moves <= th3 ? 3 : G.moves <= th3 + G.pairs ? 2 : 1;
  const moveBonus = G.moveLimit ? Math.max(0, G.moveLimit - G.moves) * CONFIG.MOVE_BONUS : 0;
  G.score = G.found * CONFIG.PAIR_POINT + moveBonus;
  STATS.plays++; STATS.pairs += G.found;
  const isBest = G.score > (STATS.best[G.tier]||0);
  if (isBest) STATS.best[G.tier] = G.score;
  saveStats();
  BilnetBridge.submitScore({ gameId:'eslestirme-ustasi', score:G.score, tier:G.tier,
    stats:{ pairs:G.found, moves:G.moves, stars, ders:G.ders } });
  $('resEmoji').textContent = stars===3 ? '🏆' : win ? '🃏' : '💪';
  $('resTitle').textContent = win ? 'Tamamlandı!' : (G.timeLeft<=0 ? 'Süre Doldu!' : 'Hamleler Bitti!');
  $('resStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3-stars);
  $('resScore').textContent = G.score;
  $('resStats').innerHTML = `✅ Çift: <b>${G.found}/${G.pairs}</b> · 👆 Hamle: <b>${G.moves}</b>${G.moveLimit?'/'+G.moveLimit:''}` +
    (moveBonus?` · 🎁 Bonus: <b>+${moveBonus}</b>`:'') +
    (isBest?`<br>🏅 <b>YENİ REKOR!</b>`:'');
  $('eduLine').textContent = G.found>0 ? `Bugün ${G.found} bilgi çifti eşleştirdin! 🎉` : 'Hafızanı ısıttın — tekrar dene! 💪';
  if (stars===3) Audio2.fanfare();
  show('screen-result');
  refreshBest();
}
function refreshBest(){
  const b = STATS.best[G.tier]||0;
  $('bestLine').textContent = b>0 ? `🏅 ${['','Etek','Yamaç','Tırmanış','Zirve'][G.tier]} rekorun: ${b}` : '';
}
document.querySelectorAll('.tierBtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tierBtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); G.tier=parseInt(b.dataset.t,10); refreshBest();
}));
document.querySelectorAll('.dersBtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dersBtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); G.ders=b.dataset.d;
}));
$('bPlay').addEventListener('click',()=>{ Audio2.init(); G.usta=$('ustaChk').checked; startRound(); });
$('bAgain').addEventListener('click',startRound);
$('bMenu').addEventListener('click',()=>{ G.state='menu'; show('screen-menu'); refreshBest(); });
$('bQuitTop').addEventListener('click',()=>{ clearInterval(G.secT); G.state='menu'; show('screen-menu'); refreshBest(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveStats(); });
loadStats();
</script>
</body>
</html>
