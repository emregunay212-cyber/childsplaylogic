<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://bilnetoyun.com/oyunlar/lingo/">
<title>Lingo — 5 Harfli Kelimeyi Bul!</title>
<!-- Portal standardı: tek dosya, harici bağımlılık YOK (yazı tipi self-host: assets/fonts/fredoka).
     Lingo (TV yarışması biçimi): ilk harf verilir, 5 harfli kelime 5 denemede bulunur; bulunan harfler
     kilitlenir, yalnız boş kutular yazılır. Tek oyuncu ya da 2 takım (aynı cihaz, sıra değişir; takım
     bilemezse karşı takıma bir harf daha açılır ve tek hak verilir). Oyun kodu: game.js (satır içi script yok). -->
<link rel="stylesheet" href="../_shared/edu-kit.css">
<style>
  @font-face {
    font-family: 'Fredoka';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url(../../assets/fonts/fredoka-v17-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Fredoka';
    font-style: normal;
    font-weight: 300 700;
    font-display: swap;
    src: url(../../assets/fonts/fredoka-v17-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root{
    --sky1:#7fd3ff; --sky2:#c9f0ff; --ink:#3b2a6b; --panel:#ffffff; --tile:#ffffff; --tile-b:#d9d2f5;
    --red:#ff5d73; --green:#3ccf6e; --green-d:#23a752; --yel:#ffd23f; --yel-d:#e6ae00;
    --pink:#ff7eb6; --purple:#8f6bff; --orange:#ff9f43; --muted:#7a6aa8; --key:#ffffff;
  }
  *{box-sizing:border-box}
  html{min-height:100%;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 60%,#e8ffd9 100%) fixed}
  html,body{margin:0;color:var(--ink)}
  body{font-family:"Fredoka","Comic Sans MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px 16px 24px;-webkit-tap-highlight-color:transparent;user-select:none;
    overflow-x:hidden}
  /* bulutlar */
  .cloud{position:fixed;background:#fff;border-radius:999px;opacity:.85;z-index:-1;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:50%;height:160%;left:15%;top:-70%}
  .cloud::after{width:38%;height:130%;right:12%;top:-45%}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
  .wrap{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px}
  /* başlık */
  .title{display:flex;gap:6px;margin-top:4px}
  .title span{display:grid;place-items:center;width:46px;height:50px;border-radius:14px;font-size:2rem;font-weight:700;color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.18);animation:bob 2.4s ease-in-out infinite}
  .title span:nth-child(1){background:var(--red)}
  .title span:nth-child(2){background:var(--orange);animation-delay:.15s}
  .title span:nth-child(3){background:var(--yel);color:var(--ink);animation-delay:.3s}
  .title span:nth-child(4){background:var(--green);animation-delay:.45s}
  .title span:nth-child(5){background:var(--purple);animation-delay:.6s}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
  /* maskot + konuşma balonu */
  .mascotRow{display:flex;align-items:center;gap:8px;width:100%}
  .mascot{font-size:3rem;line-height:1;transition:transform .3s;flex-shrink:0}
  .mascot.happy{animation:jump .6s ease 2}
  .mascot.sad{transform:rotate(-12deg)}
  @keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-16px) scale(1.15)}}
  .msg{position:relative;flex:1;min-height:52px;background:#fff;border-radius:18px;padding:8px 14px;font-weight:600;font-size:1.1rem;display:flex;flex-direction:column;justify-content:center;box-shadow:0 4px 0 var(--tile-b)}
  .msg::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
  .msg .ans{color:var(--purple);letter-spacing:.12em;font-size:1.3rem}
  .mean{font-weight:400;font-size:.92rem;color:var(--muted);margin-top:2px;line-height:1.35}
  /* ayarlar */
  .controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
  .seg{display:flex;background:rgba(255,255,255,.7);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
  .seg button.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 #6a49d6}
  .chk{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.7);padding:5px 11px;border-radius:999px;font-size:.92rem;font-weight:600;color:var(--muted);cursor:pointer}
  .chk input{accent-color:var(--purple);width:16px;height:16px}
  .settings{width:100%;display:flex;flex-direction:column;align-items:center}
  .settings summary{list-style:none;cursor:pointer;font-weight:700;color:var(--purple);background:rgba(255,255,255,.7);padding:4px 16px;border-radius:999px}
  .settings summary::-webkit-details-marker{display:none}
  .settings[open] summary{margin-bottom:8px}
  .settings .controls{margin-bottom:6px}
  /* puanlar */
  .scores{display:flex;gap:10px;width:100%}
  .sc{flex:1;background:#fff;border-radius:18px;padding:4px 10px;text-align:center;border:4px solid transparent;box-shadow:0 4px 0 var(--tile-b);transition:border-color .2s,transform .2s}
  .sc.on{border-color:var(--yel);transform:scale(1.04)}
  .sc small{display:block;color:var(--muted);font-weight:600;font-size:.9rem}
  .sc b{font-size:1.7rem;line-height:1.1}
  .timer{width:100%;height:12px;background:rgba(255,255,255,.7);border-radius:999px;overflow:hidden;visibility:hidden}
  .timer.show{visibility:visible}
  .timer div{height:100%;width:100%;background:var(--green);border-radius:999px;transition:width 1s linear}
  .timer div.low{background:var(--red)}
  /* tahta */
  .board{display:grid;gap:7px;width:min(100%,350px);cursor:text}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
  .row.steal .tile{border-color:var(--orange)}
  .tile{aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:clamp(1.6rem,8.5vw,2.4rem);background:var(--tile);border:3px solid var(--tile-b);border-radius:16px;box-shadow:0 5px 0 var(--tile-b);color:var(--ink);transition:transform .1s}
  .tile.filled{border-color:var(--purple);box-shadow:0 5px 0 #6a49d6;transform:scale(1.04)}
  .tile.cursor{border-color:var(--pink);box-shadow:0 5px 0 #e35d99;animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .tile.lock{background:var(--green);border-color:var(--green);box-shadow:0 5px 0 var(--green-d);color:#fff;opacity:.85}
  .tile.ok{background:var(--green);border-color:var(--green);box-shadow:0 5px 0 var(--green-d);color:#fff}
  .tile.near{background:radial-gradient(circle,var(--yel) 0 60%,#fff 63%);border-color:var(--yel);box-shadow:0 5px 0 var(--yel-d)}
  .tile.no{background:#ebe7f7;border-color:#ebe7f7;box-shadow:0 5px 0 #d3cdea;color:#a79cc8}
  .tile.flip{animation:flip .4s ease}
  .tile.win{animation:hop .6s ease}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(.9)}100%{transform:rotateY(0)}}
  @keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-18px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}}
  .row.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  .kinput{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;pointer-events:none}
  .tapHint{color:var(--purple);font-weight:700;font-size:1rem;display:none;animation:bob 1.6s ease-in-out infinite}
  .tapHint.show{display:block}
  /* klavye */
  .kb{display:flex;flex-direction:column;gap:7px;width:100%}
  .kb.hide{display:none}
  .kr{display:flex;gap:4px;justify-content:center}
  .k{flex:1;max-width:40px;height:50px;border:0;border-radius:12px;background:var(--key);color:var(--ink);font:inherit;font-weight:700;font-size:1.15rem;cursor:pointer;padding:0;box-shadow:0 4px 0 var(--tile-b)}
  .k.wide{flex:1.6;max-width:66px;font-size:.85rem;background:var(--purple);color:#fff;box-shadow:0 4px 0 #6a49d6}
  .k.ok{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
  .k.near{background:var(--yel);box-shadow:0 4px 0 var(--yel-d)}
  .k.no{background:#ebe7f7;color:#b7acd6;box-shadow:0 4px 0 #d3cdea}
  .k:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-b)}
  /* butonlar */
  .btnRow{display:flex;gap:8px}
  .next{border:0;background:var(--orange);color:#fff;font:inherit;font-weight:700;font-size:1.15rem;padding:8px 24px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 #d97a1e}
  .next.giveup{background:#fff;color:var(--muted);box-shadow:0 5px 0 var(--tile-b);font-size:1rem}
  .next:active{transform:translateY(3px);box-shadow:none}
  .snd{border:0;background:#fff;border-radius:999px;width:46px;font-size:1.3rem;cursor:pointer;box-shadow:0 5px 0 var(--tile-b)}
  .help{color:var(--muted);font-size:.95rem;text-align:center;line-height:1.45;max-width:380px;background:rgba(255,255,255,.6);border-radius:18px;padding:8px 14px}
  .dot{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 3px}
  .dot.r{background:var(--green);border-radius:5px}
  .dot.y{background:var(--yel);border-radius:50%}
  /* konfeti */
  .confetti{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="cloud" style="top:8%;width:120px;height:40px;animation-duration:60s"></div>
  <div class="cloud" style="top:30%;width:90px;height:30px;animation-duration:80s;animation-delay:-30s"></div>
  <div class="cloud" style="top:62%;width:140px;height:44px;animation-duration:95s;animation-delay:-60s"></div>
  <div class="title" aria-label="Lingo"><span>L</span><span>İ</span><span>N</span><span>G</span><span>O</span></div>

  <details class="settings">
  <summary>⚙️ Ayarlar</summary>
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button type="button" data-mode="solo" class="on">Tek oyuncu</button>
      <button type="button" data-mode="team">2 Takım</button>
    </div>
    <label class="chk"><input type="checkbox" id="timerChk"> Süre (20 sn)</label>
    <label class="chk"><input type="checkbox" id="kbChk"> Ekran klavyesi</label>
  </div>
  <div class="controls" id="dictControls">
    <div class="seg" id="poolSeg">
      <button type="button" data-pool="easy" class="on">Kolay kelimeler</button>
      <button type="button" data-pool="tdk">Tüm TDK</button>
    </div>
    <label class="chk"><input type="checkbox" id="dictChk" checked> Sözlük kontrolü</label>
  </div>
  </details>

  <form id="kform" autocomplete="off">
    <label class="kinput" for="kinput">Kelime</label>
    <input id="kinput" class="kinput" type="text" inputmode="text" enterkeyhint="go"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" lang="tr">
  </form>

  <div class="scores" id="scores"></div>
  <div class="timer" id="timer"><div id="timerBar"></div></div>

  <div class="board" id="board"></div>
  <div class="tapHint" id="tapHint">👆 Yazmak için kutulara dokun</div>
  <div class="mascotRow">
    <div class="mascot" id="mascot">🦉</div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>
  <div class="btnRow">
    <button type="button" class="next giveup" id="nextBtn">Pes et</button>
    <button type="button" class="snd" id="sndBtn" title="Ses" aria-label="Sesi aç/kapat">🔊</button>
  </div>

  <div class="kb" id="kb"></div>

  <p class="help">
    İlk harf verilir. 5 harfli kelimeyi 5 denemede bul!<br>
    Bulunan harfler kendiliğinden yerleşir, sadece boş kutuları doldur.<br>
    <span class="dot r"></span>Doğru yer &nbsp; <span class="dot y"></span>Kelimede var, yeri yanlış<br>
    <b>2 Takım:</b> Takım bilemezse diğer takıma 1 harf daha açılır ve tek hak verilir.
  </p>
</div>

<!-- Eğitsel kit (B5): tek AudioContext, gizlenince duraklatma; satır içi script yok (CSP). Oyun kodu: game.js.
     İsteğe bağlı TDK sözlüğü: aynı klasöre tdk-kelimeler.js (window.TDK5 = { KELİME: "anlam" }) konulup
     game.js'ten ÖNCE <script src="tdk-kelimeler.js"></script> ile yüklenirse "Tüm TDK" havuzu ve anlamlar açılır;
     dosya yokken oyun kolay listeyle çalışır (sözlük ayarları gizlenir). -->
<script src="../_shared/edu-kit.js"></script>
<script src="game.js"></script>
</body>
</html>
