<!DOCTYPE html>
<html lang="tr" data-lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buz Kulesi</title>
<style>
/* ── Fabrika kabuk stilleri ── */
:root {
    --theme: #4FC3F7;
    --shell-bg1: #141b33;
    --shell-bg2: #0d1226;
    --shell-text: #f3f5ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
    font-family: system-ui, 'Segoe UI', -apple-system, Roboto, sans-serif;
    background: linear-gradient(160deg, var(--shell-bg1), var(--shell-bg2));
    color: var(--shell-text);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
}
#particles-canvas {
    position: fixed; inset: 0; z-index: 900; pointer-events: none;
}
#game-container { position: fixed; inset: 0; display: none; }
#game-container.active { display: block; }
.game-area {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 8px; overflow: hidden;
}
.hidden { display: none !important; }

/* Overlay'ler (menü / bölümler / bölüm-sonu) */
.shell-screen {
    position: fixed; inset: 0; z-index: 800;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    background: linear-gradient(160deg, var(--shell-bg1), var(--shell-bg2));
}
.shell-screen.overlay { background: rgba(10, 14, 30, 0.88); }
.shell-title {
    font-size: clamp(34px, 8vw, 60px); font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--theme), #fff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,.45));
}
.shell-sub { font-size: clamp(14px, 3.4vw, 18px); opacity: .82; max-width: 520px; line-height: 1.55; }
.shell-btn {
    font: inherit; font-size: clamp(17px, 4vw, 22px); font-weight: 700;
    color: #fff; background: var(--theme);
    border: none; border-radius: 16px;
    padding: 14px 44px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.22);
    transition: transform .12s ease;
}
.shell-btn:active { transform: scale(.95); }
.shell-btn.secondary { background: #2c3558; font-size: clamp(14px, 3.2vw, 17px); padding: 11px 28px; }
.shell-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#shell-sound { position: fixed; top: 12px; right: 12px; z-index: 850;
    width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff; font-size: 20px; }
#shell-back { position: fixed; top: 12px; left: 12px; z-index: 850;
    width: auto; height: 46px; border-radius: 23px; border: none; cursor: pointer;
    background: rgba(255,255,255,.12); color: #fff; font-size: 15px; font-weight: 700;
    padding: 0 18px; display: none; }
#shell-back.visible { display: block; }

/* Bölüm seçimi */
.shell-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 76px));
    gap: 12px; justify-content: center; max-width: 560px;
}
.shell-lv {
    width: 76px; height: 76px; border-radius: 16px; border: none; cursor: pointer;
    background: #2c3558; color: #fff; font: inherit; font-size: 22px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}
.shell-lv .lv-stars { font-size: 11px; letter-spacing: 1px; color: #ffd700; }
.shell-lv.locked { opacity: .38; cursor: default; }
.shell-lv.done { background: var(--theme); }

/* Bölüm-sonu yıldızları */
.shell-stars { display: flex; gap: 10px; }
.shell-stars svg { width: 54px; height: 54px; fill: #3a4368; }
.shell-stars svg.earned { fill: #ffd700; filter: drop-shadow(0 2px 10px rgba(255,215,0,.5)); }

/* Oyun kodu uyumluluğu: hub'ın body.game-active kilidi */
body.game-active { overflow: hidden; }
/* Hub'a-dön türü gizli uyumluluk düğmesi */
#btn-home { display: none; }

/* ── Oyun CSS ── */
/* ============================================
   Buz Kulesi — Icy Tower tarzı dikey platform zıplama
   Native portrait: 400 × 640 canvas
   ============================================ */

.bk-wrap {
  position: relative;
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  background: #001a40;
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    0 0 0 4px #0288D1,
    0 0 0 6px #003a6e,
    0 20px 40px rgba(0, 30, 80, 0.5);
  user-select: none;
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
}

.bk-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 400 / 640;
  overflow: hidden;
}

.bk-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: linear-gradient(180deg, #001a40 0%, #0a3a78 100%);
}

/* ---- HUD ---- */
.bk-hud {
  position: absolute;
  top: 8px;
  left: 8px;
  right: 8px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-family: 'Comic Sans MS', 'Baloo', system-ui, sans-serif;
  pointer-events: none;
  z-index: 4;
}

.bk-hud-box {
  background: rgba(0, 26, 64, 0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 2px solid #4FC3F7;
  border-radius: 10px;
  padding: 4px 10px;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 5px;
  box-shadow: 0 2px 8px rgba(0, 30, 80, 0.5);
  text-shadow: 1px 1px 0 rgba(0, 30, 80, 0.6);
}

.bk-hud-label {
  font-size: 10px;
  opacity: 0.85;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #a9e8ff;
}

.bk-hud-value {
  color: #ffffff;
  font-variant-numeric: tabular-nums;
}

.bk-hud-combo {
  background: rgba(20, 70, 130, 0.85);
  border-color: #FFD54F;
  color: #FFD54F;
  text-shadow: 0 0 6px rgba(255, 213, 79, 0.6);
  font-size: 16px;
  transition: transform 0.18s ease;
}
.bk-hud-combo.pulse {
  transform: scale(1.25);
}

/* ---- Big combo flash on land ---- */
.bk-combo-flash {
  position: absolute;
  top: 38%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.6);
  font-family: 'Comic Sans MS', 'Fredoka', system-ui, sans-serif;
  font-size: 44px;
  font-weight: 900;
  color: #FFD54F;
  text-shadow:
    0 0 14px rgba(255, 213, 79, 0.9),
    2px 2px 0 #0288D1;
  pointer-events: none;
  opacity: 0;
  z-index: 3;
}
.bk-combo-flash.show {
  animation: bkComboPop 0.65s ease-out forwards;
}
@keyframes bkComboPop {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4) rotate(-8deg); }
  35%  { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(3deg); }
  100% { opacity: 0; transform: translate(-50%, -70%) scale(1.1) rotate(0deg); }
}

/* ---- Mobile controls (alt bar) ---- */
.bk-controls {
  display: none;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: linear-gradient(180deg, #002650 0%, #001530 100%);
  border-top: 2px solid #0288D1;
}

.bk-ctrl-side {
  display: flex;
  align-items: center;
  gap: 10px;
}

.bk-btn {
  pointer-events: auto;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(0, 26, 64, 0.85);
  border: 2.5px solid #4FC3F7;
  color: #d6f0ff;
  font-size: 22px;
  font-weight: 900;
  cursor: pointer;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  box-shadow: 0 4px 12px rgba(0, 30, 80, 0.5), inset 0 0 12px rgba(79, 195, 247, 0.2);
  text-shadow: 0 0 6px rgba(79, 195, 247, 0.6);
  transition: transform 0.08s;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  flex-shrink: 0;
  padding: 0;
  line-height: 1;
}
.bk-btn:active {
  background: rgba(79, 195, 247, 0.35);
  transform: scale(0.92);
}

.bk-btn-jump {
  width: 72px;
  height: 72px;
  border-color: #FFD54F;
  color: #FFD54F;
  text-shadow: 0 0 8px rgba(255, 213, 79, 0.7);
  box-shadow: 0 4px 14px rgba(255, 213, 79, 0.45), inset 0 0 12px rgba(255, 213, 79, 0.2);
  font-size: 26px;
}
.bk-btn-jump:active { background: rgba(255, 213, 79, 0.35); }

@media (pointer: coarse), (hover: none), (max-width: 820px) {
  .bk-controls { display: flex; }
}

@media (max-width: 380px) {
  .bk-btn { width: 52px; height: 52px; font-size: 19px; }
  .bk-btn-jump { width: 64px; height: 64px; font-size: 22px; }
  .bk-controls { padding: 8px 10px; gap: 8px; }
  .bk-ctrl-side { gap: 8px; }
}

/* Mobil portrait: wrap dikey ekrana otursun (rotate yok, dikey native!) */
@media (orientation: portrait) and (max-width: 820px) {
  .bk-wrap {
    max-width: min(100vw, calc((100vh - 110px) * 400 / 640));
  }
}

/* Geniş ekran: yan yana hizalama */
@media (min-width: 900px) {
  .bk-wrap {
    max-height: calc(100vh - 100px);
    max-width: min(400px, calc((100vh - 100px) * 400 / 640));
  }
}

/* ---- Game Over Modal ---- */
.bk-modal {
  position: absolute;
  inset: 0;
  background: rgba(0, 10, 30, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: bkFadeIn 0.3s ease;
}
@keyframes bkFadeIn { from { opacity: 0; } to { opacity: 1; } }

.bk-modal-card {
  background: linear-gradient(160deg, #003a78 0%, #0d2a55 100%);
  border: 3px solid #4FC3F7;
  border-radius: 18px;
  padding: 22px 26px;
  max-width: 88%;
  min-width: 280px;
  color: #fff;
  font-family: 'Comic Sans MS', system-ui, sans-serif;
  box-shadow: 0 25px 80px rgba(0, 30, 80, 0.6);
  text-align: center;
}

.bk-modal-title {
  font-size: 26px;
  font-weight: 900;
  margin-bottom: 10px;
  color: #4FC3F7;
  text-shadow: 0 4px 14px rgba(79, 195, 247, 0.6);
}
.bk-modal-sub {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.82);
  margin-bottom: 14px;
}
.bk-modal-stats {
  background: rgba(0, 0, 0, 0.3);
  padding: 12px 14px;
  border-radius: 10px;
  margin-bottom: 16px;
  font-size: 15px;
  display: grid;
  gap: 6px;
}
.bk-stat-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.bk-stat-row b {
  color: #FFD54F;
  font-size: 17px;
  text-shadow: 0 0 6px rgba(255, 213, 79, 0.6);
  font-variant-numeric: tabular-nums;
}
.bk-stat-row.record b { color: #a9e8ff; }

.bk-modal-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bk-mbtn {
  padding: 11px 18px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: transform 0.12s;
}
.bk-mbtn:hover { transform: translateY(-2px); }
.bk-mbtn:active { transform: translateY(0); }
.bk-mbtn-primary {
  background: linear-gradient(135deg, #4FC3F7, #0288D1);
  color: #001a40;
  box-shadow: 0 5px 18px rgba(2, 136, 209, 0.5);
}
.bk-mbtn-secondary {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
}

/* ---- New record rozeti ---- */
.bk-new-record {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 8px;
  border-radius: 6px;
  background: linear-gradient(135deg, #FFD54F, #FF9800);
  color: #2a1010;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  vertical-align: middle;
  animation: bkRecordBlink 1.2s ease infinite;
}
@keyframes bkRecordBlink {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(0.95); }
}

</style>
</head>
<body class="game-active">

<canvas id="particles-canvas"></canvas>

<!-- Ana menü -->
<div id="shell-menu" class="shell-screen">
    <div class="shell-title">Buz Kulesi</div>
    <div class="shell-sub" id="shell-instructions"></div>
    <button class="shell-btn" id="shell-play"></button>
</div>

<!-- Bölüm seçimi (levels modunda) -->
<div id="shell-levels" class="shell-screen hidden">
    <div class="shell-title" style="font-size:clamp(24px,6vw,40px)" id="shell-levels-title"></div>
    <div class="shell-grid" id="shell-levels-grid"></div>
</div>

<!-- Oyun alanı -->
<div id="game-container">
    <div class="game-area" id="game-area"></div>
</div>

<!-- Bölüm sonu -->
<div id="level-complete" class="shell-screen overlay hidden">
    <div class="shell-title" style="font-size:clamp(26px,6vw,42px)" id="complete-title"></div>
    <div class="shell-stars" id="complete-stars"></div>
    <div class="shell-row">
        <button class="shell-btn secondary" id="btn-replay"></button>
        <button class="shell-btn" id="btn-next"></button>
        <button class="shell-btn secondary" id="btn-menu"></button>
    </div>
</div>

<button id="shell-sound">🔊</button>
<button id="shell-back"></button>
<button id="btn-home" aria-hidden="true"></button>

<script>
/* ── Çekirdek (SDK + Storage + i18n) ── */
/* ============================================
   FABRİKA ÇEKİRDEK — SDK soketleri + Storage + i18n
   Portal spesifikasyonu: EGITSEL-OYUN-FABRIKASI/CLAUDE.md
   Tarayıcı kalıcı deposu kullanılmaz; SDK_STORAGE → in-memory fallback.
   ============================================ */

const _mem = {};
const Storage = {
    get(k) {
        try {
            const v = window.SDK_STORAGE ? window.SDK_STORAGE.get(k) : undefined;
            return (v !== undefined && v !== null) ? v : (_mem[k] !== undefined ? _mem[k] : null);
        } catch (e) { return _mem[k] !== undefined ? _mem[k] : null; }
    },
    set(k, v) {
        try { if (window.SDK_STORAGE) window.SDK_STORAGE.set(k, v); } catch (e) {}
        _mem[k] = v;
    },
    clear() { for (const k in _mem) delete _mem[k]; },
};

/* Portal SDK soketleri — portal entegrasyonunda doldurulur, yokken sessiz no-op. */
const SDK = window.SDK || {
    gameLoadingStart() {},
    gameLoadingFinished() {},
    gameplayStart() {},
    gameplayStop() {},
    showRewardedAd(onSuccess) { try { onSuccess && onSuccess(); } catch (e) {} },
    happyMoment() {},
};
window.SDK = SDK;

/* i18n — öncelik: ?lang > <html data-lang> (build varsayılanı) > navigator.language */
const STRINGS = {"tr": {"game.instructions": "Ok tuşlarıyla hareket et, BOŞLUK ile zıpla. Duvarlardan sekerek yüksel; art arda platform atlayarak kombo yap, süper zıplama kazan!", "shell.play": "OYNA", "shell.levels": "BÖLÜMLER", "shell.replay": "↻ Tekrar", "shell.next": "Sonraki ▶", "shell.menu": "Ana Menü", "shell.perfect": "Mükemmel! 🌟", "shell.great": "Harika! 🎉", "shell.good": "Güzel! 👍", "bk.combo_flash": "x{c} KOMBO!", "bk.retry": "↻ Tekrar Dene", "bk.exit": "⌂ Ana Menü", "bk.fell": "❄️ Düştün! ❄️", "bk.fell_sub": "Bir sonraki zıplamada daha yüksek!", "bk.height": "Yükseklik", "bk.score": "Skor", "bk.max_combo": "En Yüksek Kombo", "bk.record": "Rekor", "bk.new_record": "YENİ REKOR"}, "en": {"game.instructions": "Move with the arrow keys, jump with SPACE. Wall-jump off the side walls; chain platform hops for combos and super jumps!", "shell.play": "PLAY", "shell.levels": "LEVELS", "shell.replay": "↻ Replay", "shell.next": "Next ▶", "shell.menu": "Main Menu", "shell.perfect": "Perfect! 🌟", "shell.great": "Great! 🎉", "shell.good": "Nice! 👍", "bk.combo_flash": "x{c} COMBO!", "bk.retry": "↻ Try Again", "bk.exit": "⌂ Main Menu", "bk.fell": "❄️ You Fell! ❄️", "bk.fell_sub": "Jump higher next time!", "bk.height": "Height", "bk.score": "Score", "bk.max_combo": "Best Combo", "bk.record": "Best Score", "bk.new_record": "NEW RECORD"}};
const LANG = (() => {
    try {
        const q = new URLSearchParams(location.search).get('lang');
        if (q && STRINGS[q]) return q;
    } catch (e) {}
    const d = document.documentElement.dataset.lang;
    if (d && STRINGS[d]) return d;
    return (navigator.language || 'en').toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
})();
function T(key, vars) {
    let s = (STRINGS[LANG] && STRINGS[LANG][key] !== undefined) ? STRINGS[LANG][key]
        : (STRINGS.tr && STRINGS.tr[key] !== undefined) ? STRINGS.tr[key] : key;
    if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]);
    return s;
}


/* ── Hub kütüphaneleri (audio, particles, mobile-utils) ── */
/* ============================================
   OYUN BAHÇESİ - Ses Yöneticisi
   ============================================ */

const AudioManager = (() => {
    let ctx = null;
    let enabled = true;
    let initialized = false;
    const buffers = {};

    // Basit ses efektleri üretici (Web Audio API ile)
    const tones = {
        tap: { freq: 600, duration: 0.08, type: 'sine', gain: 0.15 },
        success: { freq: 880, duration: 0.25, type: 'sine', gain: 0.2, seq: [523, 659, 784] },
        error: { freq: 200, duration: 0.2, type: 'triangle', gain: 0.12 },
        star: { freq: 1200, duration: 0.4, type: 'sine', gain: 0.15, seq: [784, 988, 1175] },
        complete: { freq: 523, duration: 0.6, type: 'sine', gain: 0.2, seq: [523, 659, 784, 1047] },
        pop: { freq: 400, duration: 0.1, type: 'sine', gain: 0.12 },
        whoosh: { freq: 300, duration: 0.15, type: 'sawtooth', gain: 0.06 },
        flip: { freq: 500, duration: 0.12, type: 'sine', gain: 0.1 },
    };

    function init() {
        if (initialized) return;
        try {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            initialized = true;
        } catch (e) {
            console.warn('Web Audio API desteklenmiyor');
        }
    }

    function playTone(name) {
        if (!enabled || !ctx) return;
        if (ctx.state === 'suspended') ctx.resume();

        const tone = tones[name];
        if (!tone) return;

        if (tone.seq) {
            // Sıralı notalar
            tone.seq.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = tone.type;
                osc.frequency.value = freq;
                gain.gain.value = tone.gain;
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (i + 1) * 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + i * 0.12);
                osc.stop(ctx.currentTime + (i + 1) * 0.15 + 0.05);
            });
        } else {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = tone.type;
            osc.frequency.value = tone.freq;
            gain.gain.value = tone.gain;
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + tone.duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + tone.duration + 0.05);
        }
    }

    function play(name) {
        if (!enabled) return;
        init();
        playTone(name);
    }

    function toggle() {
        enabled = !enabled;
        return enabled;
    }

    function isEnabled() {
        return enabled;
    }

    function setEnabled(val) {
        enabled = val;
    }

    return { init, play, toggle, isEnabled, setEnabled };
})();


/* ============================================
   OYUN BAHÇESİ - Parçacık Efektleri
   ============================================ */

const Particles = (() => {
    let canvas, ctx;
    let particles = [];
    let animId = null;

    const COLORS = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#F7B731', '#A55EEA', '#FF78C4', '#26DE81', '#FFD700'];

    function init() {
        canvas = document.getElementById('particles-canvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        resize();
        window.addEventListener('resize', resize);
    }

    function resize() {
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function animate() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles = particles.filter(p => p.life > 0);

        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.life -= p.decay;
            p.rotation += p.rotSpeed;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.globalAlpha = Math.max(0, p.life);

            if (p.type === 'confetti') {
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            } else if (p.type === 'star') {
                drawStar(ctx, 0, 0, 5, p.size, p.size / 2, p.color);
            } else if (p.type === 'sparkle') {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        });

        if (particles.length > 0) {
            animId = requestAnimationFrame(animate);
        } else {
            animId = null;
        }
    }

    function drawStar(ctx, cx, cy, spikes, outerR, innerR, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let rot = Math.PI / 2 * 3;
        let step = Math.PI / spikes;
        ctx.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
            ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
            rot += step;
            ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
            rot += step;
        }
        ctx.closePath();
        ctx.fill();
    }

    function spawn(type, x, y, count) {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
            const speed = 2 + Math.random() * 6;

            particles.push({
                type,
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3,
                gravity: type === 'sparkle' ? 0 : 0.12,
                life: 1,
                decay: 0.012 + Math.random() * 0.01,
                size: type === 'confetti' ? 8 + Math.random() * 6 : 4 + Math.random() * 4,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.15,
            });
        }

        if (!animId) {
            animId = requestAnimationFrame(animate);
        }
    }

    function confetti(x, y, count = 50) {
        if (!ctx) init();
        spawn('confetti', x || canvas.width / 2, y || canvas.height / 3, count);
    }

    function stars(x, y, count = 15) {
        if (!ctx) init();
        spawn('star', x || canvas.width / 2, y || canvas.height / 3, count);
    }

    function sparkle(x, y, count = 10) {
        if (!ctx) init();
        spawn('sparkle', x, y, count);
    }

    function celebrate() {
        if (!ctx) init();
        const cx = canvas.width / 2;
        const cy = canvas.height / 3;
        confetti(cx, cy, 60);
        setTimeout(() => stars(cx, cy, 20), 200);
        setTimeout(() => confetti(cx - 100, cy, 30), 300);
        setTimeout(() => confetti(cx + 100, cy, 30), 400);
    }

    return { init, confetti, stars, sparkle, celebrate };
})();


/* ============================================
   Mobile Utils — Canvas DPR + Touch Yardımcıları
   ============================================ */

const MobileUtils = (() => {
  const MAX_DPR = 2;

  function getDPR() {
    return Math.min(window.devicePixelRatio || 1, MAX_DPR);
  }

  function isTouchDevice() {
    if ('ontouchstart' in window) return true;
    if (navigator.maxTouchPoints && navigator.maxTouchPoints > 0) return true;
    if (navigator.msMaxTouchPoints && navigator.msMaxTouchPoints > 0) return true;
    if (window.matchMedia) {
      if (window.matchMedia('(pointer: coarse)').matches) return true;
      if (window.matchMedia('(hover: none)').matches) return true;
      if (window.matchMedia('(any-pointer: coarse)').matches) return true;
    }
    return false;
  }

  function setupHiDPICanvas(canvas, ctx, logicalW, logicalH, opts) {
    const options = opts || {};
    const dpr = options.forceIntegerDpr
      ? Math.max(1, Math.floor(getDPR()))
      : getDPR();
    canvas.width = Math.round(logicalW * dpr);
    canvas.height = Math.round(logicalH * dpr);
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return dpr;
  }

  // Canvas'ı GÖRÜNTÜLENEN boyutuna (CSS px × DPR) göre boyutlandırır ve çizim
  // koordinatlarını mantıksal (logicalW×logicalH) sisteme ölçekler. Oyun büyüdükçe
  // (örn. tam ekran) iç çözünürlük de büyür → bulanıklaşma olmaz. ResizeObserver ile
  // boyut değişiminde otomatik yeniden ayarlanır. Oyun her karede mantıksal
  // koordinatlarda çizmeye devam eder.
  function attachResponsiveCanvas(canvas, ctx, logicalW, logicalH) {
    canvas.style.width = '100%';
    canvas.style.height = '100%';
    const fit = () => {
      const dpr = getDPR();
      const w = canvas.clientWidth || logicalW;
      const h = canvas.clientHeight || logicalH;
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
      // Mantıksal koordinat sistemini iç çözünürlüğe ölçekle (en-boy oranı
      // korunduğunda x/y aynı faktör → bozulma olmaz).
      ctx.setTransform(canvas.width / logicalW, 0, 0, canvas.height / logicalH, 0, 0);
    };
    fit();
    let ro = null;
    if (typeof ResizeObserver !== 'undefined') {
      ro = new ResizeObserver(fit);
      ro.observe(canvas);
    }
    // ResizeObserver bazı durumlarda (ör. tam ekran geçişi) tetiklenmeyebildiği için
    // window resize olayını da dinle — tam ekran butonu bu olayı tetikler.
    window.addEventListener('resize', fit);
    return {
      refit: fit,
      disconnect() { if (ro) ro.disconnect(); window.removeEventListener('resize', fit); }
    };
  }

  function lockBodyScroll() {
    document.body.classList.add('game-active');
  }

  function unlockBodyScroll() {
    document.body.classList.remove('game-active');
  }

  function unlockAudio() {
    try {
      if (typeof AudioManager === 'undefined' || !AudioManager) return;
      if (typeof AudioManager.unlock === 'function') AudioManager.unlock();
      const ctx = AudioManager.context || AudioManager.audioContext || null;
      if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
        ctx.resume();
      }
    } catch (e) {}
  }

  let audioUnlockAttached = false;
  function attachGlobalAudioUnlock() {
    if (audioUnlockAttached) return;
    audioUnlockAttached = true;
    const once = () => {
      unlockAudio();
      document.removeEventListener('touchstart', once, true);
      document.removeEventListener('mousedown', once, true);
      document.removeEventListener('keydown', once, true);
    };
    document.addEventListener('touchstart', once, true);
    document.addEventListener('mousedown', once, true);
    document.addEventListener('keydown', once, true);
  }

  function bindHoldButton(el, onPress, onRelease) {
    if (!el) return;
    el.style.touchAction = 'none';
    let activeTouchId = null;
    const press = () => { if (onPress) onPress(); };
    const release = () => { if (onRelease) onRelease(); };

    el.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (activeTouchId === null && e.changedTouches && e.changedTouches[0]) {
        activeTouchId = e.changedTouches[0].identifier;
      }
      press();
    }, { passive: false });

    const touchEndLike = (e) => {
      if (activeTouchId === null) return;
      if (e.changedTouches) {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeTouchId) {
            activeTouchId = null;
            release();
            return;
          }
        }
      } else {
        activeTouchId = null;
        release();
      }
    };

    el.addEventListener('touchend', (e) => { e.preventDefault(); touchEndLike(e); }, { passive: false });
    el.addEventListener('touchcancel', (e) => { touchEndLike(e); });

    el.addEventListener('mousedown', (e) => { e.preventDefault(); press(); });
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);

    document.addEventListener('mouseup', release);
  }

  return {
    getDPR,
    isTouchDevice,
    setupHiDPICanvas,
    attachResponsiveCanvas,
    lockBodyScroll,
    unlockBodyScroll,
    attachGlobalAudioUnlock,
    unlockAudio,
    bindHoldButton,
  };
})();

const SHELL = {"id": "buz-kulesi", "mode": "endless", "levelCount": 1};

/* ── Mini-engine: hub GameEngine sözleşmesinin standalone karşılığı ── */
const GameEngine = (() => {
    let currentLevel = 1;
    let state = 'IDLE';
    let score = { correct: 0, wrong: 0, total: 0 };

    function levelStarsKey(lv) { return SHELL.id + '.stars.' + lv; }
    function getLevelStars(lv) { return parseInt(Storage.get(levelStarsKey(lv)) || '0', 10) || 0; }
    function setLevelStars(lv, s) {
        if (s > getLevelStars(lv)) Storage.set(levelStarsKey(lv), String(s));
    }

    function startGame(level) {
        currentLevel = level || 1;
        state = 'PLAYING';
        score = { correct: 0, wrong: 0, total: 0 };
        const gameArea = document.getElementById('game-area');
        while (gameArea.firstChild) gameArea.removeChild(gameArea.firstChild);
        Shell.showGame();
        SDK.gameplayStart();
        GAME.init(gameArea, currentLevel, { onCorrect, onWrong, onComplete });
    }

    function onCorrect() { score.correct++; AudioManager.play('success'); }
    function onWrong() { score.wrong++; AudioManager.play('error'); }

    function calculateStars() {
        if (score.total === 0) return 3;
        const acc = score.correct / score.total;
        if (acc >= 0.95) return 3;
        if (acc >= 0.7) return 2;
        return 1;
    }

    function onComplete(customStars) {
        if (state !== 'PLAYING') return;
        state = 'COMPLETED';
        SDK.gameplayStop();
        const stars = customStars !== undefined ? customStars : calculateStars();
        setLevelStars(currentLevel, stars);
        if (stars >= 3) SDK.happyMoment();
        setTimeout(() => {
            AudioManager.play('complete');
            Particles.celebrate();
            showLevelComplete(stars);
        }, 400);
    }

    function showLevelComplete(stars) {
        const titleEl = document.getElementById('complete-title');
        titleEl.textContent = stars === 3 ? T('shell.perfect') : stars === 2 ? T('shell.great') : T('shell.good');
        const starsEl = document.getElementById('complete-stars');
        while (starsEl.firstChild) starsEl.removeChild(starsEl.firstChild);
        for (let i = 0; i < 3; i++) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            if (i < stars) svg.classList.add('earned');
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z');
            svg.appendChild(path);
            starsEl.appendChild(svg);
        }
        document.getElementById('btn-next').classList.toggle('hidden', currentLevel >= SHELL.levelCount);
        document.getElementById('level-complete').classList.remove('hidden');
    }

    function hideLevelComplete() { document.getElementById('level-complete').classList.add('hidden'); }
    function replay() { destroyGame(); hideLevelComplete(); startGame(currentLevel); }
    function nextLevel() { destroyGame(); hideLevelComplete(); if (currentLevel < SHELL.levelCount) startGame(currentLevel + 1); }
    function destroyGame() { try { if (GAME.destroy) GAME.destroy(); } catch (e) {} state = 'IDLE'; }

    function setTotal(n) { score.total = n; }
    function getCurrentLevel() { return currentLevel; }

    return { startGame, replay, nextLevel, hideLevelComplete, setTotal, getCurrentLevel, getLevelStars, destroyGame, calculateStars };
})();

        levelsEl().classList.add('hidden');
        gameEl().classList.add('active');
        backEl().classList.add('visible');
    }

    function renderLevelGrid() {
        const grid = document.getElementById('shell-levels-grid');
        while (grid.firstChild) grid.removeChild(grid.firstChild);
        let maxUnlocked = 1;
        for (let i = 1; i <= SHELL.levelCount; i++) {
            if (GameEngine.getLevelStars(i) > 0) maxUnlocked = Math.max(maxUnlocked, i + 1);
        }
        for (let i = 1; i <= SHELL.levelCount; i++) {
            const stars = GameEngine.getLevelStars(i);
            const locked = i > maxUnlocked;
            const btn = document.createElement('button');
            btn.className = 'shell-lv' + (stars > 0 ? ' done' : '') + (locked ? ' locked' : '');
            const num = document.createElement('span');
            num.textContent = i;
            const starsSpan = document.createElement('span');
            starsSpan.className = 'lv-stars';
            starsSpan.textContent = stars > 0 ? '★'.repeat(stars) : (locked ? '🔒' : '');
            btn.appendChild(num);
            btn.appendChild(starsSpan);
            if (!locked) {
                btn.addEventListener('click', () => { AudioManager.play('tap'); GameEngine.startGame(i); });
            }
            grid.appendChild(btn);
        }
    }

    function boot() {
        document.getElementById('shell-instructions').textContent = T('game.instructions');
        document.getElementById('shell-play').textContent = T('shell.play');
        document.getElementById('shell-levels-title').textContent = T('shell.levels');
        document.getElementById('btn-replay').textContent = T('shell.replay');
        document.getElementById('btn-next').textContent = T('shell.next');
        document.getElementById('btn-menu').textContent = T('shell.menu');
        document.getElementById('shell-back').textContent = '← ' + T('shell.menu');

        document.getElementById('shell-play').addEventListener('click', () => {
            AudioManager.play('tap');
            if (SHELL.mode === 'levels') showLevels();
            else GameEngine.startGame(1);
        });
        document.getElementById('btn-replay').addEventListener('click', () => GameEngine.replay());
        document.getElementById('btn-next').addEventListener('click', () => GameEngine.nextLevel());
        document.getElementById('btn-menu').addEventListener('click', () => {
            if (SHELL.mode === 'levels') showLevels(); else showMenu();
        });
        document.getElementById('shell-back').addEventListener('click', () => showMenu());
        document.getElementById('btn-home').addEventListener('click', () => showMenu());
        document.getElementById('shell-sound').addEventListener('click', (e) => {
            const on = AudioManager.toggle();
            e.currentTarget.textContent = on ? '🔊' : '🔇';
        });

        MobileUtils.attachGlobalAudioUnlock();
        Particles.init();
        SDK.gameLoadingFinished();
    }

    return { showMenu, showLevels, showGame, boot };
})();

                if (key === 'class') el.className = props[key];
                else if (key === 'style' && typeof props[key] === 'object') Object.assign(el.style, props[key]);
                else if (key === 'text') el.textContent = props[key];
                else if (key.startsWith('on') && typeof props[key] === 'function') {
                    el.addEventListener(key.substring(2).toLowerCase(), props[key]);
                }
                else if (props[key] !== null && props[key] !== undefined && props[key] !== false) {
                    el.setAttribute(key, props[key]);
                }
            }
        }
        for (const c of children) {
            if (c === null || c === undefined || c === false) continue;
            if (Array.isArray(c)) c.forEach(cc => cc && el.appendChild(cc));
            else if (typeof c === 'string' || typeof c === 'number') el.appendChild(document.createTextNode(String(c)));

        // HUD
        hudHeightEl = h('span', { class: 'bk-hud-value', text: '0m' });
        const hudHeightBox = h('div', { class: 'bk-hud-box' },
            h('span', { class: 'bk-hud-label', text: '🏔' }),
            hudHeightEl
        );

        hudComboValEl = h('span', { class: 'bk-hud-value', text: 'x1' });
        hudComboEl = h('div', { class: 'bk-hud-box bk-hud-combo', style: { display: 'none' } },
            h('span', { text: '🔥' }),
            hudComboValEl
        );

        hud = h('div', { class: 'bk-hud' }, hudHeightBox, hudComboEl);

        comboFlashEl = h('div', { class: 'bk-combo-flash' });

        const frame = h('div', { class: 'bk-frame' }, canvas, hud, comboFlashEl);

        // Mobil kontrolleri
        const makeBtn = (cls, txt, key) => {
            const b = h('button', { class: 'bk-btn ' + cls, type: 'button', text: txt });
            if (typeof MobileUtils !== 'undefined' && MobileUtils.bindHoldButton) {
                MobileUtils.bindHoldButton(b, () => { keys[key] = true; }, () => { keys[key] = false; });
            } else {
                b.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; }, { passive: false });
                b.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; }, { passive: false });
                b.addEventListener('touchcancel', () => { keys[key] = false; });
                b.addEventListener('mousedown', () => { keys[key] = true; });
                b.addEventListener('mouseup', () => { keys[key] = false; });
                b.addEventListener('mouseleave', () => { keys[key] = false; });
            }
            return b;
        };
        const btnL = makeBtn('bk-btn-left', '◀', 'ArrowLeft');
        const btnR = makeBtn('bk-btn-right', '▶', 'ArrowRight');
        const btnJ = makeBtn('bk-btn-jump', '▲', ' ');

        const controls = h('div', { class: 'bk-controls' },
            h('div', { class: 'bk-ctrl-side' }, btnL, btnR),
            h('div', { class: 'bk-ctrl-side' }, btnJ)
        );

        wrap = h('div', { class: 'bk-wrap' }, frame, controls);
        container.appendChild(wrap);
    }

    // ---- Input ----
    function onKeyDown(e) {
        const k = normalizeKey(e.key);
        if (k === 'ArrowLeft' || k === 'ArrowRight' || k === ' ') {
            e.preventDefault();
            keys[k] = true;
        }
    }
    function onKeyUp(e) {
        const k = normalizeKey(e.key);
        if (keys[k] !== undefined) keys[k] = false;
    }
    function normalizeKey(k) {
        if (k === 'a' || k === 'A') return 'ArrowLeft';
        if (k === 'd' || k === 'D') return 'ArrowRight';
        if (k === 'w' || k === 'W' || k === 'ArrowUp') return ' ';
        return k;
    }

    // ---- Platform spawn ----
    // FİZİK SINIRI: peak jump height = JUMP_VELOCITY²/(2·GRAVITY) = 600²/3400 ≈ 106 px
    // İmkansız atlayışın olmaması için aralığı 85'le sınırlıyoruz (~21 px güvenlik marjı).
    // Yatay erişim (MAX_VX × kalış süresi): kid-friendly için 90 px güvenli sınır.
    const MAX_PLATFORM_GAP = 85;
    const MAX_HORIZ_REACH = 90;

    function spawnNextPlatform() {
        const lastPlat = platforms[platforms.length - 1];
        const lvl = idxCount;
        // Aralık: 65'ten başla, her 8 platformda +3 → max 85 (fizikçe garanti ulaşılır)
        const gap = Math.min(MAX_PLATFORM_GAP, 65 + Math.floor(lvl / 8) * 3);
        // Genişlik: 130'dan başla, her 10 platformda -5 → min 55
        const minW = Math.max(55, 130 - Math.floor(lvl / 10) * 5);
        const w = minW + Math.random() * 26;

        // Yatay konum: önceki platforma göre MAX_HORIZ_REACH içinde olmalı
        // (en kötü ihtimalle bile yan kenardan kenara zıplanabilsin)
        const prevX = lastPlat.x;
        const prevW = lastPlat.w;
        const minX = Math.max(0, prevX - w - MAX_HORIZ_REACH);
        const maxX = Math.min(GAME_W - w, prevX + prevW + MAX_HORIZ_REACH);
        const x = (maxX > minX)
            ? minX + Math.random() * (maxX - minX)
            : Math.max(0, Math.min(GAME_W - w, prevX));

        idxCount++;
        platforms.push({ x, y: lastPlat.y - gap, w, h: 12, index: idxCount });
    }

    // ---- Loop ----
    function gameLoop() {
        if (gameOver && gameOverShown) return;
        const now = performance.now();
        accum += Math.min(0.08, (now - lastTime) / 1000);
        lastTime = now;

        while (accum >= STEP) {
            accum -= STEP;
            if (!gameOver) fixedUpdate(STEP);
        }
        draw();
        animFrameId = requestAnimationFrame(gameLoop);
    }

    // ---- Fizik ----
    function fixedUpdate(dt) {
        const p = player;

        const jumpKey = keys[' '];
        const jumpPressedNow = jumpKey && !p.jumpHeld;
        p.jumpHeld = jumpKey;
        if (jumpPressedNow) p.jumpBuffer = JUMP_BUFFER;
        else p.jumpBuffer = Math.max(0, p.jumpBuffer - dt);

        wallJumpLockTimer = Math.max(0, wallJumpLockTimer - dt);
        let ax = 0;
        const accel = p.onGround ? ACCEL_GROUND : ACCEL_AIR;
        const fric = p.onGround ? FRIC_GROUND : FRIC_AIR;
        if (wallJumpLockTimer <= 0) {
            if (keys['ArrowLeft']) { ax = -accel; p.dir = -1; }
            else if (keys['ArrowRight']) { ax = accel; p.dir = 1; }
            else {
                if (p.dx > 0) p.dx = Math.max(0, p.dx - fric * dt);
                else if (p.dx < 0) p.dx = Math.min(0, p.dx + fric * dt);
            }
        }
        p.dx += ax * dt;
        p.dx = Math.max(-MAX_VX, Math.min(MAX_VX, p.dx));

        p.dy += GRAVITY * dt;

        const touchingLeftWall = (p.x <= 0);
        const touchingRightWall = (p.x + p.w >= GAME_W);
        if ((touchingLeftWall || touchingRightWall) && p.dy > 0 && !p.onGround) {
            p.wallSide = touchingLeftWall ? -1 : 1;
            p.dy = Math.min(p.dy, WALL_SLIDE_VY_MAX);
        } else {
            p.wallSide = 0;
        }

        if (p.jumpBuffer > 0) {
            if (p.onGround || p.coyote > 0) {
                const boost = 1 + Math.min(combo * COMBO_JUMP_BOOST, COMBO_JUMP_MAX);
                p.dy = -JUMP_VELOCITY * boost;
                p.onGround = false;
                p.coyote = 0;
                p.jumpBuffer = 0;
                try { AudioManager.play('pop'); } catch (e) {}
            } else if (p.wallSide !== 0) {
                p.dx = -p.wallSide * WALL_JUMP_VX;
                p.dy = -WALL_JUMP_VY;
                p.dir = -p.wallSide;
                p.jumpBuffer = 0;
                p.wallSide = 0;
                wallJumpLockTimer = WALL_JUMP_LOCK;
                try { AudioManager.play('pop'); } catch (e) {}
            }
        }

        p.dy = Math.min(p.dy, MAX_VY_FALL);

        p.x += p.dx * dt;
        if (p.x < 0) { p.x = 0; if (p.dx < 0) p.dx = 0; }
        if (p.x + p.w > GAME_W) { p.x = GAME_W - p.w; if (p.dx > 0) p.dx = 0; }

        const prevY = p.y;
        p.y += p.dy * dt;

        if (p.onGround) p.coyote = COYOTE_TIME;
        p.onGround = false;

        if (p.dy > 0) {
            for (const pl of platforms) {
                const overlapX = (p.x + p.w > pl.x) && (p.x < pl.x + pl.w);
                if (!overlapX) continue;
                const prevBottom = prevY + p.h;
                const curBottom = p.y + p.h;
                if (prevBottom <= pl.y && curBottom >= pl.y) {
                    p.y = pl.y - p.h;
                    p.dy = 0;
                    p.onGround = true;
                    p.coyote = COYOTE_TIME;
                    onLand(pl);
                    break;
                }
            }
        }

        if (!p.onGround) p.coyote = Math.max(0, p.coyote - dt);

        // Kamera takibi: hedef = oyuncuyu üst %X'te tut. Anlık snap yerine yumuşak yetişme.
        const cameraTargetY = p.y - SCROLL_TRIGGER_RATIO * GAME_H;
        if (cameraTargetY < cameraY) {
            const maxDelta = SCROLL_CATCHUP_RATE * dt;
            cameraY = Math.max(cameraTargetY, cameraY - maxDelta);
        }
        // Auto-scroll: baştan sabit kayma + platform sayısıyla kademeli ivme (tavanlı)
        const forceSpeed = Math.min(SCROLL_MAX, SCROLL_BASE + idxCount * SCROLL_RAMP_PER_PLATFORM);
        cameraY -= forceSpeed * dt;

        // Yukarıda yeterli platform var mı? (her döngüde güncel topPlat'i oku — sonsuz döngü kapısı kapanır)
        let spawnSafety = 0;
        while (platforms[platforms.length - 1].y > cameraY - 200 && spawnSafety < 20) {
            spawnNextPlatform();
            spawnSafety++;
        }

        const screenBottomWorldY = cameraY + GAME_H + 60;
        for (let i = platforms.length - 1; i >= 0; i--) {
            if (platforms[i].y > screenBottomWorldY) platforms.splice(i, 1);
        }

        const screenY = p.y - cameraY;
        if (screenY > GAME_H + 40) triggerGameOver();

        if (p.y < bestPlayerY) bestPlayerY = p.y;
        const newHeightM = Math.max(0, Math.floor((startPlayerY - bestPlayerY) / 16));
        if (newHeightM !== heightM) {
            heightM = newHeightM;
            if (hudHeightEl) hudHeightEl.textContent = heightM + 'm';
        }

        if (combo > 1) {
            const t = performance.now() / 1000;
            if (t - lastLandTime > COMBO_WINDOW * 1.7) {
                combo = 1;
                updateComboHUD();
            }
        }

        for (const sf of snowflakes) {
            const parallax = 0.4 + sf.depth * 0.8;
            sf.y += sf.vy * dt * parallax;
            sf.x += sf.vx * dt * parallax;
            sf.vx += (Math.random() - 0.5) * 6 * dt;
            sf.vx = Math.max(-30, Math.min(30, sf.vx));
            if (sf.y > GAME_H + 4) { sf.y = -4; sf.x = Math.random() * GAME_W; }
            if (sf.x < -6) sf.x = GAME_W + 4;
            if (sf.x > GAME_W + 6) sf.x = -4;
        }

        if (combo >= 3 && !p.onGround && p.dy < -100) {
            if (Math.random() < 0.6) {
                trailParticles.push({
                    x: p.x + p.w / 2 + (Math.random() - 0.5) * 14,
                    y: p.y + p.h,
                    life: 0.45,
                    age: 0,
                    size: 3 + Math.random() * 3,
                });
            }
        }
        for (let i = trailParticles.length - 1; i >= 0; i--) {
            const tp = trailParticles[i];
            tp.age += dt;
            if (tp.age >= tp.life) trailParticles.splice(i, 1);
        }
    }

    function onLand(platform) {
        if (platform.isGround) return;
        const t = performance.now() / 1000;
        if (platform.index > lastLandedIdx && (t - lastLandTime) < COMBO_WINDOW) {
            combo++;
            const jumped = platform.index - lastLandedIdx;
            score += 10 * jumped * combo;
            if (combo > maxCombo) maxCombo = combo;
            if (combo >= 3) showComboFlash(combo);
        } else if (platform.index > lastLandedIdx) {
            combo = 1;
            score += 10;
        } else {
            combo = 1;
        }
        lastLandedIdx = platform.index;
        lastLandTime = t;
        updateComboHUD();
    }

    function updateComboHUD() {
        if (!hudComboEl) return;
        if (combo > 1) {
            hudComboEl.style.display = '';
            if (hudComboValEl) hudComboValEl.textContent = 'x' + combo;
            hudComboEl.classList.add('pulse');
            setTimeout(() => hudComboEl && hudComboEl.classList.remove('pulse'), 180);
        } else {
            hudComboEl.style.display = 'none';
        }
    }

    function showComboFlash(c) {
        if (!comboFlashEl) return;
        comboFlashEl.textContent = T('bk.combo_flash', { c: c });
        comboFlashEl.classList.remove('show');
        void comboFlashEl.offsetWidth;
        comboFlashEl.classList.add('show');
    }

    // ---- Game Over ----
    function triggerGameOver() {
        if (gameOver) return;
        gameOver = true;
        SDK.gameplayStop();
        let isNewRecord = false;
        if (score > highScore) {
            highScore = score;
            isNewRecord = true;
            SDK.happyMoment();
            try { Storage.set('bk-highscore', String(highScore)); } catch (e) {}
        }
        try { AudioManager.play('wrong'); } catch (e) {}
        showGameOverModal(isNewRecord);
        gameOverShown = true;
    }

    function showGameOverModal(isNewRecord) {
        if (!wrap) return;
        if (modalEl) modalEl.remove();

        const retryBtn = h('button', {
            class: 'bk-mbtn bk-mbtn-primary', type: 'button', text: T('bk.retry'),
            onClick: () => {
                if (modalEl) { modalEl.remove(); modalEl = null; }
                if (animFrameId) { cancelAnimationFrame(animFrameId); animFrameId = null; }
                if (onKeyDownRef) document.removeEventListener('keydown', onKeyDownRef);
                if (onKeyUpRef) document.removeEventListener('keyup', onKeyUpRef);
                onKeyDownRef = null; onKeyUpRef = null;
                startRun();
            }
        });
        const exitBtn = h('button', {
            class: 'bk-mbtn bk-mbtn-secondary', type: 'button', text: T('bk.exit'),
            onClick: () => { if (typeof App !== 'undefined' && App.showHub) App.showHub(); }
        });

        const scoreCell = h('b', { text: String(score) });
        if (isNewRecord) {
            scoreCell.appendChild(h('span', { class: 'bk-new-record', text: T('bk.new_record') }));
        }

        const stats = h('div', { class: 'bk-modal-stats' },
            h('div', { class: 'bk-stat-row' },
                h('span', { text: T('bk.height') }),
                h('b', { text: heightM + 'm' })
            ),
            h('div', { class: 'bk-stat-row' },
                h('span', { text: T('bk.score') }),
                scoreCell
            ),
            h('div', { class: 'bk-stat-row' },
                h('span', { text: T('bk.max_combo') }),
                h('b', { text: 'x' + maxCombo })
            ),
            h('div', { class: 'bk-stat-row record' },
                h('span', { text: T('bk.record') }),
                h('b', { text: String(highScore) })
            )
        );

        const card = h('div', { class: 'bk-modal-card' },
            h('div', { class: 'bk-modal-title', text: T('bk.fell') }),
            h('div', { class: 'bk-modal-sub', text: T('bk.fell_sub') }),
            stats,
            h('div', { class: 'bk-modal-buttons' }, retryBtn, exitBtn)
        );

        modalEl = h('div', { class: 'bk-modal' }, card);
        const frameEl = wrap.querySelector('.bk-frame');
        if (frameEl) frameEl.appendChild(modalEl);
    }

    // ---- Render ----
    function draw() {
        if (!ctx) return;
        const g = ctx.createLinearGradient(0, 0, 0, GAME_H);
        g.addColorStop(0, COL.skyTop);
        g.addColorStop(1, COL.skyBot);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, GAME_W, GAME_H);

        drawStars();

        ctx.save();
        for (const sf of snowflakes) {
            if (sf.depth < 0.5) {
                ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + sf.depth * 0.4) + ')';
                ctx.beginPath();
                ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.restore();

        ctx.fillStyle = COL.wall;
        ctx.fillRect(0, 0, 4, GAME_H);
        ctx.fillRect(GAME_W - 4, 0, 4, GAME_H);
        ctx.fillStyle = COL.wallEdge;
        ctx.fillRect(4, 0, 1, GAME_H);
        ctx.fillRect(GAME_W - 5, 0, 1, GAME_H);

        for (const pl of platforms) {
            const sy = pl.y - cameraY;
            if (sy < -20 || sy > GAME_H + 20) continue;
            if (pl.isGround) drawGroundPlatform(pl.x, sy, pl.w, pl.h);
            else drawPlatform(pl.x, sy, pl.w, pl.h);
        }

        for (const tp of trailParticles) {
            const sy = tp.y - cameraY;
            const t = 1 - (tp.age / tp.life);
            ctx.fillStyle = 'rgba(214,240,255,' + (t * 0.7) + ')';
            ctx.beginPath();
            ctx.arc(tp.x, sy, tp.size * (0.5 + t * 0.7), 0, Math.PI * 2);
            ctx.fill();
        }

        drawPlayer();

        for (const sf of snowflakes) {
            if (sf.depth >= 0.5) {
                ctx.fillStyle = 'rgba(255,255,255,' + (0.55 + sf.depth * 0.35) + ')';
                ctx.beginPath();
                ctx.arc(sf.x, sf.y, sf.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawStars() {
        const seed = Math.floor(cameraY / 200);
        ctx.save();
        for (let i = 0; i < 22; i++) {
            const sx = ((i * 73 + seed * 31) % GAME_W);
            const sy = ((i * 113 + seed * 47) % GAME_H);
            const opa = 0.3 + ((i * 17) % 7) / 10;
            ctx.fillStyle = 'rgba(231,243,255,' + opa.toFixed(2) + ')';
            ctx.fillRect(sx, sy, 1.4, 1.4);
        }
        ctx.restore();
    }

    function drawPlatform(x, y, w, h) {
        ctx.fillStyle = COL.platMid;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = COL.platTop;
        ctx.fillRect(x, y, w, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x, y, w, 1);
        ctx.fillStyle = COL.platEdge;
        ctx.fillRect(x, y + h - 2, w, 2);
        ctx.fillStyle = '#a9e8ff';
        ctx.fillRect(x + 3, y + 4, 2, 5);
        ctx.fillRect(x + w - 5, y + 4, 2, 5);
    }

    function drawGroundPlatform(x, y, w, h) {
        const gg = ctx.createLinearGradient(0, y, 0, y + h);
        gg.addColorStop(0, '#ffffff');
        gg.addColorStop(0.4, '#d6f0ff');
        gg.addColorStop(1, '#4FC3F7');
        ctx.fillStyle = gg;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 8; i++) {
            const bx = x + (w / 8) * i + 4;
            ctx.beginPath();
            ctx.arc(bx, y + 1, 4, Math.PI, 0);
            ctx.fill();
        }
        ctx.fillStyle = '#0288D1';
        ctx.fillRect(x, y + h - 3, w, 3);
    }

    function drawPlayer() {
        const p = player;
        const sy = p.y - cameraY;
        if (sy < -p.h - 20 || sy > GAME_H + 40) return;

        const cx = p.x + p.w / 2;
        const top = sy;

        ctx.fillStyle = COL.scarfShade;
        ctx.fillRect(p.x + 4, top + p.h * 0.6, p.w - 8, 6);
        ctx.fillStyle = COL.scarf;
        ctx.fillRect(p.x + 3, top + p.h * 0.55, p.w - 6, 5);

        ctx.fillStyle = COL.char;
        ctx.beginPath();
        ctx.arc(cx, top + p.h * 0.78, p.w / 2 - 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = COL.charShade;
        ctx.beginPath();
        ctx.arc(cx - 4, top + p.h * 0.82, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = COL.char;
        ctx.beginPath();
        ctx.arc(cx, top + p.h * 0.32, p.w / 2 - 4, 0, Math.PI * 2);
        ctx.fill();

        const eyeOffX = p.dir * 1.2;
        ctx.fillStyle = COL.eye;
        ctx.fillRect(cx - 4 + eyeOffX, top + p.h * 0.28, 1.8, 2.2);
        ctx.fillRect(cx + 3 + eyeOffX, top + p.h * 0.28, 1.8, 2.2);

        ctx.fillStyle = COL.cheek;
        ctx.beginPath(); ctx.arc(cx - 5, top + p.h * 0.38, 1.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 5, top + p.h * 0.38, 1.6, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = COL.carrot;
        ctx.beginPath();
        ctx.moveTo(cx, top + p.h * 0.34);
        ctx.lineTo(cx + p.dir * 6, top + p.h * 0.36);
        ctx.lineTo(cx, top + p.h * 0.40);
        ctx.closePath();
        ctx.fill();

        if (p.wallSide !== 0 && p.dy > 0) {
            ctx.fillStyle = 'rgba(214,240,255,0.55)';
            const wx = p.wallSide < 0 ? p.x - 5 : p.x + p.w + 1;
            ctx.fillRect(wx, top + 4, 3, p.h - 8);
        }
    }

    return { id, levels, init, destroy };
})();


/* GAME: kabuğun başlatacağı modül */
const GAME = BuzKulesi;

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => Shell.boot());
} else {
    Shell.boot();
}
</script>
