<!DOCTYPE html>
<html lang="tr" data-lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ateş & Buz</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #1a1a2e;
        overflow: hidden;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        background-color: white;
      }
      #canvas {
        max-width: 100%;
        max-height: 100vh;
        height: auto;
        width: auto;
        display: block;
      }
      /* Mobil dokunmatik kontroller — yalnızca dokunmatik (coarse pointer) cihazlarda görünür */
      .ab-touch {
        position: fixed; left: 0; right: 0; bottom: 0;
        display: none; justify-content: space-between;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        pointer-events: none; z-index: 10;
      }
      .ab-touch-side { display: flex; gap: 14px; pointer-events: none; }
      .ab-touch-btn {
        pointer-events: auto; width: 62px; height: 62px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.55); background: rgba(20,24,40,0.45);
        color: #fff; font-size: 26px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        touch-action: none; user-select: none; -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .ab-touch-btn.fire { border-color: rgba(255, 107, 107, 0.85); }
      .ab-touch-btn.ice { border-color: rgba(107, 183, 255, 0.85); }
      .ab-touch-btn.active { background: rgba(80,120,220,0.7); }
      @media (pointer: coarse) { .ab-touch { display: flex; } }
    </style>
</head>

const canvas = document.getElementById("fbwg-canvas") || document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const GAME_SIZE = {
    width: 39,
    height: 29,
    block: {
        width: 36,
        height: 36,
    },
};

canvas.height = GAME_SIZE.block.height * GAME_SIZE.height;
canvas.width = GAME_SIZE.block.width * GAME_SIZE.width;

function getMousePos(event) {
    const rect = canvas.getBoundingClientRect();
    const scale = {
        x: canvas.width / rect.width,
        y: canvas.height / rect.height,
    };
    return {
        x: (event.clientX - rect.left) * scale.x,
        y: (event.clientY - rect.top) * scale.y,
    };
}

function loadDataFromLocalStorage() {
    let newLevels = Storage.get("menuLevels");
    if (newLevels) {
        newLevels = JSON.parse(newLevels);
        for (let i = 1; i <= Object.keys(newLevels).length; i++) {
            for (const key in newLevels[i]) {
                menuLevels[i][key] = newLevels[i][key];
                menuLevels[i].setQuestsStatus(menuLevels[i].questsStatus);
            }
        }
    }

    let newLevelsPath = Storage.get("menuLevelsPath");
    if (newLevelsPath) {
        newLevelsPath = JSON.parse(newLevelsPath);
        for (let i = 1; i <= Object.keys(newLevelsPath).length; i++) {
            for (const key in newLevelsPath[i]) {
                menuLevelsPath[i][key] = newLevelsPath[i][key];
            }
        }
    }
}

function saveDataToLocalStorage() {
    let levels = {};

    for (let i = 1; i <= Object.keys(menuLevels).length; i++) {
        levels[i] = {};
        levels[i].unlocked = menuLevels[i].unlocked;
        levels[i].questsStatus = menuLevels[i].questsStatus;
    }

    let levelsPath = {};

    for (let i = 1; i <= Object.keys(menuLevelsPath).length; i++) {
        levelsPath[i] = {};
        levelsPath[i].unlocked = menuLevelsPath[i].unlocked;
    }

    Storage.set("menuLevels", JSON.stringify(levels));
    Storage.set("menuLevelsPath", JSON.stringify(levelsPath));
}

class Sprite {
    constructor({
        position,
        imgSrc,
        animations,
        flipImage = false,
        frameRate = 1,
        imgRows = 1,
        currentRow = 1,
        frameDelay = 4,
        shape,
        angle = null,
    }) {
        this.position = position;
        this.image = new Image();
        // Fabrika build: görseller __ASSETS sözlüğünde data-URI olarak gömülüdür
        this.image.src = (typeof __ASSETS !== 'undefined' && __ASSETS[imgSrc]) || imgSrc;
        this.image.onload = () => {
            this.loaded = true;
            this.width = this.image.width;
            this.height = this.image.height / imgRows;
        };
        this.loaded = false;

        this.frameRate = frameRate;
        this.frameDelay = frameDelay;
        this.imgRows = imgRows;
        this.currentRow = currentRow;

        this.currentFrame = 0;
        this.frameCount = 0;

        this.flipImage = flipImage;
        if (this.flipImage) {
            this.currentFrame = frameRate - 1;
        }

        this.animations = animations;
        this.angle = angle;
        this.shape = shape;

        this.opacity = 1;
    }
    draw() {
        if (this.loaded) {
            const cropBox = {
                position: {
                    x: (this.width / this.frameRate) * this.currentFrame,
                    y: this.height * (this.currentRow - 1),
                },
                width: this.width / this.frameRate,
                height: this.height,
            };

            ctx.globalAlpha = this.opacity;

            //run animations
            if (
                this.currentAnimation == "left" ||
                this.currentAnimation == "right" ||
                this.shape == "lever" ||
                (this.shape == "ramp" && this.angle) ||
                this.shape == "ball"
            ) {
                ctx.save();
                if (this.shape == "lever") {
                    ctx.translate(this.position.x + cropBox.width / 2, this.centerPoint.y);
                    ctx.rotate(this.angle);
                    ctx.translate(-(this.position.x + cropBox.width / 2), -this.centerPoint.y);
                    ctx.drawImage(
                        this.image,
                        cropBox.position.x,
                        cropBox.position.y,
                        cropBox.width,
                        cropBox.height,
                        this.position.x,
                        this.position.y,
                        cropBox.width,
                        cropBox.height
                    );
                } else if (this.flipImage) {
                    ctx.translate(
                        this.position.x + cropBox.width / 2,
                        this.position.y + cropBox.height / 2
                    );
                    ctx.rotate(-this.angle);
                    ctx.translate(
                        -(this.position.x + cropBox.width / 2),
                        -(this.position.y + cropBox.height / 2)
                    );
                    ctx.scale(-1, 1);
                    ctx.drawImage(
                        this.image,
                        cropBox.position.x,
                        cropBox.position.y,
                        cropBox.width,
                        cropBox.height,
                        cropBox.width * -1 - this.position.x,
                        this.position.y,
                        cropBox.width,
                        cropBox.height
                    );
                } else {
                    ctx.translate(
                        this.position.x + cropBox.width / 2,
                        this.position.y + cropBox.height / 2
                    );
                    ctx.rotate(this.angle);
                    ctx.translate(
                        -(this.position.x + cropBox.width / 2),
                        -(this.position.y + cropBox.height / 2)
                    );
                    ctx.drawImage(
                        this.image,
                        cropBox.position.x,
                        cropBox.position.y,
                        cropBox.width,
                        cropBox.height,
                        this.position.x,
                        this.position.y,
                        cropBox.width,
                        cropBox.height
                    );
                }
                ctx.restore();
            }
            //flipped images
            else if (this.flipImage) {
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(
                    this.image,
                    cropBox.position.x,
                    cropBox.position.y,
                    cropBox.width,
                    cropBox.height,
                    cropBox.width * -1 - this.position.x,
                    this.position.y,
                    cropBox.width,
                    cropBox.height
                );
                ctx.restore();

                this.frameCount++;
                if (this.frameCount == this.frameDelay) {
                    this.currentFrame--;

                    if (this.currentFrame < 0) {
                        this.currentFrame = this.frameRate - 1;
                    }
                    this.frameCount = 0;
                }
                return;
            } else {
                ctx.drawImage(
                    this.image,
                    cropBox.position.x,
                    cropBox.position.y,
                    cropBox.width,
                    cropBox.height,
                    this.position.x,
                    this.position.y,
                    cropBox.width,
                    cropBox.height
                );
            }

            ctx.globalAlpha = 1;

            this.frameCount++;
            if (this.frameCount == this.frameDelay) {
                if (this.constructor.name == "Door") {
                    this.openDoor();
                    this.frameCount = 0;
                    return;
                }

                this.currentFrame++;

                if (this.currentFrame == this.frameRate) {
                    this.currentFrame = 0;
                }
                this.frameCount = 0;
            }
        }
    }
}

/* ===== collisions.js ===== */




/* Fabrika bundle uyumu: yukarıdaki namespace import bundler'da silinir;
   Blocks objesi collisionBlocks.js'in aynı-scope sabitlerinden elle kurulur.
   (Bundle dışında — ESM olarak — bu satır import'u gölgeleyen eşdeğer bir
   yerel tanım üretirdi; o yüzden yalnız bundle'da derlenen kopyada durur.) */
const Blocks = {
    EMPTY, BLOCK,
    TRIANGLE_LEFT_UP, TRIANGLE_RIGHT_UP, TRIANGLE_LEFT_DOWN, TRIANGLE_RIGHT_DOWN,
    FIRE_POND, WATER_POND, ACID_POND,
    FIRE_POND_TRIANGLE_LEFT, FIRE_POND_TRIANGLE_RIGHT,
    WATER_POND_TRIANGLE_LEFT, WATER_POND_TRIANGLE_RIGHT,
    ACID_POND_TRIANGLE_LEFT, ACID_POND_TRIANGLE_RIGHT,
    FIRE_POND_START_INDEX,
};

class CollisionBlock {
    constructor({ position, shape, direction, element }) {
        this.position = position;
        this.shape = shape;
        this.direction = direction;
        this.element = element;
        this.width = 36;
        this.height = 36;

        this.hitbox = {
            position,
            width: this.width,
            height: this.height,
        };
    }
    draw() {
        if (this.shape == "square") {
            ctx.fillStyle = "rgba(255,0,0,0.5)";
            ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
        } else if (this.shape == "triangle") {
            ctx.fillStyle = "rgba(255, 251, 0, 0.575)";
            if (this.direction.x == "right" && this.direction.y == "up") {
                ctx.beginPath();
                ctx.moveTo(this.position.x, this.position.y);
                ctx.lineTo(this.position.x, this.position.y + this.height);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height);
                ctx.fill();
            } else if (this.direction.x == "left" && this.direction.y == "up") {
                ctx.beginPath();
                ctx.moveTo(this.position.x + this.width, this.position.y);
                ctx.lineTo(this.position.x, this.position.y + this.height);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height);
                ctx.fill();
            } else if (this.direction.x == "left" && this.direction.y == "down") {
                ctx.beginPath();
                ctx.moveTo(this.position.x, this.position.y);
                ctx.lineTo(this.position.x + this.width, this.position.y);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height);
                ctx.fill();
            } else if (this.direction.x == "right" && this.direction.y == "down") {
                ctx.beginPath();
                ctx.moveTo(this.position.x, this.position.y);
                ctx.lineTo(this.position.x + this.width, this.position.y);
                ctx.lineTo(this.position.x, this.position.y + this.height);
                ctx.fill();
            }
        } else if (this.shape == "pond") {
            ctx.fillStyle = "rgba(255, 0, 242, 0.575)";
            ctx.fillRect(this.position.x, this.position.y + 18, this.width, this.height - 18);
        } else if (this.shape == "pondTriangle") {
            ctx.fillStyle = "rgba(255, 0, 242, 0.575)";
            if (this.direction.x == "left") {
                ctx.beginPath();
                ctx.moveTo(this.position.x + this.width, this.position.y);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height);
                ctx.lineTo(this.position.x, this.position.y + this.height);
                ctx.lineTo(this.position.x, this.position.y + this.height / 2);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(this.position.x, this.position.y);
                ctx.lineTo(this.position.x, this.position.y + this.height);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height);
                ctx.lineTo(this.position.x + this.width, this.position.y + this.height / 2);
                ctx.fill();
            }
        }
    }
}

function createObjectsFromArray(array) {
    const objects = [];
    const ponds = [];

    for (let i = 0; i < array.length; i++) {
        let shape;
        let direction = {
            x: null,
            y: null,
        };
        let element = null;
        let flipImage = false;
        let currentRow;

        switch (array[i]) {
            case Blocks.BLOCK:
                //square
                shape = "square";
                break;
            case Blocks.TRIANGLE_LEFT_UP:
                //triangle to left
                shape = "triangle";
                direction = {
                    x: "left",
                    y: "up",
                };
                break;
            case Blocks.TRIANGLE_RIGHT_UP:
                //triangle to right
                shape = "triangle";
                direction = {
                    x: "right",
                    y: "up",
                };
                break;
            case Blocks.TRIANGLE_LEFT_DOWN:
                //triangle to left
                shape = "triangle";
                direction = {
                    x: "left",
                    y: "down",
                };
                break;
            case Blocks.TRIANGLE_RIGHT_DOWN:
                //triangle to right
                shape = "triangle";
                direction = {
                    x: "right",
                    y: "down",
                };
                break;
            case Blocks.WATER_POND:
            case Blocks.FIRE_POND:
            case Blocks.ACID_POND:
                shape = "pond";
                break;
            case Blocks.WATER_POND_TRIANGLE_RIGHT:
            case Blocks.FIRE_POND_TRIANGLE_RIGHT:
            case Blocks.ACID_POND_TRIANGLE_RIGHT:
                //pond triangle to right
                shape = "pondTriangle";
                direction = {
                    x: "right",
                    y: "up",
                };
                break;
            case Blocks.WATER_POND_TRIANGLE_LEFT:
            case Blocks.FIRE_POND_TRIANGLE_LEFT:
            case Blocks.ACID_POND_TRIANGLE_LEFT:
                //pond triangle to left
                shape = "pondTriangle";
                direction = {
                    x: "left",
                    y: "up",
                };
                flipImage = true;
                break;
        }
        switch (array[i]) {
            case Blocks.FIRE_POND:
                element = "fire";
                currentRow = 3;
                break;
            case Blocks.FIRE_POND_TRIANGLE_LEFT:
            case Blocks.FIRE_POND_TRIANGLE_RIGHT:
                element = "fire";
                currentRow = 4;
                break;
            case Blocks.WATER_POND:
                currentRow = 1;
                element = "water";
                break;
            case Blocks.WATER_POND_TRIANGLE_LEFT:
            case Blocks.WATER_POND_TRIANGLE_RIGHT:
                element = "water";
                currentRow = 2;
                break;
            case Blocks.ACID_POND:
                element = "acid";
                currentRow = 5;
                break;
            case Blocks.ACID_POND_TRIANGLE_LEFT:
            case Blocks.ACID_POND_TRIANGLE_RIGHT:
                element = "acid";
                currentRow = 6;
                break;
        }

        let newPosition = {
            x: (i % GAME_SIZE.width) * GAME_SIZE.block.width,
            y: Math.floor(i / GAME_SIZE.width) * GAME_SIZE.block.height,
        };

        if (array[i] >= Blocks.FIRE_POND_START_INDEX) {
            ponds.push(
                new Sprite({
                    position: newPosition,
                    imgSrc: `./img/ponds.png`,
                    frameRate: 9,
                    imgRows: 6,
                    currentRow: currentRow,
                    flipImage: flipImage,
                })
            );
        }

        if (array[i] !== Blocks.EMPTY) {
            objects.push(
                new CollisionBlock({
                    position: newPosition,
                    shape: shape,
                    direction: direction,
                    element: element,
                })
            );
        }
    }

    return {
        objects,
        ponds,
    };
}

function formatTime(miliseconds) {
    let seconds = Math.floor(miliseconds / 1000);
    let minutes = Math.floor(seconds / 60);

    seconds = seconds % 60;
    seconds = seconds.toString();
    if (seconds < 10) {
        seconds = "0" + seconds;
    }

    minutes.toString();
    if (minutes < 10) {
        minutes = "0" + minutes;
    }

    return { minutes, seconds };
}

    //background
    drawTimeBackground("black", 0);
    drawTimeBackground("#83641D", 5);

    ctx.fillStyle = "yellow";
    ctx.fillText(fullText, 17 * 36 + 28, 36);
}

function drawTimeBackground(color, offset) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(16 * 36 + offset, 0);

    ctx.lineTo(22 * 36 - offset / 2, 50 - offset / 2);
    ctx.lineTo(23 * 36 - offset, 0);
    ctx.fill();
}

/* ===== ramp.js ===== */



class Ramp {
    constructor({ position, color, finalPosition, finalColor, boxCount, rotated }) {
        this.position = position;
        this.color = color;
        this.startPosition = { ...position };

        this.finalPosition = finalPosition;
        this.finalColor = finalColor;

        this.rotated = rotated;

        this.hitbox = {
            position: {
                x: this.position.x,
                y: this.position.y + 5,
            },
            width: 36 * boxCount,
            height: 26,
        };

        if (this.rotated) {
            this.hitbox.position.x += 5;
            this.hitbox.position.y -= 3;
            this.hitbox.width = 26;
            this.hitbox.height = 36 * boxCount;
        }

        this.shape = "ramp";
        this.blocked = false;
        this.blockedDirection;

        this.addingValue = 1;

        this.direction = "x";
        if (this.startPosition.x == this.finalPosition.x) {
            this.direction = "y";
            if (this.startPosition.y > this.finalPosition.y) {
                this.addingValue = -1;
            }
        } else {
            if (this.startPosition.x > this.finalPosition.x) {
                this.addingValue = -1;
            }
        }

        this.boxCount = boxCount;

        this.ramps = [];

        this.offset = {
            x: 0,
            y: 0,
        };
        this.angle = null;
        if (rotated) {
            this.offset.y = 36;
            this.angle = (90 * Math.PI) / 180;
        } else {
            this.offset.x = 36;
        }

        for (let i = 0; i < boxCount; i++) {
            let currentRow = 2;
            let flipImage = false;
            if (i == 0) {
                currentRow = 1;
            } else if (i == boxCount - 1) {
                currentRow = 1;
                flipImage = true;
                this.angle = -this.angle;
            }
            this.ramps.push(
                new Sprite({
                    position: {
                        x: this.position.x + this.offset.x * i,
                        y: this.position.y + this.offset.y * i,
                    },
                    imgSrc: "./img/ramp.png",
                    flipImage: flipImage,
                    imgRows: 2,
                    currentRow: currentRow,
                    shape: this.shape,
                    angle: this.angle,
                })
            );
        }
    }
    draw(pressed) {
        if (pressed) ctx.fillStyle = this.finalColor;
        else ctx.fillStyle = this.color;

        if (this.rotated) {
            ctx.fillRect(this.position.x + 10, this.position.y + 6, 16, 36 * this.boxCount - 12);
        } else {
            ctx.fillRect(this.position.x + 6, this.position.y + 10, 36 * this.boxCount - 12, 16);
        }
        this.ramps.forEach((ramp) => {
            ramp.draw();
        });
    }
    addValue(value) {
        this.position[this.direction] += value;
        this.hitbox.position[this.direction] += value;
        this.ramps.forEach((ramp) => {
            ramp.position[this.direction] += value;
        });
    }
    move(pressed) {
        if (pressed) {
            if (
                this.blocked &&
                ((this.blockedDirection == "up" && this.rotated) ||
                    (this.blockedDirection == "down" && !this.rotated))
            ) {
                this.blockedDirection = null;
                this.blocked = false;
                return;
            }
            if (this.position[this.direction] != this.finalPosition[this.direction]) {
                this.addValue(this.addingValue);
            }
            return;
        }

        if (
            this.blocked &&
            ((this.blockedDirection == "down" && this.rotated) ||
                (this.blockedDirection == "up" && !this.rotated))
        ) {
            this.blocked = false;
            this.blockedDirection = null;
            return;
        }

        if (this.position[this.direction] != this.startPosition[this.direction]) {
            this.addValue(this.addingValue * -1);
        }
    }
}

class Lever extends Sprite {
    constructor({ position, color, finalColor, ramp }) {
        const imgSrc = "./img/lever.png";
        super({ position, imgSrc });

        this.position = position;

        this.color = color;
        this.finalColor = finalColor;

        this.origHitboxPosition = {
            x: position.x + 4,
            y: position.y + 2,
        };

        this.hitbox = {
            position: {
                x: position.x + 4,
                y: position.y + 2,
            },
            width: 10,
            height: 42,
        };

        this.angle = 30 * (Math.PI / 180);
        this.shape = "lever";

        this.ramp = ramp;
        this.pressed = false;

        this.base = new Sprite({
            position: {
                x: position.x - 27,
                y: position.y + 45,
            },
            imgSrc: "./img/leverBase.png",
        });

        this.centerPoint = {
            x: this.hitbox.position.x + this.hitbox.width / 2,
            y: this.hitbox.position.y + this.hitbox.height + 4,
        };

        this.calcRotatedPos();
    }
    calcRotatedPos() {
        this.hitbox.position = {
            x:
                this.centerPoint.x +
                (-this.hitbox.width / 2) * Math.cos(this.angle) -
                -this.hitbox.height * Math.sin(this.angle) -
                1,
            y:
                this.centerPoint.y +
                (this.origHitboxPosition.y - this.centerPoint.y) * Math.cos(this.angle),
        };
    }
    checkAngle() {
        if (this.angle >= 0 && Math.round(this.angle / (Math.PI / 180)) != 30) {
            this.angle += Math.PI / 180 / 2;
        } else if (this.angle < 0 && Math.round(this.angle / (Math.PI / 180)) != -30) {
            this.angle -= Math.PI / 180 / 2;
        }
        this.pressed = false;
        if (this.angle < 0) {
            this.pressed = true;
        }
    }
    run() {
        this.ramp.move(this.pressed);
        this.ramp.draw(this.pressed);
    }
    fillColor() {
        ctx.fillStyle = this.color;
        if (this.pressed) {
            ctx.fillStyle = this.finalColor;
        }
        ctx.fillRect(this.base.position.x + 12, this.base.position.y + 6, 48, 8);
        this.calcRotatedPos();
        ctx.fillRect(this.hitbox.position.x, this.hitbox.position.y, this.hitbox.width, 11);
    }
    drawLever() {
        this.fillColor();
        this.draw();
        this.base.draw();
    }
}

class Cube extends Sprite {
    constructor({ position, collisionBlocks, allAssets, players }) {
        const imgSrc = "./img/cube.png";
        super({ position, imgSrc });

        this.position = position;
        this.startPosition = { x: position.x, y: position.y };
        this.velocity = {
            x: 0,
            y: 0,
        };

        this.hitbox = {
            position: {
                x: this.position.x + 2,
                y: this.position.y + 1,
            },
            width: 64,
            height: 66,
        };

        this.shape = "cube";
        this.isOnBlock = false;
        this.isOnRamp = false;

        this.collisionBlocks = collisionBlocks;
        this.allAssets = allAssets;
        this.players = players;

        this.rampBlocked = false;
    }
    checkOffscreen() {
        // Havuza düşüp canvas dışına kaybolursa başa dön
        if (this.position.y > 1200) {
            this.position.x = this.startPosition.x;
            this.position.y = this.startPosition.y;
            this.velocity.x = 0;
            this.velocity.y = 0;
            this.hitboxPositionCalc();
        }
    }
    hitboxPositionCalc() {
        this.hitbox.position = {
            x: this.position.x + 2,
            y: this.position.y + 1,
        };
    }
    update() {
        this.position.x += this.velocity.x;

        this.hitboxPositionCalc();
        this.horizontalCollision(this.allAssets);

        this.hitboxPositionCalc();
        this.horizontalCollision(this.players);

        this.hitboxPositionCalc();
        this.horizontalCollision(this.collisionBlocks);

        this.velocity.x = 0;
        this.gravity();

        this.isOnBlock = false;
        this.rampBlocked = false;
        this.hitboxPositionCalc();
        this.verticalCollision(this.collisionBlocks);

        this.isOnRamp = false;
        this.hitboxPositionCalc();
        this.verticalCollision(this.allAssets);

        this.hitboxPositionCalc();
        this.verticalCollision(this.players);

        this.hitboxPositionCalc();

        this.checkOffscreen();
    }
    gravity() {
        this.velocity.y += 0.25;
        this.position.y += this.velocity.y;
    }
    horizontalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            //block is this cube
            if (block == this) continue;

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + 1 &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                if (block.shape == "square" || block.shape == "ramp" || block.shape == "lever") {
                    if (this.rampBlocked) {
                        break;
                    }

                    //cube going right
                    if (this.velocity.x > 0) {
                        const offset = this.hitbox.position.x - this.position.x + this.hitbox.width;
                        this.position.x = block.hitbox.position.x - offset - 0.01;
                        break;
                    }
                    //cube going left
                    else if (this.velocity.x < 0) {
                        const offset = this.hitbox.position.x - this.position.x;
                        this.position.x =
                            block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                        break;
                    }
                } else if (block.constructor.name == "Player") {
                    //head collision
                    if (
                        this.hitbox.position.y + this.hitbox.height >
                            Math.round(block.hitbox.position.y) &&
                        this.hitbox.position.y <=
                            block.hitbox.position.y + block.hitbox.height - block.hitbox.legs.height
                    ) {
                        //cube going to left
                        if (this.velocity.x < 0) {
                            block.velocity.x -= 1;
                            const offset = this.hitbox.position.x - this.position.x;
                            this.position.x =
                                block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                            break;
                        }
                        //cube going to right
                        else if (this.velocity.x > 0) {
                            block.velocity.x += 1;
                            const offset =
                                this.hitbox.position.x - this.position.x + this.hitbox.width;
                            this.position.x = block.hitbox.position.x - offset - 0.01;
                            break;
                        }
                    }
                }
            }
        }
    }
    calculateXPos(block) {
        let xPos;
        //triangle to left
        if (block.direction.x == "left") {
            xPos = (this.hitbox.position.x + this.hitbox.width) % 36;

            xPos = 36 - xPos;
            if (xPos == 36 || xPos < 1) xPos = 0;
        }
        //triangle to right
        else {
            xPos = this.hitbox.position.x % 36;

            if (xPos < 1) xPos = 0;
        }

        return xPos;
    }
    triangleChangePosition(block, xPos) {
        if (this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + xPos) {
            this.isOnBlock = true;
            this.velocity.y = 0;
            const offset = this.hitbox.position.y + this.hitbox.height - this.position.y;
            this.position.y = block.hitbox.position.y + xPos - offset - 0.01;
        }
    }
    verticalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            //block is this cube
            if (block == this) continue;

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                if (block.shape == "square" || block.shape == "ramp" || block.shape == "lever") {
                    if (this.isOnRamp) {
                        this.rampBlocked = true;
                        break;
                    }
                    //cube blocking ramp down
                    if (
                        this.isOnBlock &&
                        block.shape == "ramp" &&
                        Math.round(this.hitbox.position.y) ==
                            block.hitbox.position.y + block.hitbox.height
                    ) {
                        block.blocked = true;
                        block.blockedDirection = "down";
                        break;
                    }
                    //cube top collision
                    if (
                        this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height &&
                        this.hitbox.position.y >= block.hitbox.position.y
                    ) {
                        this.velocity.y = 0;
                        const offset = this.hitbox.position.y - this.position.y;
                        this.position.y =
                            block.hitbox.position.y + block.hitbox.height - offset + 0.01;
                        break;
                    }
                    //cube going down bottom collision
                    if (
                        this.velocity.y > 0 &&
                        this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y
                    ) {
                        if (block.canMove) {
                            block.pressed = true;
                        }
                        if (block.shape == "ramp") {
                            this.isOnRamp = true;
                        }
                        this.isOnBlock = true;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;
                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                } else if (block.shape == "button") {
                    block.pressed = true;
                    break;
                } else if (block.constructor.name == "Player") {
                    //cube going on players head
                    if (
                        this.velocity.y > 0 &&
                        this.hitbox.position.y + this.hitbox.height > block.hitbox.position.y &&
                        this.hitbox.position.y + this.hitbox.height < block.hitbox.legs.position.y
                    ) {
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;
                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }

                    //player going down head collision
                    if (
                        this.hitbox.position.y >=
                        block.hitbox.position.y + block.hitbox.height - block.hitbox.legs.height
                    ) {
                        //player going left
                        if (this.hitbox.position.x >= block.hitbox.position.x) {
                            block.sliding.left = true;
                            block.position.x -= 2;
                        }
                        //player going right
                        else {
                            block.sliding.right = true;
                            block.position.x += 2;
                        }
                        break;
                    }
                }
                //triangle collision
                else if (block.shape == "triangle" && block.direction.y == "up") {
                    //triangle left
                    if (
                        block.direction.x == "left" &&
                        this.hitbox.position.x + this.hitbox.width > block.hitbox.position.x &&
                        this.hitbox.position.x + this.hitbox.width <=
                            block.hitbox.position.x + block.hitbox.width
                    ) {
                        let xPos = this.calculateXPos(block);
                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                    //triangle right
                    else if (
                        block.direction.x == "right" &&
                        this.hitbox.position.x >= block.hitbox.position.x &&
                        this.hitbox.position.x < block.hitbox.position.x + block.hitbox.width
                    ) {
                        let xPos = this.calculateXPos(block);

                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                }
            }
        }
    }
}

class Door extends Sprite {
    constructor({ position, element }) {
        const imgSrc = "./img/door_sprite.png";
        const imgRows = 2;

        let currentRow = 1;
        if (element == "water") {
            currentRow = 2;
        }

        const frameRate = 13;
        const frameDelay = 2;

        super({ position, imgSrc, currentRow, imgRows, frameRate, frameDelay });

        this.position = position;
        this.element = element;

        this.pressed = false;

        this.hitbox = {
            position: {
                x: this.position.x + 20,
                y: this.position.y + 20,
            },
            height: 88,
            width: 60,
        };

        this.maxFrame = frameRate - 1;

        this.opened = false;
    }
    openDoor() {
        //closing door
        if (!this.pressed && this.currentFrame != 0) {
            this.currentFrame--;
        }

        //opening door
        if (this.pressed && this.currentFrame != this.maxFrame) {
            this.currentFrame++;
        }

        if (this.currentFrame == this.maxFrame) {
            this.opened = true;
            return;
        }
        this.opened = false;
    }
}

class Bridge extends Sprite {
    constructor({ position, chainsCount }) {

        this.hitbox = {
            position,
            width: 144,
            height: 36,
        };

        ctx.lineWidth = 3;

    }

/* ===== ball.js ===== */



class Ball extends Sprite {
    constructor({ position, collisionBlocks, allAssets }) {
        const imgSrc = "./img/ball.png";

        super({ position, imgSrc });

        this.position = position;
        this.startPosition = { x: position.x, y: position.y };
        this.velocity = {
            x: 0,
            y: 0,
        };

        this.hitbox = {
            position: {
                x: this.position.x + 2,
                y: this.position.y + 2,
            },
            width: 28,
            height: 28,
        };
        this.collisionBlocks = collisionBlocks;
        this.allAssets = allAssets;

        this.shape = "ball";

        this.isOnBlock = false;

        this.lastPosition = { ...this.position };
        this.angle = 90 * (Math.PI / 180);
    }
    checkOffscreen() {
        if (this.position.y > 1200) {
            this.position.x = this.startPosition.x;
            this.position.y = this.startPosition.y;
            this.velocity.x = 0;
            this.velocity.y = 0;
            this.hitboxPositionCalc();
        }
    }
    hitboxPositionCalc() {
        this.hitbox.position = {
            x: this.position.x + 1,
            y: this.position.y + 1,
        };
    }
    update() {
        this.lastPosition.x = this.position.x;
        this.position.x += this.velocity.x;

        this.hitboxPositionCalc();
        this.horizontalCollision(this.allAssets);

        this.hitboxPositionCalc();
        this.horizontalCollision(this.collisionBlocks);

        if (this.lastPosition.x != this.position.x) {
            this.angle += this.velocity.x * (Math.PI / 180) * 2;
        }

        if (this.velocity.x != 0) {
            this.velocity.x *= 0.995;

            if (Math.abs(this.velocity.x) < 0.01) {
                this.velocity.x = 0;
            }
        }
        this.gravity();

        this.hitboxPositionCalc();
        this.verticalCollision(this.collisionBlocks);

        this.hitboxPositionCalc();
        this.verticalCollision(this.allAssets);

        this.checkOffscreen();
    }
    gravity() {
        this.velocity.y += 0.25;
        this.position.y += this.velocity.y;
    }
    horizontalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            //block is this ball
            if (block == this) continue;

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + 1 &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                if (block.shape == "square" || block.shape == "ramp") {
                    //ball going right
                    if (this.velocity.x > 0) {
                        this.velocity.x = -this.velocity.x / 2;
                        const offset = this.hitbox.position.x - this.position.x + this.hitbox.width;
                        this.position.x = block.hitbox.position.x - offset - 0.01;
                        break;
                    }
                    //ball going left
                    else if (this.velocity.x < 0) {
                        this.velocity.x = -this.velocity.x / 2;
                        const offset = this.hitbox.position.x - this.position.x;
                        this.position.x =
                            block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                        break;
                    }
                } else if (
                    block.shape == "triangle" &&
                    block.direction.y == "up" &&
                    block.direction.x == "left"
                ) {
                    if (
                        this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height &&
                        this.hitbox.position.y + this.hitbox.height > block.hitbox.height &&
                        this.hitbox.position.x < block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.x + this.hitbox.width >
                            block.hitbox.position.x + block.hitbox.width &&
                        this.velocity.x < 0
                    ) {
                        const offset = this.hitbox.position.x - this.position.x;
                        this.position.x =
                            block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                        break;
                    }
                }
            }
        }
    }
    calculateXPos(block) {
        let xPos;
        //triangle to left
        if (block.direction.x == "left") {
            xPos = (this.hitbox.position.x + this.hitbox.width) % 36;

            xPos = 36 - xPos;
            if (xPos == 36 || xPos < 1) xPos = 0;
        }
        //triangle to right
        else {
            xPos = this.hitbox.position.x % 36;

            if (xPos < 1) xPos = 0;
        }
        return xPos;
    }
    triangleChangePosition(block, xPos) {
        //for triangle up
        if (
            block.direction.y == "up" &&
            this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + xPos
        ) {
            this.isOnBlock = true;
            const offset = this.hitbox.position.y + this.hitbox.height - this.position.y;
            this.position.y = block.hitbox.position.y + xPos - offset - 0.01;
            this.velocity.y = 0;

            //ball changing velocity at triangle
            if (block.direction.x == "left") {
                if (this.velocity.x > 0.3) {
                    this.velocity.x *= 0.9;
                } else this.velocity.x--;
            } else if (block.direction.x == "right") {
                if (this.velocity.x < -0.3) {
                    this.velocity.x *= 0.9;
                } else this.velocity.x++;
            }
        }
        //for triangle down
        else if (
            block.direction.y == "down" &&
            this.hitbox.position.y < block.hitbox.position.y + block.hitbox.height - xPos
        ) {
            const offset = this.hitbox.position.y - this.position.y;
            this.position.y = block.hitbox.position.y + block.hitbox.height - xPos - offset + 0.01;
            this.velocity.y = 0;

            if (block.direction.x == "left" && this.velocity.x > 0) {
                this.velocity.x = -this.velocity.x / 3;
            } else if (block.direction.x == "right" && this.velocity.x < 0) {
                this.velocity.x = -this.velocity.x / 3;
            }
            this.velocity.y++;
        }
    }
    verticalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];
            //block is this ball
            if (block == this) continue;

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                if (block.shape == "square" || block.shape == "ramp") {
                    //ball top collision
                    if (
                        this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height &&
                        this.hitbox.position.y >= block.hitbox.position.y
                    ) {
                        this.velocity.y = 0;
                        const offset = this.hitbox.position.y - this.position.y;
                        this.position.y =
                            block.hitbox.position.y + block.hitbox.height - offset + 0.01;
                        break;
                    }
                    //ball going down bottom collision
                    if (
                        this.velocity.y > 0 &&
                        this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y
                    ) {
                        if (block.canMove) {
                            block.pressed = true;
                        }
                        if (block.shape == "ramp") {
                            this.isOnRamp = true;
                            if (this.velocity.x > 0) this.velocity.x += 0.005;
                            else if (this.velocity.x < 0) this.velocity.x -= 0.005;
                        }
                        this.isOnBlock = true;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;
                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                } else if (block.shape == "button") {
                    block.pressed = true;
                    break;
                }
                //triangle collision
                else if (block.shape == "triangle" && block.direction.y == "up") {
                    //triangle left
                    if (
                        block.direction.x == "left" &&
                        this.hitbox.position.x + this.hitbox.width > block.hitbox.position.x &&
                        this.hitbox.position.x + this.hitbox.width <=
                            block.hitbox.position.x + block.hitbox.width
                    ) {
                        let xPos = this.calculateXPos(block);
                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                    //triangle right
                    else if (
                        block.direction.x == "right" &&
                        this.hitbox.position.x >= block.hitbox.position.x &&
                        this.hitbox.position.x < block.hitbox.position.x + block.hitbox.width
                    ) {
                        let xPos = this.calculateXPos(block);

                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                }
                //triangle collision
                else if (block.shape == "triangle" && block.direction.y == "down") {
                    //triangle left
                    if (
                        block.direction.x == "left" &&
                        this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                        this.hitbox.position.x + this.hitbox.width <=
                            block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.y > block.hitbox.position.y
                    ) {
                        let xPos = this.calculateXPos(block);
                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                    //triangle right
                    else if (
                        block.direction.x == "right" &&
                        this.hitbox.position.x < block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.x + this.hitbox.width > block.hitbox.position.x &&
                        this.hitbox.position.y > block.hitbox.position.y
                    ) {
                        let xPos = this.calculateXPos(block);

                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                }
            }
        }
    }
}

        });

        this.requirement.variable = this.requirement.getVariable();

    check() {
        if (
            JSON.stringify(this.requirement.variable) == JSON.stringify(this.requirement.required)
        ) {
            this.status.currentRow = 2;
            this.completed = true;
            return;
        }

        this.status.currentRow = 1;
        this.completed = false;

        this.quest.position.y = menuPos + this.offsetY;
        this.status.position.y = menuPos + this.offsetY;
    }
    draw() {
        this.quest.draw();
        this.status.draw();
    }
}

function drawArrow(menuPos) {
    let startX = 700;
    let startY = menuPos + 310;
    let size = 100;
    let arrowX = startX + 0.75 * size;
    let arrowTopY = startY - 0.707 * (0.25 * size);
    let arrowBottomY = startY + 0.707 * (0.25 * size);

    ctx.strokeStyle = "#fac702";
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(startX + size, startY);
    ctx.moveTo(startX + size + 1, startY + 3);
    ctx.lineTo(arrowX, arrowTopY);
    ctx.moveTo(startX + size + 1, startY - 3);
    ctx.lineTo(arrowX, arrowBottomY);
    ctx.stroke();
}

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(posX + width / 2, posY);
        ctx.lineTo(posX + width, posY + height / 4);
        ctx.lineTo(posX + width, posY + (height / 4) * 3);
        ctx.lineTo(posX + width / 2, posY + height);
        ctx.lineTo(posX, posY + (height / 4) * 3);
        ctx.lineTo(posX, posY + height / 4);
        ctx.lineTo(posX + width / 2, posY);
        ctx.fill();
    }
}

class MenuButton {
    constructor({
        position,
        width,
        height,
        yOffset,
        text,
        runCode,
        outerColor = "#929292",

        ctx.lineWidth = 7;
        ctx.strokeStyle = "black";
        ctx.strokeText(this.text, this.position.x + this.textGap, this.position.y + this.fontSize);

        ctx.font = `${this.fontSize}px Cinzel`;
        ctx.fillStyle = "yellow";
        ctx.fillText(this.text, this.position.x + this.textGap, this.position.y + this.fontSize);
    }
    scaleDown() {
        ctx.fillStyle = this.outerColor;
        ctx.fillRect(this.position.x - 1, this.position.y - 1, this.width + 2, this.height + 2);
        this.position.x += 1;
        this.position.y += 1;
        this.width -= 2;
        this.height -= 2;
        this.fontSize -= 1;
    }
    resetSize() {
        this.position.x = this.originalValues.position.x;
        this.position.y = this.originalValues.position.y;
        this.width = this.originalValues.width;
        this.height = this.originalValues.height;
        this.fontSize = this.originalValues.fontSize;
    }
    run() {
        this.runCode();
    }
    updatePositionY(pos) {
        this.position.y = pos + this.yOffset;
    }
}

function drawFullPath(path) {
    const mainColor = menuDiamondsBorderColor[path.unlocked];
    drawPathPart(path, 0, 3, "black");
    drawPathPart(path, 3, 9, mainColor);
    drawPathPart(path, 12, 3, "black");
}

function drawPathPart(path, offset, width, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(path.position.x + offset, path.position.y);
    ctx.lineTo(path.finalPosition.x + offset, path.finalPosition.y);
    ctx.lineTo(path.finalPosition.x + width + offset, path.finalPosition.y);
    ctx.lineTo(path.position.x + width + offset, path.position.y);
    ctx.lineTo(path.position.x + offset, path.position.y);
    ctx.fill();
}

function checkMenuDiamondsCollision(pos, diamond) {
    return (
        diamond.unlocked &&
        pos.x > diamond.position.x &&
        pos.x < diamond.position.x + diamond.height * 0.9 &&
        pos.y < diamond.position.y + diamond.height &&
        pos.y > diamond.position.y
    );
}

class Player extends Sprite {
    constructor({
        position,
        collisionBlocks,
        allAssets,
        diamonds,
        doors,
        imgSrc,
        frameRate,
        frameDelay,
        currentRow,
        imgRows,
        legs,
        keys,
        animations,
        element,
    }) {
        super({ position, imgSrc, frameRate, frameDelay, currentRow, imgRows, animations });
        this.position = position;
        this.velocity = {
            x: 0,
            y: 0,
        };
        this.keys = keys;
        this.element = element;

        this.collisionBlocks = collisionBlocks;
        this.allAssets = allAssets;
        this.diamonds = diamonds;
        this.doors = doors;

        this.isOnBlock = false;

        this.lastPosition = position;

        this.hitbox = {
            position: {
                x: this.position.x + 4,
                y: this.position.y + 12,
            },
            width: 36,
            height: 60,
            legs: {
                position: {
                    x: this.position.x,
                    y: this.position.y,
                },
                width: 12,
                height: 24,
            },
        };

        this.legs = legs;

        this.sliding = {
            left: false,
            right: false,
        };

        this.currentAnimation = "idle";

        this.died = false;

        this.rampBlocked = false;
        this.isOnRamp = false;
    }
    update() {
        this.hitboxPositionCalc();
        this.lastPosition = this.hitbox.position;

        // ctx.fillStyle = "rgba(0,0,255,0.5)";
        // ctx.fillRect(
        //     this.hitbox.position.x,
        //     this.hitbox.position.y,
        //     this.hitbox.width,
        //     this.hitbox.height - this.hitbox.legs.height
        // );
        // ctx.fillStyle = "rgba(0,255,0, 0.5)";
        // ctx.fillRect(
        //     this.hitbox.legs.position.x,
        //     this.hitbox.legs.position.y,
        //     this.hitbox.legs.width,
        //     this.hitbox.legs.height
        // );

        this.position.x += this.velocity.x;

        this.hitboxPositionCalc();
        this.horizontalCollision(this.allAssets);

        this.hitboxPositionCalc();
        this.horizontalCollision(this.collisionBlocks);

        //gravity
        this.gravity();

        this.hitboxPositionCalc();
        this.isOnBlock = false;
        this.sliding.right = false;
        this.sliding.left = false;
        this.rampBlocked = false;
        this.verticalCollision(this.collisionBlocks);

        this.hitboxPositionCalc();
        this.isOnRamp = false;
        this.verticalCollision(this.allAssets);

        this.hitboxPositionCalc();
        this.calculateAngle();

        this.legs.position = {
            x: this.position.x + 37,
            y: this.position.y + 72,
        };
    }
    changeSprite(name) {
        if (name != this.currentAnimation) {
            //head animation
            this.currentFrame = 0;
            this.frameCount = 0;

            this.frameRate = this.animations[name].frameRate;
            this.currentRow = this.animations[name].currentRow;
            if (this.animations[name].flipImage) this.flipImage = true;
            else this.flipImage = false;

            this.currentAnimation = name;

            if (name == "up" || name == "down") {
                name = "idle";
            }

            //legs animation
            this.legs.currentFrame = 0;
            this.legs.frameCount = 0;

            this.legs.frameRate = this.legs.animations[name].frameRate;
            this.legs.currentRow = this.legs.animations[name].currentRow;
            if (this.legs.animations[name].flipImage) this.legs.flipImage = true;
            else this.legs.flipImage = false;
        }
    }
    checkDiamonds() {
        for (let i = 0; i < this.diamonds.length; i++) {
            let diamond = this.diamonds[i];
            if (diamond.collected) continue;
            if (
                (diamond.type == "final" || this.element == diamond.type) &&
                this.hitbox.position.x <= diamond.hitbox.position.x + diamond.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= diamond.hitbox.position.x &&
                this.hitbox.position.y <= diamond.hitbox.position.y + diamond.hitbox.height &&
                this.hitbox.position.y + this.hitbox.height >= diamond.hitbox.position.y
            ) {
                // collected flag (splice yerine — online sync için stabil index gerekli)
                diamond.collected = true;
                if (typeof this.onDiamondCollected === 'function') {
                    this.onDiamondCollected(i);
                }
            }
        }
    }
    checkDoors() {
        this.doors.forEach((door) => {
            if (
                this.element == door.element &&
                this.hitbox.position.x >= door.hitbox.position.x &&
                this.hitbox.position.x + this.hitbox.width <=
                    door.hitbox.position.x + door.hitbox.width &&
                this.hitbox.position.y >= door.hitbox.position.y &&
                this.hitbox.position.y + this.hitbox.height <=
                    door.hitbox.position.y + door.hitbox.height
            ) {
                door.pressed = true;
                return;
            }
        });
    }
    calculateAngle() {
        this.angle =
            Math.atan2(
                this.hitbox.position.y - this.lastPosition.y,
                Math.abs(this.hitbox.position.x - this.lastPosition.x)
            ) / 4;
        if (this.angle > 0) {
            this.angle /= 1.5;
        }
        if (this.velocity.y == 0) {
            this.angle = 0;
        }
    }
    hitboxPositionCalc() {
        this.hitbox.position = {
            x: this.position.x + 31,
            y: this.position.y + 37,
        };
        this.hitbox.legs.position = {
            x: this.hitbox.position.x + (this.hitbox.width - this.hitbox.legs.width) / 2,
            y: this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height,
        };
    }
    gravity() {
        // this.velocity.y += 0.5;
        if (this.velocity.y < 0) {
            this.velocity.y += 0.07;
            if (this.velocity.y > -0.001) {
                this.velocity.y = 0;
            }
        } else if (this.velocity.y > 0) {
            if (this.velocity.y >= 1.6) {
                // this.velocity.y = 1.7
                this.velocity.y += 0.02;
            } else {
                this.velocity.y += 0.07;
                // this.velocity.y += 1
            }
        }
        // else if (this.velocity.y == 0) this.velocity.y = 1.7;
        else this.velocity.y = 2.02;
        // this.velocity.y += 0.08;
        this.position.y += this.velocity.y;
    }
    horizontalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + 1 &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                //ramp blocked
                if (this.rampBlocked) {
                    break;
                }

                if (
                    block.shape == "square" ||
                    block.shape == "ramp" ||
                    block.shape == "lever" ||
                    block.shape == "cube" ||
                    block.shape == "pondTriangle"
                ) {
                    //collision not from side
                    if (
                        block.shape == "pondTriangle" &&
                        ((block.direction.x == "left" &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width <=
                                block.hitbox.position.x + block.hitbox.width &&
                            block.hitbox.width) ||
                            (block.direction.x == "right" && this.velocity.x < 0))
                    ) {
                        break;
                    }

                    //head collision
                    if (
                        this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                            block.hitbox.position.y &&
                        Math.round(this.hitbox.position.y) <
                            block.hitbox.position.y + block.hitbox.height &&
                        !this.sliding.right &&
                        !this.sliding.left
                    ) {
                        let moveTo;
                        if (block.shape == "lever") {
                            //pushing lever to left
                            if (
                                this.velocity.x < 0 &&
                                Math.round(block.angle / (Math.PI / 180)) > -30
                            ) {
                                block.angle -= Math.PI / 180;
                            }
                            //pushing lever to right
                            else if (
                                this.velocity.x > 0 &&
                                Math.round(block.angle / (Math.PI / 180)) < 30
                            ) {
                                block.angle += Math.PI / 180;
                            }
                            //lever pushing player to left
                            else if (
                                this.velocity.x == 0 &&
                                this.hitbox.position.x <= block.hitbox.position.x
                            ) {
                                moveTo = "left";
                            }
                            //lever pushing player to right
                            else if (
                                this.velocity.x == 0 &&
                                this.hitbox.position.x >= block.hitbox.position.x
                            ) {
                                moveTo = "right";
                            }
                        } else if (block.shape == "cube") {
                            if (this.velocity.x > 0) {
                                block.velocity.x = 1.5;
                            } else {
                                block.velocity.x = -1.5;
                            }
                        }
                        //player going to left
                        if (this.velocity.x < 0 || moveTo == "right") {
                            const offset = this.hitbox.position.x - this.position.x;
                            this.position.x =
                                block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                            break;
                        }
                        //player going to right
                        else if (this.velocity.x > 0 || moveTo == "left") {
                            const offset =
                                this.hitbox.position.x - this.position.x + this.hitbox.width;
                            this.position.x = block.hitbox.position.x - offset - 0.01;
                            break;
                        }
                    }
                    //player sliding
                    else if (this.sliding.left) this.position.x--;
                    else if (this.sliding.right) this.position.x++;
                    //legs collision
                    else if (
                        this.hitbox.legs.position.y + this.hitbox.legs.height >=
                            block.hitbox.position.y &&
                        this.hitbox.legs.position.y <= block.hitbox.position.y + block.hitbox.height
                    ) {
                        if (block.shape == "cube") {
                            if (this.velocity.x > 0) {
                                block.velocity.x = 1.5;
                            } else {
                                block.velocity.x = -1.5;
                            }
                        }
                        //player going to left
                        if (
                            this.velocity.x < 0 &&
                            this.hitbox.legs.position.x <=
                                block.hitbox.position.x + block.hitbox.width &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                block.hitbox.position.x
                        ) {
                            const offset = this.hitbox.legs.position.x - this.position.x;
                            this.position.x =
                                block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                            break;
                        }
                        //player going to right
                        else if (
                            this.velocity.x > 0 &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                block.hitbox.position.x &&
                            this.hitbox.legs.position.x <= block.hitbox.position.x
                        ) {
                            const offset =
                                this.hitbox.legs.position.x -
                                this.position.x +
                                this.hitbox.legs.width;
                            this.position.x = block.hitbox.position.x - offset - 0.01;
                            break;
                        }
                    }
                }
                //collision for ball
                else if (block.shape == "ball") {
                    //legs collision
                    if (
                        this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                        this.hitbox.position.y < block.hitbox.position.y + block.hitbox.height
                    ) {
                        //player going to left
                        if (
                            this.velocity.x < 0 &&
                            this.hitbox.legs.position.x <=
                                block.hitbox.position.x + block.hitbox.width &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                block.hitbox.position.x
                        ) {
                            block.velocity.x = Math.min(2, block.velocity.x - 0.5);

                            const offset = this.hitbox.legs.position.x - this.position.x;
                            this.position.x =
                                block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                            break;
                        }
                        //player going to right
                        else if (
                            this.velocity.x > 0 &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                block.hitbox.position.x &&
                            this.hitbox.legs.position.x <= block.hitbox.position.x
                        ) {
                            block.velocity.x = Math.min(2, block.velocity.x + 0.5);

                            const offset =
                                this.hitbox.legs.position.x -
                                this.position.x +
                                this.hitbox.legs.width;
                            this.position.x = block.hitbox.position.x - offset - 0.01;
                            break;
                        }
                    }
                }
                //triangle collision
                else if (block.shape == "triangle") {
                    if (block.direction.y == "down" && this.isOnBlock) {
                        if (
                            block.direction.x == "left" &&
                            this.hitbox.position.x + this.hitbox.width >
                                block.hitbox.position.x + 10 &&
                            this.hitbox.position.x + this.hitbox.width <
                                block.hitbox.position.x + block.hitbox.width &&
                            this.hitbox.position.y > block.hitbox.position.y &&

                        ) {

                                this.hitbox.position.x - this.position.x + this.hitbox.width - 10;

                        } else if (
                            block.direction.x == "right" &&
                            this.hitbox.position.x <
                                block.hitbox.position.x + block.hitbox.width - 10 &&
                            this.hitbox.position.x > block.hitbox.position.x &&
                            this.hitbox.position.y > block.hitbox.position.y &&
                            this.hitbox.position.y < block.hitbox.position.y + 18
                        ) {

                            this.position.x =
                                block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                            break;
                        }
                    }
                    if (
                        block.direction.x == "left" &&
                        this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.x >= block.hitbox.position.x &&
                        this.velocity.x < 0
                    ) {
                        //head collision
                        if (
                            this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                                block.hitbox.position.y &&
                            Math.round(this.hitbox.position.y) <
                                block.hitbox.position.y + block.hitbox.height &&

                                block.hitbox.position.x + block.hitbox.width &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                block.hitbox.position.x + block.hitbox.width &&
                            this.velocity.y != 0
                        ) {

                        else if (
                            this.hitbox.legs.position.y + this.hitbox.legs.height >=

                            this.hitbox.legs.position.y <=

                            //triangle left
                            if (
                                block.direction.x == "right" &&
                                this.hitbox.legs.position.x <=
                                    block.hitbox.position.x + block.hitbox.width &&
                                this.lastPosition.x +
                                    (this.hitbox.width - this.hitbox.legs.width) / 2 >=

                            ) {
                                const offset =
                                    this.hitbox.legs.position.x -

                                this.position.x = block.hitbox.position.x - offset - 0.01;

                            }
                        }
                    }

                    else if (block.direction.y == "down" && this.isOnBlock == false) {

                            this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                                block.hitbox.position.y &&
                            this.hitbox.position.y <= block.hitbox.position.y &&

                            !this.sliding.right
                        ) {
                            //player going to left
                            if (this.velocity.x < 0) {
                                const offset = this.hitbox.position.x - this.position.x;
                                this.position.x =
                                    block.hitbox.position.x + block.hitbox.width - offset + 0.01;

                            }

                            else if (this.velocity.x > 0) {
                                const offset =
                                    this.hitbox.position.x - this.position.x + this.hitbox.width;
                                this.position.x = block.hitbox.position.x - offset - 0.01;
                                break;
                            }
                        }
                        //player sliding
                        else if (this.sliding.left) this.position.x--;
                        else if (this.sliding.right) this.position.x++;
                        //legs collision
                        else if (
                            this.hitbox.legs.position.y + this.hitbox.legs.height >=
                                block.hitbox.position.y &&
                            this.hitbox.legs.position.y <= block.hitbox.position.y
                        ) {
                            //triangle left
                            if (
                                block.direction.x == "right" &&
                                this.hitbox.legs.position.x <=
                                    block.hitbox.position.x + block.hitbox.width &&
                                this.lastPosition.x +
                                    (this.hitbox.width - this.hitbox.legs.width) / 2 >=
                                    block.hitbox.position.x + block.hitbox.width
                            ) {
                                const offset = this.hitbox.legs.position.x - this.position.x;
                                this.position.x =
                                    block.hitbox.position.x + block.hitbox.width - offset + 0.01;
                                break;
                            }
                            //triangle right
                            else if (
                                block.direction.x == "left" &&
                                this.hitbox.legs.position.x + this.hitbox.legs.width >=
                                    block.hitbox.position.x &&
                                this.lastPosition.x +
                                    (this.hitbox.width - this.hitbox.legs.width) / 2 +
                                    this.hitbox.legs.width <=
                                    block.hitbox.position.x
                            ) {
                                const offset =
                                    this.hitbox.legs.position.x -
                                    this.position.x +
                                    this.hitbox.legs.width;
                                this.position.x = block.hitbox.position.x - offset - 0.01;
                                break;
                            }
                        }
                    }
                }
            }
