    }
    calculateXPos(block) {
        let xPos;
        //triangle up
        if (block.direction.y == "up") {
            xPos = this.hitbox.legs.position.x % 36;
            //triangle to left
            if (block.direction.x == "left") {
                xPos = (this.hitbox.legs.position.x + this.hitbox.legs.width) % 36;

                xPos = 36 - xPos;
                if (xPos == 36 || xPos < 1) xPos = 0;
            }
            //triangle to right
            else if (xPos < 1) xPos = 0;

            if (block.shape == "pondTriangle") xPos /= 2;
        }
        //triangle down
        else {
            xPos = this.hitbox.position.x % 36;

            if (block.direction.x == "left") xPos = 36 - xPos;
            else {
                if (xPos == 0) xPos = 36;
                else if (xPos < 1) xPos = 0;
            }
        }
        return xPos;
    }
    //change position for collision in triangle
    triangleChangePosition(block, xPos) {
        //for triangle up
        if (
            block.direction.y == "up" &&
            this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y + xPos
        ) {
            this.isOnBlock = true;
            this.velocity.y = 0;
            const offset = this.hitbox.position.y + this.hitbox.height - this.position.y;
            this.position.y = block.hitbox.position.y + xPos - offset - 0.01;
            if (block.shape == "triangle") {
                if (block.direction.x == "left") this.position.x -= 0.5;
                else this.position.x += 0.5;
            }
        }
        //for triangle down
        else if (
            block.direction.y == "down" &&
            this.hitbox.position.y < block.hitbox.position.y + block.hitbox.height - xPos
        ) {
            const offset = this.hitbox.position.y - this.position.y;
            this.position.y = block.hitbox.position.y + block.hitbox.height - xPos - offset + 0.01;
            this.velocity.y = 0;
        }
    }
    verticalCollision(blocks) {
        for (let i = 0; i < blocks.length; i++) {
            const block = blocks[i];

            if (
                this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
            ) {
                //collision for square
                if (
                    block.shape == "square" ||
                    block.shape == "ramp" ||
                    block.shape == "lever" ||
                    block.shape == "cube"
                ) {
                    //ramp is blocked
                    if (
                        this.isOnRamp &&
                        Math.round(this.hitbox.position.y) <=
                            block.hitbox.position.y + block.hitbox.height &&
                        Math.round(this.hitbox.position.y) >= block.hitbox.position.y
                    ) {
                        this.rampBlocked = true;
                        break;
                    }

                    //player going down legs collision
                    if (
                        this.velocity.y >= 0 &&
                        this.hitbox.legs.position.x <
                            block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width >
                            block.hitbox.position.x &&
                        this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                        this.hitbox.position.y + this.hitbox.height <=
                            block.hitbox.position.y + block.hitbox.height
                    ) {
                        if (block.shape == "button") {
                            block.pressed = true;
                        }
                        if (block.shape == "ramp") {
                            this.isOnRamp = true;
                        }
                        this.isOnBlock = true;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;

                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                    //player going down head collision
                    else if (
                        this.velocity.y > 0 &&
                        this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                            block.hitbox.position.y
                    ) {
                        //player going left
                        if (this.hitbox.position.x <= block.hitbox.position.x) {
                            this.position.x -= 3;
                            this.sliding.left = true;
                        }
                        //player going right
                        else {
                            this.position.x += 3;
                            this.sliding.right = true;
                        }
                        break;
                    }
                    //player going up
                    else if (
                        this.velocity.y < 0 &&
                        this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height &&
                        this.hitbox.position.y >= block.hitbox.position.y
                    ) {
                        this.velocity.y = 0;
                        const offset = this.hitbox.position.y - this.position.y;
                        this.position.y =
                            block.hitbox.position.y + block.hitbox.height - offset + 0.01;
                        //player blocking ramp
                        if (
                            block.shape == "ramp" &&
                            Math.round(this.position.y + offset) ==
                                block.hitbox.position.y + block.hitbox.height
                        ) {
                            block.blocked = true;
                            block.blockedDirection = "down";
                        }
                        break;
                    }
                    //player blocking ramp
                    else if (
                        this.isOnBlock &&
                        block.shape == "ramp" &&
                        Math.round(this.hitbox.position.y) ==
                            block.hitbox.position.y + block.hitbox.height
                    ) {
                        block.blocked = true;
                        block.blockedDirection = "down";

                else if (block.shape == "button") {
                    if (
                        this.hitbox.legs.position.x <
                            block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width >

                    ) {
                        block.pressed = true;

                //collision for ball

                    //player going down legs collision
                    if (

                        this.hitbox.legs.position.x + this.hitbox.legs.width >

                    else if (

                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                    // check collision for triangle up right
                    else if (
                        block.direction.y == "up" &&
                        this.hitbox.legs.position.x >= block.hitbox.position.x &&
                        this.hitbox.legs.position.x < block.hitbox.position.x + block.hitbox.width
                    ) {
                        let xPos = this.calculateXPos(block);

                        this.triangleChangePosition(block, xPos);
                        break;
                    }

                    //check collision for triangle down right
                    else if (
                        block.direction.y == "down" &&
                        this.velocity.y < 0 &&
                        this.hitbox.position.x < block.hitbox.position.x &&
                        this.hitbox.position.x + this.hitbox.width >= block.hitbox.position.x &&
                        this.hitbox.position.y < block.hitbox.position.y + block.hitbox.height &&
                        this.hitbox.position.y > block.hitbox.position.y
                    ) {
                        this.velocity.y = 0;
                        const offset = this.hitbox.position.y - this.position.y;
                        this.position.y =
                            block.hitbox.position.y + block.hitbox.height - offset + 0.01;
                        break;
                    }

                    //check collision for triangle down right
                    else if (
                        block.direction.y == "down" &&
                        this.velocity.y < 0 &&
                        this.hitbox.position.x < block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.y > block.hitbox.position.y
                    ) {
                        let xPos = this.calculateXPos(block);

                        this.triangleChangePosition(block, xPos);
                        break;
                    }
                    //player going down to triangle down
                    else if (
                        block.direction.y == "down" &&
                        this.velocity.y >= 0 &&
                        this.hitbox.legs.position.x <
                            block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width >
                            block.hitbox.position.x &&
                        this.hitbox.position.y + this.hitbox.height >= block.hitbox.position.y &&
                        this.hitbox.position.y + this.hitbox.height <=
                            block.hitbox.position.y + block.hitbox.height
                    ) {
                        this.isOnBlock = true;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;

                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                    //player going down head collision
                    else if (
                        this.velocity.y > 0 &&
                        this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                            block.hitbox.position.y &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width <
                            block.hitbox.position.x
                    ) {
                        this.position.x -= 3;
                        this.sliding.left = true;
                        break;
                    }
                    //player going down head collision
                    else if (block.direction.y == "up" && this.velocity.y > 0) {
                        let myBlock = {
                            direction: {
                                x: block.direction.x,
                                y: "down",
                            },
                        };
                        let xPos = this.calculateXPos(myBlock);
                        if (
                            this.hitbox.position.y + this.hitbox.height - this.hitbox.legs.height >=
                            block.hitbox.position.y + xPos
                        ) {
                            this.position.x++;
                            this.sliding.right = true;
                            break;
                        }
                    }
                    if (
                        block.shape == "pondTriangle" &&
                        this.velocity.y > 0 &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width >=
                            block.hitbox.position.x &&
                        this.hitbox.legs.position.x + this.hitbox.legs.width <=
                            block.hitbox.position.x + block.hitbox.width
                    ) {
                        this.isOnBlock = true;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;

                        this.velocity.y = 0;
                        this.position.y = block.hitbox.position.y - offset - 0.01;
                        break;
                    }
                }
                //collision for pond
                else if (block.shape == "pond") {
                    //check pond
                    if (
                        this.element != block.element &&
                        this.hitbox.position.y + this.hitbox.height >=
                            block.hitbox.position.y + 10 &&
                        this.hitbox.position.y + this.hitbox.height <=
                            block.hitbox.position.y + block.hitbox.height
                    ) {
                        //end
                        this.died = true;
                        break;
                    }

                    //player going down
                    if (
                        this.hitbox.legs.position.x <=
                            block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.legs.position.x >= block.hitbox.position.x &&
                        this.hitbox.position.y + this.hitbox.height >=
                            block.hitbox.position.y + block.hitbox.height / 2 &&
                        this.hitbox.position.y + this.hitbox.height <=
                            block.hitbox.position.y + block.hitbox.height &&
                        !(
                            blocks[i + 1] &&
                            blocks[i + 1].shape == "pondTriangle" &&
                            this.hitbox.legs.position.x + this.hitbox.legs.width >
                                blocks[i + 1].hitbox.position.x
                        )
                    ) {
                        this.isOnBlock = true;
                        this.velocity.y = 0;
                        const offset =
                            this.hitbox.position.y + this.hitbox.height - this.position.y;

                        this.position.y =
                            block.hitbox.position.y - offset - 0.01 + block.hitbox.height / 2;
                        break;
                    }
                    //player going up
                    else if (
                        this.hitbox.position.x <= block.hitbox.position.x + block.hitbox.width &&
                        this.hitbox.position.x >= block.hitbox.position.x &&
                        this.hitbox.position.y >=
                            block.hitbox.position.y + block.hitbox.height / 2 &&
                        this.hitbox.position.y <= block.hitbox.position.y + block.hitbox.height
                    ) {
                        this.velocity.y = 0;
                        const offset = this.hitbox.position.y - this.position.y;
                        this.position.y =
                            block.hitbox.position.y + block.hitbox.height - offset + 0.01;
                        break;
                    }
                }
            }
        }
    }
}

let touchControlsBuilt = false;
// Mobil/dokunmatik kontroller: ekran butonları mevcut klavye mantığını yeniden kullanmak için
// sentetik ok-tuşu olayları yayınlar (host=ateş, guest=buz; keydown'daki isMyPlayer filtresi aynen geçerli).
// Yalnızca dokunmatik cihazlarda görünür (CSS @media (pointer: coarse)).
function setupTouchControls() {
    if (touchControlsBuilt) return;
    touchControlsBuilt = true;
    const fire = (type, key) => window.dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
    const mk = (label, key) => {
        const b = document.createElement("button");
        b.className = "ab-touch-btn";
        b.textContent = label;
        b.setAttribute("aria-label", key);
        const down = (e) => { e.preventDefault(); e.stopPropagation(); if (b.dataset.on) return; b.dataset.on = "1"; b.classList.add("active"); fire("keydown", key); };
        const up = (e) => { e.preventDefault(); e.stopPropagation(); if (!b.dataset.on) return; delete b.dataset.on; b.classList.remove("active"); fire("keyup", key); };
        b.addEventListener("pointerdown", down);
        b.addEventListener("pointerup", up);
        b.addEventListener("pointercancel", up);
        b.addEventListener("pointerleave", up);
        b.addEventListener("contextmenu", (e) => e.preventDefault());
        return b;
    };
    const wrap = document.createElement("div");
    wrap.className = "ab-touch";
    // Fabrika build (yerel 2P): sol küme = Ateş (ok tuşları, kırmızı),
    // sağ küme = Su (a/d/w, mavi) — iki çocuk tek tableti paylaşabilir.
    const mkSide = (cls, defs) => {
        const side = document.createElement("div");
        side.className = "ab-touch-side";
        defs.forEach(([label, key]) => {
            const b = mk(label, key);
            b.classList.add(cls);
            side.appendChild(b);
        });
        return side;
    };
    wrap.appendChild(mkSide("fire", [["◀", "ArrowLeft"], ["▲", "ArrowUp"], ["▶", "ArrowRight"]]));
    wrap.appendChild(mkSide("ice", [["◀", "a"], ["▲", "w"], ["▶", "d"]]));
    document.body.appendChild(wrap);
}

function playGame() {
    drawMenu();
    setupTouchControls();

    let now;
    let delta;
    let fixedFps = 60;
    let interval = 1000 / fixedFps;
    let then = Date.now();

    let time;

    function animation() {
        now = Date.now();
        delta = now - then;

        if (delta > interval) {
            then = now - (delta % interval);

            // __AB DEBUG (geçici): manuel kare-adımlamada gerçek döngü karışmasın diye duraklat
            if (window.__AB_PAUSE) { requestAnimationFrame(animation); return; }

            // Tek bir kare içindeki beklenmedik istisna TÜM döngüyü kalıcı durdurup oyunu
            // dondurmasın (ve tuşları ölü göstermesin) diye kareyi try/catch'e al. Hata loglanır,
            // döngü en alttaki requestAnimationFrame ile devam eder. (Kasıtlı 'return'ler etkilenmez.)
            try {

            // ── Host-authoritative: guest uzak state'i her frame uygular ──
            if (isOnline() && getMyRole() === 'guest' && latestHostState) {
                applyHostState(latestHostState);
            }
            // ── Host-authoritative: host guest input'unu kendi water karakterine uygular ──
            if (isOnline() && getMyRole() === 'host') {
                const water = allPlayers.find(p => p.element === 'water');
                if (water) {
                    // Jump edge detection: up becomes true → velocity y impulse
                    if (latestGuestInput.up && !water.keys.pressed.up) {
                        if (water.isOnBlock && !water.rampBlocked) {
                            water.velocity.y = JUMP_VELOCITY;
                        }
                    }
                    water.keys.pressed.left = !!latestGuestInput.left;
                    water.keys.pressed.right = !!latestGuestInput.right;
                    water.keys.pressed.up = !!latestGuestInput.up;
                }
            }

            background.draw();

            // Guest: diamond check yapma — host belirliyor
            if (!(isOnline() && getMyRole() === 'guest')) {
                allPlayers.forEach((player) => {
                    player.checkDiamonds();
                });
            }

            allDiamonds.forEach((diamond) => {
                diamond.draw();
            });

            const isGuestMode = isOnline() && getMyRole() === 'guest';
            for (const buttons of allButtons) {
                let movedRamp = false;
                for (const button of buttons) {
                    if (button.pressed) {
                        if (button.position.y == button.finalPosition.y) {
                            // Guest: host belirliyor, standing check yapma
                            if (!isGuestMode) {
                                let standingOnButton = false;
                                allPlayers.forEach((player) => {
                                    if (button.checkStandingOnButton(player, player.hitbox.legs)) {
                                        standingOnButton = true;
                                    }
                                });
                                allCubes.forEach((cube) => {
                                    if (button.checkStandingOnButton(cube, cube.hitbox)) {
                                        standingOnButton = true;
                                    }
                                });
                                allBalls.forEach((ball) => {
                                    if (button.checkStandingOnButton(ball, ball.hitbox)) {
                                        standingOnButton = true;
                                    }
                                });
                                if (!standingOnButton) {
                                    button.pressed = false;
                                    button.move("up");
                                }
                            }
                        } else {
                            button.move("down");
                        }
                    } else {
                        if (button.position.y != button.startPosition.y) {
                            button.move("up");
                        }
                    }

                    button.fillColor();
                    button.draw();
                    // Guest: ramp host'tan sync, lokal move yapma (sadece draw)
                    if (button.pressed && !movedRamp) {
                        movedRamp = true;
                        if (!isGuestMode) button.run();
                        else button.ramp.draw(button.pressed);
                    }
                }
                if (!movedRamp) {
                    if (!isGuestMode) buttons[0].run();
                    else buttons[0].ramp.draw(false);
                }
            }

            allCubes.forEach((cube) => {
                cube.draw();
                // Online'da küp sadece host tarafında fizik hesaplar; guest sync'ten pozisyonu alır
                if (!isOnline() || getMyRole() === 'host') {
                    cube.update();
                    if (cube.rampBlocked) {
                        allAssets.forEach((asset) => {
                            if (
                                asset.hitbox.position.y ==
                                Math.round(cube.hitbox.position.y + cube.hitbox.height)
                            ) {
                                asset.blocked = true;
                                asset.blockedDirection = "up";
                            }
                        });
                    }
                }
            });

            allLevers.forEach((lever) => {
                if (!isGuestMode) lever.run();
                else lever.ramp.draw(lever.pressed);
            });

            allDoors.forEach((door) => {
                door.draw();
                door.pressed = false;
            });

            allBalls.forEach((ball) => {
                ball.draw();
                // Online'da ball sadece host tarafında fizik; guest sync'ten pozisyon alır
                if (!isOnline() || getMyRole() === 'host') {
                    ball.update();
                }
            });

            allBridges.forEach((bridge) => {
                bridge.drawChain();
                bridge.draw();
            });

            bgBlocks.draw();
            // collisionBlocks.forEach((collisionBlock) => {
            //     collisionBlock.draw();
            // });

            allLevers.forEach((lever) => {
                // checkAngle: guest'te de çalışsın ki lever.pressed angle'dan türetilsin (rampa hareketi için)
                // Host'un broadcast'i her frame angle'ı overwrite eder — drift sorunu olmaz
                lever.checkAngle();
                lever.drawLever();
            });

            allPlayers.forEach((player) => {
                // Guest mode: her iki karakter için de fizik çalıştırma, sadece çiz
                if (isGuestMode) {
                    player.legs.position = {
                        x: player.position.x + 37,
                        y: player.position.y + 72,
                    };
                    player.hitboxPositionCalc();
                    // Animasyon state'i host'tan gelen anim'a göre ayarlandı
                    player.draw();
                    player.legs.draw();
                    return;
                }
                // Host / offline mode: uzak oyuncu var mı? (Host kendi + guest su'yu simüle ediyor — iki de local)
                if (false && isOnline() && !isMyPlayer(player)) {
                    // Remote pozisyon zaten listener'da set edildi. Sadece hitbox ve legs pozisyonunu güncelle.
                    player.legs.position = {
                        x: player.position.x + 37,
                        y: player.position.y + 72,
                    };
                    player.hitboxPositionCalc();
                    player.draw();
                    player.legs.draw();
                    player.checkDoors();
                    return;
                }

                if (player.keys.pressed.left) {
                    player.velocity.x = -MOVE_SPEED;
                    player.changeSprite("left");
                } else if (player.keys.pressed.right) {
                    player.velocity.x = MOVE_SPEED;
                    player.changeSprite("right");
                } else {
                    player.velocity.x = 0;
                    if (player.velocity.y < -1.5) {
                        player.changeSprite("up");
                    } else if (player.velocity.y > 1.5) {
                        player.changeSprite("down");
                    } else {
                        player.changeSprite("idle");
                    }
                }

                player.draw();
                player.legs.draw();
                player.update();

                if (player.rampBlocked) {
                    allAssets.forEach((asset) => {
                        if (
                            asset.hitbox.position.y ==
                            Math.round(player.hitbox.position.y + player.hitbox.height)
                        ) {
                            asset.blocked = true;
                            asset.blockedDirection = "up";
                        }
                    });
                }

                player.checkDoors();

                if (player.died) {
                    died = true;
                }

            });

            ponds.forEach((pond) => {
                pond.draw();
            });

            // ── Host-authoritative broadcast ──
            if (isOnline()) {
                if (getMyRole() === 'host') {
                    // Host tam state yayınlar
                    const buttonStates = [];
                    for (const group of allButtons) {
                        for (const btn of group) buttonStates.push(btn.pressed ? 1 : 0);
                    }
                    const fire = allPlayers.find(p => p.element === 'fire');
                    const water = allPlayers.find(p => p.element === 'water');
                    const fireDoor = allDoors.find(d => d.element === 'fire');
                    const waterDoor = allDoors.find(d => d.element === 'water');
                    broadcastFullState({
                        levelIdx: currentLevel,
                        fire: fire ? {
                            x: Math.round(fire.position.x), y: Math.round(fire.position.y),
                            vx: Math.round(fire.velocity.x * 10) / 10,
                            vy: Math.round(fire.velocity.y * 10) / 10,
                            anim: fire.currentAnimation || 'idle',
                            died: fire.died ? 1 : 0,
                        } : null,
                        water: water ? {
                            x: Math.round(water.position.x), y: Math.round(water.position.y),
                            vx: Math.round(water.velocity.x * 10) / 10,
                            vy: Math.round(water.velocity.y * 10) / 10,
                            anim: water.currentAnimation || 'idle',
                            died: water.died ? 1 : 0,
                        } : null,
                        buttons: buttonStates,
                        levers: allLevers.map(l => Math.round(l.angle * 1000) / 1000),
                        cubes: allCubes.map(c => ({
                            x: Math.round(c.position.x), y: Math.round(c.position.y),
                        })),
                        balls: allBalls.map(b => ({
                            x: Math.round(b.position.x), y: Math.round(b.position.y),
                            a: Math.round((b.angle || 0) * 100) / 100,
                        })),
                        ramps: allRamps.map(r => ({
                            x: Math.round(r.position.x), y: Math.round(r.position.y),
                        })),
                        diamondsCollected: allDiamonds.map(d => d.collected ? 1 : 0),
                        doorFire: fireDoor ? { pressed: fireDoor.pressed ? 1 : 0, frame: fireDoor.currentFrame || 0, opened: fireDoor.opened ? 1 : 0 } : null,
                        doorWater: waterDoor ? { pressed: waterDoor.pressed ? 1 : 0, frame: waterDoor.currentFrame || 0, opened: waterDoor.opened ? 1 : 0 } : null,
                        time: (now - startedTime - pausedTime),
                    });
                } else if (getMyRole() === 'guest') {
                    // Guest kendi keys.pressed'ini host'a gönderir (water karakterinin keys'i)
                    const water = allPlayers.find(p => p.element === 'water');
                    if (water) broadcastGuestInput(water.keys.pressed);
                }
            }

            //time calc
            time = now - startedTime - pausedTime;
            const formatedTime = formatTime(time);
            drawTime(formatedTime.minutes, formatedTime.seconds);

            //both doors opened — sadece host level geçişini tetikler; guest host'un state'inden yeni level'ı alır
            const amHostOrOffline = !isOnline() || getMyRole() === 'host';
            if (amHostOrOffline && !levelCompleted && allDoors[0].opened == true && allDoors[1].opened == true) {
                setLevelCompleted(true);
                levelTime.minutes = formatedTime.minutes;
                levelTime.seconds = formatedTime.seconds;
                playersDissapearing();
                return;
            }

            pauseButton.draw();

            if (died) {
                // Online: GAME OVER göstermek yerine lokal respawn yap (her oyuncu kendi başlangıç konumuna)
                if (isOnline()) {
                    allPlayers.forEach((p) => {
                        if (p.died) {
                            const playerKey = p.element === 'fire' ? 'fireboy' : 'watergirl';
                            const data = gameData.players[playerKey];
                            const startPos = data && data[currentLevel] && data[currentLevel].position;
                            if (startPos) {
                                p.position.x = startPos.x;
                                p.position.y = startPos.y;
                            }
                            p.velocity.x = 0;
                            p.velocity.y = 0;
                            p.died = false;
                            p.isOnBlock = false;
                            for (const k in p.keys.pressed) p.keys.pressed[k] = false;
                        }
                    });
                    died = false;
                } else {
                    setMenuActive("lost");
                    drawMenuAnimation(menuActive, "up");
                    return;
                }
            } else if (pauseGame) {
                setMenuActive("paused");
                drawMenuAnimation(menuActive, "up");
                return;
            }

            } catch (e) { console.error('[Ateş&Buz] kare hatası (döngü devam ediyor):', e); }
        }
        requestAnimationFrame(animation);
    }

    function drawAll() {
        background.draw();
        allDiamonds.forEach((diamond) => {
            diamond.draw();
        });
        allButtons.forEach((buttonGroup) => {
            buttonGroup.forEach((button) => {
                button.fillColor();
                button.draw();
                button.ramp.draw(button.pressed);
            });
        });
        allCubes.forEach((cube) => {
            cube.draw();
        });
        allLevers.forEach((lever) => {
            lever.ramp.draw();
        });
        allBridges.forEach((bridge) => {
            bridge.drawChain();
            bridge.draw();
        });
        allDoors.forEach((door) => {
            door.draw();
        });
        allBalls.forEach((ball) => {
            ball.draw();
        });
        bgBlocks.draw();
        // collisionBlocks.forEach((collisionBlock) => {
        //     collisionBlock.draw();
        // });
        allLevers.forEach((lever) => {
            lever.drawLever();
        });
        allPlayers.forEach((player) => {
            player.draw();
            player.legs.draw();
        });
        ponds.forEach((pond) => {
            pond.draw();
        });
        const formatedTime = formatTime(time);
        drawTime(formatedTime.minutes, formatedTime.seconds);
        pauseButton.draw();
    }

    function playersDissapearing() {
        let opacity = 1;
        const dissapearing = setInterval(() => {
            opacity -= 0.05;
            if (opacity <= 0) {
                opacity = 0;
                clearInterval(dissapearing);

                let questCount = 0;
                menuLevels[currentLevel].quests.forEach((quest) => {
                    quest.setVariable();
                    quest.check();
                    if (quest.completed) {
                        if (menuLevels[currentLevel].quests.length == 1) {
                            questCount += 2;
                        } else {
                            questCount++;
                        }
                    }
                });
                if (questCount > menuLevels[currentLevel].questsStatus) {
                    menuLevels[currentLevel].setQuestsStatus(questCount);
                }

                menuLevels[currentLevel].levelsUnlocking.forEach((index) => {
                    menuLevels[index].unlocked = true;
                });
                menuLevels[currentLevel].pathUnlocking.forEach((index) => {
                    menuLevelsPath[index].unlocked = true;
                });

                saveDataToLocalStorage();

                // Online modda "won" menüsünü atla; host otomatik sonraki seviyeye geçer,
                // guest host'tan gelen yeni level'ı uygular.
                if (isOnline()) {
                    if (getMyRole() === 'host') {
                        const nextLevel = currentLevel + 1;
                        if (nextLevel <= Object.keys(levels).length) {
                            setCurrentLevel(nextLevel);
                            setLevelCompleted(false);
                            setMenuActive(null);
                            startGame();
                            animation();
                        } else {
                            // Tüm seviyeler tamam
                            setMenuActive("won");
                            drawMenuAnimation(menuActive, "up");
                        }
                    }
                    // Guest: yeni level hostState.levelIdx ile gelecek — animation loop tekrar başlatılmayacak;
                    // applyHostState level değişimini algılayıp reload yapacak.
                    return;
                }

                setMenuActive("won");
                drawMenuAnimation(menuActive, "up");
            }
            allDoors.forEach((door) => {
                door.draw();
            });
            allPlayers.forEach((player) => {
                player.opacity = opacity;
                player.draw();
                player.legs.opacity = opacity;
                player.legs.draw();
            });
        }, 50);
    }

    function drawMenuAnimation(menuName, direction) {
        let transform = 1000;
        let value = 10;
        if (direction == "down") {
            transform = 0;
            value = -10;
        }
        const endTransform = Math.abs(transform - 1000);

        const menuAnimation = setInterval(() => {
            drawAll();

            transform -= value;
            drawInGameMenu(menuName, transform);
            if (transform == endTransform) {
                clearInterval(menuAnimation);
                if (direction == "down") {
                    animation();
                    setContinueAnimation(false);
                }
            }
        }, 1);
    }

    canvas.onmousedown = (event) => {
        if (menuButtonPressed) return;

        const mousePos = getMousePos(event);

        for (const menuButton in menuButtons[menuActive]) {
            if (checkButtonCollision(mousePos, menuButtons[menuActive][menuButton])) {
                menuButtonPressed = menuButton;
                menuButtons[menuActive][menuButton].scaleDown();
                menuButtons[menuActive][menuButton].draw();
            }
        }
    };

    canvas.onmouseup = (event) => {
        const mousePos = getMousePos(event);

        if (!menuActive) {
            if (checkButtonCollision(mousePos, pauseButton)) {
                pauseGame = true;
                allPlayers.forEach((player) => {
                    for (const key in player.keys.pressed) {
                        player.keys.pressed[key] = false;
                    }
                });
                pausedStartTime = Date.now();
            }
            return;
        }

        if (menuActive == "mainMenu") {
            for (const index in menuLevels) {
                if (checkMenuDiamondsCollision(mousePos, menuLevels[index])) {
                    setCurrentLevel(index);
                    setMenuActive(null);
                    startGame();
                    animation();
                }
            }
        }

        for (const menuButton in menuButtons[menuActive]) {
            if (
                checkButtonCollision(mousePos, menuButtons[menuActive][menuButton]) &&
                menuButtonPressed == menuButton
            ) {
                menuButtons[menuActive][menuButton].resetSize();
                menuButtons[menuActive][menuButton].draw();

                setTimeout(() => {
                    if (!menuActive) return;

                    menuButtons[menuActive][menuButton].run();
                    pauseGame = false;

                    if (continueAnimation) {
                        drawMenuAnimation(menuActive, "down");
                        pausedTime += Date.now() - pausedStartTime;
                    }
                    if (endGame) {
                        setEndGame(false);
                        startGame();
                        animation();
                    }
                    if (menuActive != "mainMenu") {
                        setMenuActive(null);
                    }
                    menuButtonPressed = null;
                }, 200);
                return;
            }
        }

        if (menuButtonPressed) {
            menuButtons[menuActive][menuButtonPressed].resetSize();
            menuButtons[menuActive][menuButtonPressed].draw();
            menuButtonPressed = null;
        }
    };

    // Online modda: host sadece fire'ı, guest sadece water'ı kontrol eder
    function isMyPlayer(player) {
        if (!isOnline()) return true;
        const role = getMyRole();
        if (role === 'host' && player.element === 'fire') return true;
        if (role === 'guest' && player.element === 'water') return true;
        return false;
    }

    window.addEventListener("keydown", (event) => {
        if (pauseGame) return;
        allPlayers.forEach((player) => {
            if (!isMyPlayer(player)) return;
            switch (event.key) {
                case player.keys.up:
                    if (isOnline() && getMyRole() === 'guest') {
                        // Guest: fizik yerel çalışmıyor; sadece key kaydet, host karar verir
                        player.keys.pressed.up = true;
                    } else if (player.isOnBlock && !player.keys.pressed.up && !player.rampBlocked) {
                        player.velocity.y = JUMP_VELOCITY;
                        player.keys.pressed.up = true;
                    }
                    break;
                case player.keys.left:
                    player.keys.pressed.left = true;
                    break;
                case player.keys.right:
                    player.keys.pressed.right = true;
                    break;
            }
        });
    });

    window.addEventListener("keyup", (event) => {
        if (pauseGame) return;

        allPlayers.forEach((player) => {
            if (!isMyPlayer(player)) return;
            switch (event.key) {
                case player.keys.up:
                    player.keys.pressed.up = false;
                    break;
                case player.keys.left:
                    player.keys.pressed.left = false;
                    break;
                case player.keys.right:
                    player.keys.pressed.right = false;
                    break;
            }
        });
    });

    document.addEventListener("visibilitychange", () => {
        allPlayers.forEach((player) => {
            for (const key in player.keys.pressed) {
                player.keys.pressed[key] = false;
            }
        });
    });

    document.addEventListener("contextmenu", () => {
        allPlayers.forEach((player) => {
            for (const key in player.keys.pressed) {
                player.keys.pressed[key] = false;
            }
        });
    });

    // ── Host-authoritative state uygulama (guest tarafı) ──────────
    function applyHostState(st) {
        if (!st) return;
        // Level değişimi: host yeni seviyeye geçtiyse guest de yüklesin
        if (typeof st.levelIdx === 'number' && st.levelIdx !== currentLevel && st.levelIdx >= 1 && st.levelIdx <= Object.keys(levels).length) {
            setCurrentLevel(st.levelIdx);
            setLevelCompleted(false);
            setMenuActive(null);
            startGame();
            return; // yeni level yüklendi, bu frame için state uygulamayı atla
        }
        // Oyuncular
        const fire = allPlayers.find(p => p.element === 'fire');
        const water = allPlayers.find(p => p.element === 'water');
        if (fire && st.fire) {
            fire.position.x = st.fire.x;
            fire.position.y = st.fire.y;
            fire.velocity.x = st.fire.vx || 0;
            fire.velocity.y = st.fire.vy || 0;
            fire.died = !!st.fire.died;
            if (st.fire.anim) try { fire.changeSprite(st.fire.anim); } catch (e) {}
        }
        if (water && st.water) {
            water.position.x = st.water.x;
            water.position.y = st.water.y;
            water.velocity.x = st.water.vx || 0;
            water.velocity.y = st.water.vy || 0;
            water.died = !!st.water.died;
            if (st.water.anim) try { water.changeSprite(st.water.anim); } catch (e) {}
        }
        // Butonlar
        if (Array.isArray(st.buttons)) {
            let idx = 0;
            for (const group of allButtons) {
                for (const btn of group) {
                    btn.pressed = st.buttons[idx] === 1;
                    idx++;
                }
            }
        }
        // Levyeler
        if (Array.isArray(st.levers)) {
            st.levers.forEach((angle, i) => {
                if (allLevers[i] && typeof angle === 'number') allLevers[i].angle = angle;
            });
        }
        // Küpler
        if (Array.isArray(st.cubes)) {
            st.cubes.forEach((s, i) => {
                if (allCubes[i] && s) {
                    allCubes[i].position.x = s.x;
                    allCubes[i].position.y = s.y;
                }
            });
        }
        // Toplar
        if (Array.isArray(st.balls)) {
            st.balls.forEach((s, i) => {
                if (allBalls[i] && s) {
                    allBalls[i].position.x = s.x;
                    allBalls[i].position.y = s.y;
                    if (typeof s.a === 'number') allBalls[i].angle = s.a;
                }
            });
        }
        // Rampalar
        if (Array.isArray(st.ramps)) {
            st.ramps.forEach((s, i) => {
                if (allRamps[i] && s) {
                    const dx = s.x - allRamps[i].position.x;
                    const dy = s.y - allRamps[i].position.y;
                    if (dx !== 0 || dy !== 0) {
                        // Rampa parçalarıyla birlikte tüm child'ları kaydır
                        allRamps[i].position.x = s.x;
                        allRamps[i].position.y = s.y;
                        allRamps[i].hitbox.position.x += dx;
                        allRamps[i].hitbox.position.y += dy;
                        if (allRamps[i].ramps) {
                            allRamps[i].ramps.forEach(r => {
                                r.position.x += dx;
                                r.position.y += dy;
                            });
                        }
                    }
                }
            });
        }
        // Elmaslar
        if (Array.isArray(st.diamondsCollected)) {
            st.diamondsCollected.forEach((c, i) => {
                if (allDiamonds[i]) allDiamonds[i].collected = (c === 1);
            });
        }
        // Kapılar
        const fireDoor = allDoors.find(d => d.element === 'fire');
        const waterDoor = allDoors.find(d => d.element === 'water');
        if (fireDoor && st.doorFire) {
            fireDoor.pressed = !!st.doorFire.pressed;
            if (typeof st.doorFire.frame === 'number') fireDoor.currentFrame = st.doorFire.frame;
            fireDoor.opened = !!st.doorFire.opened;
        }
        if (waterDoor && st.doorWater) {
            waterDoor.pressed = !!st.doorWater.pressed;
            if (typeof st.doorWater.frame === 'number') waterDoor.currentFrame = st.doorWater.frame;
            waterDoor.opened = !!st.doorWater.opened;
        }
    }

    // ── Online mode kurulumu (host-authoritative) ─────────────────
    if (isOnline()) {
        // Guest: host'tan tam state al
        setOnHostState((state) => {
            latestHostState = state;
        });
        // Host: guest input'unu al
        setOnGuestInput((input) => {
            latestGuestInput = {
                left: !!(input && input.left),
                right: !!(input && input.right),
                up: !!(input && input.up),
            };
        });

        let abDiscOverlay = null;
        setOnOpponentLeft(() => {
            setContinueAnimation(false);
            if (abDiscOverlay) return; // zaten gösteriliyor
            abDiscOverlay = document.createElement('div');
            abDiscOverlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;color:#fff;font-size:22px;font-family:sans-serif;text-align:center;padding:20px;';
            abDiscOverlay.textContent = 'Rakip bağlantısı kesildi. Yeniden bağlanması bekleniyor…';
            document.body.appendChild(abDiscOverlay);
        });
        // Rakip grace sonrası geri gelirse: ekranı kaldır ve oyuna devam et.
        setOnOpponentReturned(() => {
            if (abDiscOverlay) { abDiscOverlay.remove(); abDiscOverlay = null; }
            setContinueAnimation(true);
        });

        // Auto-start: level 1'den başla, menüyü atla
        setCurrentLevel(1);
        setMenuActive(null);
        startGame();
        animation();
    }

    // === __AB DEBUG (geçici test kancası — commit'ten önce kaldırılacak) ===
    window.__AB = {
        load(n) {
            setCurrentLevel(n); setMenuActive(null); setLevelCompleted(false);
            window.__AB_PAUSE = true; startGame(); animation(); window.__AB.sync(); return window.__AB.snap();
        },
        sync() {
            const A = window.__AB;
            A.players = allPlayers; A.cubes = allCubes; A.buttons = allButtons; A.levers = allLevers;
            A.ramps = allRamps; A.balls = allBalls; A.bridges = allBridges; A.doors = allDoors;
            A.diamonds = allDiamonds; A.assets = allAssets; A.collisionBlocks = collisionBlocks; A.ponds = ponds;
            A.JUMP_VELOCITY = JUMP_VELOCITY; A.MOVE_SPEED = MOVE_SPEED;
        },
        snap() {
            const p = {};
            allPlayers.forEach((pl) => { p[pl.element] = { x:Math.round(pl.position.x), y:Math.round(pl.position.y), hx:Math.round(pl.hitbox.position.x), hy:Math.round(pl.hitbox.position.y), onBlock:pl.isOnBlock, died:pl.died }; });
            return {
                level: currentLevel, players: p,
                doors: allDoors.map((d) => ({ el:d.element, pressed:d.pressed, opened:d.opened })),
                diamonds: allDiamonds.map((d) => ({ x:Math.round(d.position.x), y:Math.round(d.position.y), collected:d.collected, type:d.type })),
                ramps: allRamps.map((r) => ({ x:Math.round(r.position.x), y:Math.round(r.position.y) })),
            };
        },
    };
}

    if (window.__AB_STARTED) return;
    window.__AB_STARTED = true;

    await loadData();
    loadDataFromLocalStorage();

    initNetwork();   // stub: her zaman false (çevrimdışı yerel mod)
