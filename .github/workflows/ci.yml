# CI — her pull request'te lint + hash'li build kontrolü + duman testi (A10a/A10b).
# Bu iş master branch protection'da "required check"tir (A10b) → kırmızıyken merge edilemez.
# Duman testi hash'li build ÇIKTISI (.build-check) üzerinde koşar: Vercel'in yayınladığı şey test edilir.
name: CI

on:
  pull_request:

# Aynı PR'a yeni push gelince eski koşuyu iptal et (runner dakikası + hız).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: eslint + Playwright duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint (no-undef = hata, no-unused-vars = uyarı)
        run: npm run lint

      # data/games.json TEK KAYNAK (B2a): üretilmişler commit'lenmiş hâliyle aynı olmalı.
      # 1) js/catalog.js + index.html altbilgisi (tools/build-catalog.js --check: şema + fark)
      # 2) oyunlar/, sitemap.xml, llms.txt (seo/build_seo.py). lastmod/dateModified satırları git tarihine
      #    bağlıdır (render_fresh) ve sığ checkout'ta farklı çıkar → -I ile yok sayılır; içerik farkı kırmızı.
      # Fark varsa PR'da `npm run catalog` + `python seo/build_seo.py` çalıştırılıp commit edilir.
      - name: Katalog üretimi güncel mi (data/games.json → js/catalog.js + index.html)
        run: npm run catalog:check

      - name: SRI denetimi (index.html/admin.html dış script integrity)
        run: npm run sri:check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SEO üretimi güncel mi (data/games.json → oyunlar/, sitemap.xml, llms.txt)
        run: |
          python seo/test_build_seo.py
          python seo/build_seo.py
          git diff --exit-code -I '<lastmod>' -I '"dateModified"' -- oyunlar sitemap.xml llms.txt index.html

      # tools/build.js birim testleri (tarayıcısız) + deploy simülasyonu: kök .build-check'e
      # kopyalanır, her yerel js/css/html başvurusu ?h=<hash> alır, çıktı doğrulanır (--check).
      - name: Hash'li build (deploy simülasyonu) + doğrulama
        run: |
          npm run test:build
          npm run build:check

      - name: Duman testi — hash'li çıktı üzerinde (tüm aktif oyunlar, admin.html, oyunlar/index.html)
        run: npm run test:smoke
        env:
          CI: true
          SITE_ROOT: .build-check

      # İstemci tarafı temizlikçi (js/janitor.js): sahte db ile — canlı RTDB'ye dokunmaz.
      - name: Temizlikçi testi — hash'li çıktı üzerinde
        run: npm run test:janitor
        env:
          CI: true
          SITE_ROOT: .build-check

      # Kırmızı koşuda adli kayıt: trace (ilk retry), ekran görüntüsü, video, error-context.md
      - name: Hata artefaktları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
