<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="zoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2566"/>
      <stop offset="1" stop-color="#160c2e"/>
    </linearGradient>
    <linearGradient id="zoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#zoBg)"/>
  <!-- zindan parıltısı -->
  <circle cx="50" cy="48" r="30" fill="#b06bff" opacity="0.13"/>
  <!-- Yay gövdesi (altın eğri) -->
  <path d="M30 14 Q13 48 30 82" fill="none" stroke="url(#zoGold)" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 14 Q13 48 30 82" fill="none" stroke="#fff3cf" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <!-- Gerili kiriş (V) -->
  <path d="M30 14 L52 48 L30 82" fill="none" stroke="#e8e0ff" stroke-width="2" stroke-linejoin="round" opacity="0.85"/>
  <!-- Ok gövdesi -->
  <line x1="22" y1="48" x2="72" y2="48" stroke="url(#zoGold)" stroke-width="4" stroke-linecap="round"/>
  <!-- Ok başı (sağ) -->
  <path d="M84 48 L70 41 L73 48 L70 55 Z" fill="url(#zoGold)" stroke="#7a4a12" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Ok tüyleri (sol, cyan aksan) -->
  <g stroke="#4fe3ff" stroke-width="2.6" stroke-linecap="round">
    <line x1="26" y1="48" x2="19" y2="42"/>
    <line x1="26" y1="48" x2="19" y2="54"/>
    <line x1="31" y1="48" x2="24" y2="42"/>
    <line x1="31" y1="48" x2="24" y2="54"/>
  </g>
</svg>
