<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="skbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a55a6"/>
      <stop offset="100%" stop-color="#3a2f63"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#skbg)"/>
  <!-- yelpaze hâlinde dört renk kart (özgün) -->
  <g stroke="#ffffff" stroke-width="2.5">
    <!-- kırmızı -->
    <g transform="rotate(-26 64 104)"><g transform="translate(49 40)">
      <rect x="0" y="0" width="30" height="46" rx="6" fill="#e23b34"/>
      <ellipse cx="15" cy="23" rx="11" ry="16" fill="#ffffff" stroke="none" transform="rotate(-20 15 23)"/>
      <text x="15" y="30" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="20" fill="#e23b34" stroke="none">7</text>
    </g></g>
    <!-- sarı -->
    <g transform="rotate(-9 64 104)"><g transform="translate(49 36)">
      <rect x="0" y="0" width="30" height="46" rx="6" fill="#f4c20d"/>
      <ellipse cx="15" cy="23" rx="11" ry="16" fill="#ffffff" stroke="none" transform="rotate(-20 15 23)"/>
      <text x="15" y="30" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="20" fill="#b8860b" stroke="none">4</text>
    </g></g>
    <!-- yeşil -->
    <g transform="rotate(9 64 104)"><g transform="translate(49 36)">
      <rect x="0" y="0" width="30" height="46" rx="6" fill="#36b44a"/>
      <ellipse cx="15" cy="23" rx="11" ry="16" fill="#ffffff" stroke="none" transform="rotate(-20 15 23)"/>
      <text x="15" y="30" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="20" fill="#36b44a" stroke="none">2</text>
    </g></g>
    <!-- mavi -->
    <g transform="rotate(26 64 104)"><g transform="translate(49 40)">
      <rect x="0" y="0" width="30" height="46" rx="6" fill="#2e8fe6"/>
      <ellipse cx="15" cy="23" rx="11" ry="16" fill="#ffffff" stroke="none" transform="rotate(-20 15 23)"/>
      <text x="15" y="30" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="20" fill="#2e8fe6" stroke="none">5</text>
    </g></g>
  </g>
  <!-- 2-4 oyuncu rozeti -->
  <circle cx="64" cy="110" r="13" fill="#ffffff" opacity="0.95"/>
  <text x="64" y="115" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="10" fill="#3a2f63">2-4</text>
</svg>
