<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kelime Madeni 3D: voxel blok + kazma + kelime kristali -->
  <defs>
    <linearGradient id="km3Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0f2"/>
      <stop offset="100%" stop-color="#5aa8d8"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="16" fill="url(#km3Sky)"/>
  <!-- İzometrik toprak bloğu -->
  <g>
    <polygon points="50,34 78,48 50,62 22,48" fill="#7bc47f"/>
    <polygon points="22,48 50,62 50,92 22,78" fill="#8a5a33"/>
    <polygon points="78,48 50,62 50,92 78,78" fill="#6e4426"/>
    <!-- Üst yüz piksel dokusu -->
    <polygon points="50,40 60,45 50,50 40,45" fill="#92d495" opacity="0.7"/>
    <!-- Yan yüzde cevher benekleri -->
    <rect x="32" y="62" width="6" height="6" fill="#3b3b3b" transform="skewY(12)" opacity="0.85"/>
    <rect x="58" y="58" width="6" height="6" fill="#3b3b3b" transform="skewY(-12)" opacity="0.85"/>
  </g>
  <!-- Kelime kristali -->
  <g>
    <polygon points="76,16 84,28 76,40 68,28" fill="#7df0e2" stroke="#2da89a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="76,20 80,28 76,36 72,28" fill="#b9fff6" opacity="0.8"/>
  </g>
  <!-- Kazma -->
  <g transform="rotate(-38 34 30)">
    <rect x="31.5" y="22" width="5" height="26" rx="2" fill="#8a5a33" stroke="#5a3a1e" stroke-width="1.5"/>
    <path d="M16 22 q18 -12 36 0 q-8 -4 -18 -4 q-10 0 -18 4z" fill="#9fb6c4" stroke="#5d7382" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- ABC etiketi (kelime vurgusu) -->
  <text x="50" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="800"
        text-anchor="middle" fill="#fff" stroke="#33597a" stroke-width="0.6">A→B→C</text>
</svg>
